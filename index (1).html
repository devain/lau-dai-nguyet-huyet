<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lâu Đài Nguyệt Huyết</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a0710;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#c8bcd8;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;overflow:hidden}
  #stage{position:relative;line-height:0;max-width:100%;box-shadow:0 0 0 2px #2a2138,0 0 40px #1b0f2c}
  canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto}
  #pad{width:100%;max-width:760px;display:none;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
  :root{--bs:1}
  .cluster{display:grid;gap:6px;padding:12px;border-radius:16px}
  .dpad{grid-template-columns:repeat(3,calc(54px*var(--bs)));grid-template-rows:repeat(3,calc(46px*var(--bs)))}
  .acts{grid-template-columns:repeat(2,calc(72px*var(--bs)));grid-template-rows:calc(64px*var(--bs))}
  .btn{display:flex;align-items:center;justify-content:center;background:#241b33;border:2px solid #4a3a63;border-radius:9px;
       color:#d8cbe8;font:600 13px/1 ui-monospace,monospace;letter-spacing:.5px}
  .btn:active,.btn.on{background:#6a3050;border-color:#c46a8a;color:#fff}
  .btn.big{font-size:12px}
  #bar{display:flex;gap:8px;font-size:11px;color:#6d5f85;letter-spacing:.5px;
       flex-wrap:nowrap;justify-content:center;align-items:center;width:100%;max-width:100%}
  #bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  @media (max-width:620px){#bar span{display:none}}
  #bar b{color:#a892c4;font-weight:600}
  #bar button{background:#241b33;border:1px solid #5a4a76;color:#b8a8d0;border-radius:6px;
       padding:7px 11px;font:inherit;font-size:12px;flex:0 0 auto;min-height:32px}
  #bar button:active{background:#6a3050;border-color:#c46a8a;color:#fff}
  @media (pointer:coarse){#pad{display:flex}}
  /* ---- màn hình ngang: canvas chiếm hết màn, nút mờ đè lên hai góc dưới ---- */
  @media (orientation:landscape) and (max-height:620px) and (pointer:coarse),
         (orientation:landscape) and (max-height:620px) and (max-width:960px){
    #wrap{padding:0;gap:0}
    #stage{box-shadow:none}
    #pad{position:fixed;left:0;right:0;display:flex;justify-content:space-between;
         align-items:flex-end;gap:0;pointer-events:none;z-index:4;
         bottom:calc(10px + env(safe-area-inset-bottom,0px));
         padding-left:calc(6px + env(safe-area-inset-left,0px));
         padding-right:calc(6px + env(safe-area-inset-right,0px))}
    .cluster{pointer-events:auto;padding:16px 14px}
    .dpad{grid-template-columns:repeat(3,calc(56px*var(--bs)));grid-template-rows:repeat(3,calc(50px*var(--bs)));gap:5px}
    .acts{grid-template-columns:repeat(2,calc(74px*var(--bs)));grid-template-rows:calc(66px*var(--bs));gap:7px}
    .btn{opacity:.62;border-radius:14px;border-width:2px;backdrop-filter:blur(3px);
         box-shadow:0 2px 8px rgba(0,0,0,.45)}
    .btn:active,.btn.on{opacity:1;transform:scale(0.94)}
    #bar{position:fixed;top:4px;left:8px;font-size:10px;gap:6px;z-index:5;opacity:.55}
    #bar:hover,#bar:active{opacity:1}
    #bar span{display:none}
  }
  @media (orientation:landscape) and (max-height:620px) and (max-width:700px){
    .dpad{grid-template-columns:repeat(3,calc(50px*var(--bs)));grid-template-rows:repeat(3,calc(44px*var(--bs)))}
    .acts{grid-template-columns:repeat(2,calc(64px*var(--bs)));grid-template-rows:calc(58px*var(--bs))}
    .btn{font-size:11px} .btn.big{font-size:10px}
  }

  /* nền đặc khi vào toàn màn hình, tránh viền trắng của trình duyệt */
  #wrap:fullscreen, #wrap:-webkit-full-screen{background:#0a0710}
  html:fullscreen, :root:fullscreen{background:#0a0710}
  #note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;
        background:#2a1b3a;border:1px solid #6a4a8a;color:#e0d0f0;border-radius:7px;
        padding:6px 11px;font:600 11px/1.35 ui-monospace,monospace;max-width:88vw;
        text-align:center;display:none}
</style>
</head>
<body>
<div id="note"></div>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="512" height="288"></canvas></div>
  <div id="pad">
    <div class="cluster dpad">
      <i></i><div class="btn" data-k="up">▲</div><i></i>
      <div class="btn" data-k="left">◀</div><i></i><div class="btn" data-k="right">▶</div>
      <i></i><div class="btn" data-k="down">▼</div><i></i>
    </div>
    <div class="cluster acts">
      <div class="btn big" data-k="atk">KIẾM</div>
      <div class="btn big" data-k="jump">NHẢY</div>
    </div>
  </div>
  <div id="bar">
    <button id="menu">☰ Menu</button>
    <button id="fs">⛶ Toàn màn</button>
    <button id="mute">🔊 Nhạc</button>
    <span><b>1–4</b> nhảy màn · <b>C</b> đổi kiếm · <b>Z/J</b> kiếm · <b>X/K</b> nhảy · <b>↑+Z</b> phụ khí · <b>L</b> độ sáng</span>
  </div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const SS=2;                       // supersample factor
cv.width=512*SS; cv.height=288*SS;
ctx.setTransform(SS,0,0,SS,0,0);  // all drawing stays in 512x288 logical space
ctx.imageSmoothingEnabled=false;
const VW=512, VH=288, TW=16, MH=18;

/* ================= INPUT ================= */
const K={left:0,right:0,up:0,down:0,atk:0,jump:0,atkP:0,jumpP:0,upP:0,downP:0,leftP:0,rightP:0,anyP:0};
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyZ:'atk',KeyJ:'atk',KeyX:'jump',KeyK:'jump',Space:'jump',Enter:'jump'};
addEventListener('keydown',e=>{const n=KEYMAP[e.code]; if(!n)return; e.preventDefault(); if(!e.repeat){K[n]=1;K[n+'P']=1;} audioUnlock();},{passive:false});
addEventListener('keyup',e=>{const n=KEYMAP[e.code]; if(!n)return; e.preventDefault(); K[n]=0;},{passive:false});
/* Nút cảm ứng: hit-test theo toạ độ ngón thay vì gắn sự kiện lên từng nút.
   Chạm cảm ứng bị "implicit pointer capture" nên trượt từ ◀ sang ▶ KHÔNG phát
   pointerdown trên ▶ - phải nhấc ngón lên mới đổi được hướng. Đây là cách sửa. */
const BTNS=[...document.querySelectorAll('[data-k]')];
const touchMap=new Map();               // pointerId -> tên nút
let SNAP=34;                            // bán kính hút, nới theo cỡ nút
function btnAt(x,y){
  let best=null,bd=1e9;
  for(const b of BTNS){
    const r=b.getBoundingClientRect();
    if(!r.width) continue;
    const cx=Math.max(r.left,Math.min(x,r.right));
    const cy=Math.max(r.top ,Math.min(y,r.bottom));
    const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    if(d<bd){bd=d;best=b;}
  }
  return bd<=SNAP*SNAP?best:null;
}
function syncTouch(){
  const held=new Set([...touchMap.values()]);
  for(const b of BTNS) b.classList.toggle('on',held.has(b.dataset.k));
  for(const n of ['left','right','up','down','atk','jump']){
    if(held.has(n)){ if(!K[n]){K[n]=1;K[n+'P']=1;} }
    else K[n]=0;
  }
}
function padDown(e){
  const b=btnAt(e.clientX,e.clientY);
  if(!b) return;
  e.preventDefault();
  touchMap.set(e.pointerId,b.dataset.k);
  syncTouch(); audioUnlock();
}
function padMove(e){
  if(!touchMap.has(e.pointerId)) return;
  e.preventDefault();
  const b=btnAt(e.clientX,e.clientY);
  const now=b?b.dataset.k:null;
  if(touchMap.get(e.pointerId)!==now){
    if(now) touchMap.set(e.pointerId,now); else touchMap.delete(e.pointerId);
    syncTouch();
  }
}
function padUp(e){
  if(!touchMap.has(e.pointerId)) return;
  touchMap.delete(e.pointerId); syncTouch();
}
document.getElementById('pad').addEventListener('pointerdown',padDown,{passive:false});
addEventListener('pointermove',padMove,{passive:false});
addEventListener('pointerup',padUp);
addEventListener('pointercancel',padUp);
addEventListener('blur',()=>{touchMap.clear();syncTouch();});
let tap=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(r.width>0) tap={x:(e.clientX-r.left)/r.width*512, y:(e.clientY-r.top)/r.height*288};
  K.anyP=1; audioUnlock();
});
function openMenu(){ if(state==='play'){state='menu';menuSel=0;} else if(state==='menu'){state='play';} }
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();openMenu();}
  if(e.code==='KeyC'||e.code==='KeyQ'){e.preventDefault();if(state==='play')cycleSword(1);}
  if(e.code==='KeyL'){e.preventDefault();lightLv=(lightLv+1)%LIGHTS.length;saveOpt();}
  if(/^Digit[1-7]$/.test(e.code)&&(state==='play'||state==='menu')){
    e.preventDefault(); gotoStage(+e.code.slice(5),false);
  }
  if(e.code==='KeyS'&&(state==='play'||state==='menu')){e.preventDefault();writeSave();}
  if(e.code==='KeyT'&&(state==='title'||state==='gear')){e.preventDefault();gearFrom='title';startTraining();}
  if(e.code==='KeyG'){e.preventDefault();
    if(state==='title'||state==='play'||state==='menu'){ gearFrom=(state==='title')?'title':'menu'; state='gear'; gearRow=0; }
    else if(state==='gear') state=(gearFrom==='menu')?'menu':'title';
  }
  if(e.code==='KeyB'){e.preventDefault();padSize=(padSize+1)%PADS.length;applyPad();saveOpt();}
  if(e.code==='KeyR'&&(state==='play'||state==='menu')){e.preventDefault();state='play';p.cp=0;buildStage(stage);resetStage(true);}
},{passive:false});
function clearEdges(){K.atkP=K.jumpP=K.upP=K.downP=K.leftP=K.rightP=K.anyP=0; tap=null;}

/* ================= AUDIO ================= */
let AC=null, musicOn=true, musicTimer=null, step=0;
function audioUnlock(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;} startMusic(); } if(AC.state==='suspended')AC.resume(); }
function tone(freq,dur,type,vol,slide){
  if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol){
  if(!AC)return; const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
  const b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const g=AC.createGain(); g.gain.value=vol||0.05;
  s.connect(g); g.connect(AC.destination); s.start(t);
}
const SFX={
  whip:()=>{noise(0.06,0.035);tone(760,0.1,'triangle',0.03,2.0);},
  dash:()=>{noise(0.12,0.05);tone(240,0.14,'sawtooth',0.045,2.6);},
  drain:()=>{tone(180,0.16,'sine',0.05,2.4);setTimeout(()=>tone(520,0.1,'triangle',0.03,0.5),60);},
  iai:()=>{noise(0.045,0.03);tone(1500,0.07,'triangle',0.03,0.35);
    setTimeout(()=>tone(2100,0.16,'sine',0.022,0.6),40);},
  jump:()=>tone(300,0.12,'square',0.04,2.2),
  hit:()=>{noise(0.07,0.07);tone(150,0.1,'square',0.05,0.5);},
  hurt:()=>tone(260,0.28,'sawtooth',0.06,0.35),
  item:()=>{tone(880,0.07,'square',0.05);setTimeout(()=>tone(1320,0.1,'square',0.05),70);},
  candle:()=>tone(500,0.05,'square',0.03,1.6),
  throw:()=>tone(700,0.07,'triangle',0.04,1.5),
  boss:()=>tone(90,0.5,'sawtooth',0.07,0.6),
  die:()=>{[400,330,260,180].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'square',0.06),i*130));},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'square',0.06),i*140));}
};
/* ================= NHẠC: mỗi vùng một bài, boss có nhạc riêng ================= */
// ch = 4 hợp âm (MIDI), mel = 32 nốt giai điệu (0 = nghỉ), ms = độ dài một nhịp
const TRACKS={
  title :{ms:175, lead:'triangle', drum:'soft',  lv:0.030,
    ch:[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,56,59]],
    mel:[72,0,71,0,69,0,71,0, 69,0,68,0,65,0,68,0, 67,0,71,0,74,0,71,0, 68,0,71,0,68,0,64,0]},
  castle:{ms:150, lead:'square',   drum:'march', lv:0.022,     // màn 1-3: hành khúc gothic La thứ
    ch:[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,56,59]],
    mel:[69,72,76,72,74,72,71,69, 65,69,72,69,71,69,68,64, 67,71,74,71,76,74,72,71, 68,71,76,74,72,71,68,64]},
  tower :{ms:128, lead:'square',   drum:'drive', lv:0.022,     // màn 4: Rê thứ, dồn dập như bánh răng
    ch:[[50,62,65,69],[46,58,62,65],[48,60,64,67],[45,57,61,64]],
    mel:[74,77,81,77,79,77,76,74, 70,74,77,74,76,74,72,70, 72,76,79,76,81,79,77,76, 73,76,79,81,79,76,73,69]},
  hall  :{ms:165, lead:'triangle', drum:'slow',  lv:0.032,     // màn 5: Mi thứ hoà âm, trang nghiêm
    ch:[[40,52,55,59],[36,48,52,55],[45,57,60,64],[47,59,63,66]],
    mel:[76,0,79,76,83,0,81,79, 72,0,76,79,81,79,76,72, 81,0,84,81,79,76,72,76, 75,0,78,81,83,81,78,75]},
  abyss :{ms:190, lead:'sine',     drum:'none',  lv:0.040,     // màn 6-7: Đô thứ, thưa, lạnh
    ch:[[48,60,63,67],[44,56,60,63],[41,53,56,60],[43,55,59,62]],
    mel:[72,0,0,75,0,0,79,0, 68,0,0,72,0,0,75,0, 65,0,0,68,0,72,0,0, 67,0,71,0,74,0,0,71]},
  boss  :{ms:112, lead:'sawtooth', drum:'boss',  lv:0.020,     // boss: bass nửa cung, trống dày
    ch:[[40,52,55,59],[41,53,56,60],[40,52,55,59],[39,51,54,58]],
    mel:[76,75,76,79,76,75,76,71, 77,76,77,80,77,76,77,72, 76,75,76,79,83,82,83,79, 75,74,75,78,75,78,82,87]},
  final :{ms:100, lead:'sawtooth', drum:'boss',  lv:0.020,     // trùm cuối: nhanh hơn, cao hơn
    ch:[[36,48,51,55],[37,49,52,56],[36,48,51,55],[35,47,50,54]],
    mel:[84,83,84,87,84,83,84,79, 85,84,85,88,85,84,85,80, 84,87,91,87,84,87,91,96, 83,86,90,86,83,86,90,95]}
};
const DRUMS={            // 8 nhịp mỗi hợp âm: k = kick, s = snare, h = hi-hat
  soft :{k:[0],       s:[],      h:[4]},
  march:{k:[0,4],     s:[2,6],   h:[1,3,5,7]},
  drive:{k:[0,3,4],   s:[2,6],   h:[0,1,2,3,4,5,6,7]},
  slow :{k:[0],       s:[4],     h:[2,6]},
  boss :{k:[0,2,4,6], s:[2,6],   h:[0,1,2,3,4,5,6,7]},
  none :{k:[],        s:[],      h:[]}
};
const mid=n=>440*Math.pow(2,(n-69)/12);
let curTrack='title', musicLoop=null;
function wantTrack(){
  if(state==='title'||state==='gear'||state==='story') return 'title';
  if(boss&&boss.alive) return stage===7?'final':'boss';
  return ['castle','castle','castle','tower','tower','hall','abyss','abyss'][stage]||'castle';
}
function kick(){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.18); }
function musicTick(){
  const want=wantTrack();
  if(want!==curTrack){ curTrack=want; step=0; }      // đổi bài thì về nhịp đầu
  const T=TRACKS[curTrack];
  if(musicOn&&AC&&AC.state==='running'){
    const ci=Math.floor(step/8)%4, ch=T.ch[ci], s8=step%8;
    if(s8===0) tone(mid(ch[0]-24),T.ms*4.2/1000,'sine',0.05);             // nền trầm
    if(s8%2===0) tone(mid(ch[0]-12),T.ms*1.1/1000,'triangle',0.045);
    tone(mid(ch[1+(s8%3)]-12),T.ms*0.8/1000,'square',0.016);               // rải hợp âm
    const m=T.mel[step%32];
    if(m) tone(mid(m-12),T.ms*1.7/1000,T.lead,T.lv);
    const D=DRUMS[T.drum];
    if(D.k.includes(s8)) kick();
    if(D.s.includes(s8)) noise(0.07,curTrack==='boss'||curTrack==='final'?0.05:0.035);
    if(D.h.includes(s8)) noise(0.018,0.012);
  }
  step++;
  musicLoop=setTimeout(musicTick,TRACKS[curTrack].ms);   // tempo đọc lại mỗi nhịp
}
function startMusic(){
  if(musicLoop) clearTimeout(musicLoop);
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  musicTick();
}
document.getElementById('menu').onclick=()=>{openMenu();audioUnlock();};
document.getElementById('mute').onclick=()=>{musicOn=!musicOn;document.getElementById('mute').textContent=(musicOn?'🔊':'🔇')+' Nhạc';audioUnlock();};

/* ================= BẢNG ĐIỂM CAO (window.storage) ================= */
const SKEY='nguyethuyet:scores:v2';
const OKEY='nguyethuyet:opt:v1';
const PKEY='nguyethuyet:prof:v1';
const RKEY='nguyethuyet:run:v1';
let hiScores=[], hiReady=false, hiErr='', lastRank=-1, submitted=false;
async function loadScores(){
  try{
    if(!window.storage){ hiErr='không có bộ lưu'; hiReady=true; return; }
    const r=await window.storage.get(SKEY);
    if(r&&r.value){ const v=JSON.parse(r.value); if(Array.isArray(v)) hiScores=v; }
  }catch(e){ /* chưa có bản ghi nào - không phải lỗi */ }
  try{
    if(window.storage){
      const o=await window.storage.get(OKEY);
      if(o&&o.value){ const v=JSON.parse(o.value); if(typeof v.light==='number') lightLv=Math.max(0,Math.min(2,v.light));
        if(typeof v.pad==='number') padSize=Math.max(0,Math.min(3,v.pad));
        if(typeof v.max==='number') maxStage=Math.max(1,Math.min(7,v.max));
        if(typeof v.dmg==='boolean') dmgNums=v.dmg;
        selStage=maxStage;
        applyPad(); }
    }
  }catch(e){}
  try{
    if(window.storage){
      const r=await window.storage.get(PKEY);
      if(r&&r.value){ const v=JSON.parse(r.value);
        if(v&&typeof v.lv==='number'){
          prof.lv=Math.max(1,Math.min(LVMAX,v.lv)); prof.xp=Math.max(0,v.xp||0);
          if(Array.isArray(v.gear)) prof.gear=v.gear.map((g,i)=>Math.max(0,Math.min(3,g|0)));
          if(Array.isArray(v.skin)) prof.skin=v.skin.map(g=>Math.max(0,Math.min(3,g|0)));
          if(Array.isArray(v.owned)) v.owned.forEach((o,i)=>{ if(i<NSW) prof.owned[i]=!!o; });
          if(Array.isArray(v.wlv)) v.wlv.forEach((o,i)=>{ if(i<NSW) prof.wlv[i]=Math.max(0,Math.min(WMAXLV,o|0)); });
          if(typeof v.startW==='number'&&prof.owned[v.startW]) prof.startW=v.startW;
          prof.found=v.found|0; prof.owned[0]=true;
        } }
    }
  }catch(e){}
  try{
    if(window.storage){
      const r=await window.storage.get(RKEY);
      if(r&&r.value){

function wrapLines(txt,maxW){

  }
  if(ln)out.push(ln);
  return out;
}

// Không bao giờ để người chơi hồi sinh giữa không trung hoặc trên gai:
// dò ngang tối đa 40 ô để tìm chỗ đứng vững gần nhất.
// Bục dọc không được phép hạ xuống chạm gai hoặc chui khỏi đáy bản đồ.
// Dò từ điểm cao nhất xuống, tìm chướng ngại đầu tiên rồi kẹp lại cách 24px.
// Kích thước thân từng loại địch, phải khớp với makeEnemy: [rộng, cao, lệch y, cần đất]
const ESIZE={zombie:[13,24,0,1], skel:[14,24,0,1], hunch:[14,20,0,1],
             armor:[16,26,0,1],  shade:[12,26,0,1], bat:[22,16,-8,0],
             medusa:[19,16,-8,0], gargoyle:[18,22,0,0], chandelier:[26,14,-16,0],
             fish:[15,20,0,0], eye:[18,18,-24,0], dummy:[16,30,0,1], dummyF:[14,24,0,1], dummyS:[16,30,0,1]};
function bodyFree(x,y,w,h){
  const l=Math.floor((x-w/2+2)/TW), r=Math.floor((x+w/2-2)/TW);
  const top=Math.floor((y-h+2)/TW), bot=Math.floor((y-1)/TW);
  for(let ty=top;ty<=bot;ty++) for(let tx=l;tx<=r;tx++) if(solid(tx,ty)) return false;
  return true;
}
function hasGround(x,y,w){
  const fy=Math.floor(y/TW);
  const l=Math.floor((x-w/2+2)/TW), r=Math.floor((x+w/2-2)/TW);
  for(let tx=l;tx<=r;tx++) if(solid(tx,fy)) return true;
  return false;
}
/* Không để con nào kẹt trong tường hay lơ lửng: dò ra xung quanh tìm chỗ hợp lệ,
   ưu tiên xuống dưới trước (địch đi đất thì rơi xuống sàn là hợp lý nhất). */
/* Nến phải tựa lên sàn/bục/tường, không treo giữa không khí.
   Dò xuống rồi dò ngang tìm ô có chỗ đứng gần nhất mà vẫn chém tới được. */
// Nến phải đứng trên mặt sàn mà người chơi cũng đứng được:
// ô của nến trống, ô ngay dưới đặc và KHÔNG phải gai (đứng trên gai thì chém không tới).
function candleSupported(tx,ty){
  if(ty<1||ty>=MH-1) return false;
  const here=grid[ty][tx], below=grid[ty+1][tx];
  if(here===1||here===2||here===6||here===7) return false;
  return (below===1||below===2||below===6||below===7);
}
function fixCandles(){
  for(const c of candleDefs){
    let tx=Math.floor(c.x/TW), ty=Math.floor(c.y/TW);
    if(candleSupported(tx,ty)) continue;
    let done=false;
    for(let dy=1;dy<=6&&!done;dy++){                 // hạ xuống trước
      const ny=ty+dy;
      if(ny>=MH-1) break;
      if(grid[ny][tx]&&grid[ny][tx]!==8) break;      // gặp vật cản thì dừng
      if(candleSupported(tx,ny)){ ty=ny; done=true; }
    }
    for(let dx=1;dx<=5&&!done;dx++){                 // rồi dò ngang
      for(const s2 of [-dx,dx]){
        const nx=tx+s2;
        if(nx<2||nx>=MW-2) continue;
        for(let dy=0;dy<=4;dy++){
          const ny=ty+dy;
          if(ny>=MH-1) break;
          if(grid[ny][nx]&&grid[ny][nx]!==8) break;
          if(candleSupported(nx,ny)){ tx=nx; ty=ny; done=true; break; }
        }
        if(done) break;
      }
    }
    if(done){ c.x=tx*TW+8; c.y=ty*TW+14; }
    else c.dead=1;                                    // hết cách thì bỏ cây nến đó
  }
  candleDefs=candleDefs.filter(c=>!c.dead);
}
/* Tự bảo đảm mọi bục đều tới được bằng nhân vật YẾU HƠN (Kiên).
   Dựng đồ thị mặt đứng, BFS từ checkpoint đầu, chỗ nào không tới thì
   CHÈN THÊM một bục cầu 2 ô ở giữa - chỉ thêm, không dịch bục cũ. */
function reachRuns(){
  const r=[];
  for(let y=0;y<MH;y++){ let s0=null;
    for(let x=0;x<=MW;x++){
      const t=(x<MW)?grid[y][x]:0;
      const ok=x<MW&&solid(x,y)&&!solid(x,y-1)&&t!==5&&t!==11;
      if(ok&&s0===null)s0=x;
      if(!ok&&s0!==null){ r.push({L:s0*TW,R:x*TW,top:y*TW,w:x-s0}); s0=null; } } }
  for(const m of moverDefs){
    if(m.axis==='x') r.push({L:m.x0,R:m.x0+m.w+m.span,top:m.y0,mover:1});
    else { r.push({L:m.x0,R:m.x0+m.w,top:m.y0,mover:1});
           r.push({L:m.x0,R:m.x0+m.w,top:m.y0+m.span,mover:1}); } }
  return r;
}
function jumpReach(rise){
  const d=JMP0*JMP0-0.64*rise;
  return d<0?-1:SPD0*(JMP0+Math.sqrt(d))/0.32;
}
function gapOf(a,b){ if(b.L>=a.R)return b.L-a.R; if(a.L>=b.R)return a.L-b.R; return 0; }
function linked(a,b){ const g=gapOf(a,b), d=jumpReach(a.top-b.top); return d>=0&&d>=Math.max(0,g-4); }
function freeSpan(tx,ty,w){
  for(let i=0;i<w;i++){ const x=tx+i;
    if(x<2||x>=MW-2) return false;
    if(grid[ty][x]||grid[ty-1][x]||(ty+1<MH&&grid[ty+1][x])) return false; }
  return true;
}
let bridgeLog=[];
// Cầu thang nối mặt dưới với mặt trên: phải coi là một đường đi,
// không thì tầng trên chỉ lên được bằng thang sẽ bị tưởng là "không tới được"
function runAt(runs,x,y){
  return runs.findIndex(r=>!r.mover&&x>=r.L-10&&x<=r.R+10&&Math.abs(r.top-y)<6);
}
function stairLinks(runs){
  const out=[];
  for(const st of stairs){
    const a=runAt(runs,st.pts[0].x,st.pts[0].y), b=runAt(runs,st.pts[st.pts.length-1].x,st.pts[st.pts.length-1].y);
    if(a>=0&&b>=0&&a!==b) out.push([a,b]);
  }
  return out;
}
function fixReach(){
  bridgeLog=[];
  for(let pass=0;pass<26;pass++){
    const runs=reachRuns();
    const c0=CHECK[0];
    let s0=runs.findIndex(r=>c0.x>=r.L-8&&c0.x<=r.R+8&&Math.abs(r.top-c0.y)<10);
    if(s0<0) s0=runs.reduce((b,r,i)=>(r.R-r.L)>(runs[b].R-runs[b].L)?i:b,0);
    const adj=runs.map(()=>[]);
    for(let i=0;i<runs.length;i++)for(let j=0;j<runs.length;j++)
      if(i!==j&&gapOf(runs[i],runs[j])<=230&&linked(runs[i],runs[j])) adj[i].push(j);
    for(const [a,b] of stairLinks(runs)){ adj[a].push(b); adj[b].push(a); }
    const seen=new Set([s0]), q=[s0];
    while(q.length){ const c=q.pop(); for(const n of adj[c]) if(!seen.has(n)){seen.add(n);q.push(n);} }
    const bad=runs.map((r,i)=>({r,i})).filter(o=>!seen.has(o.i)&&!o.r.mover&&o.r.w<=8);
    if(!bad.length) return;
    // chọn bục hỏng gần nhất với vùng đã tới được, rồi chèn cầu
    let best=null;
    for(const o of bad) for(const i of seen){
      const a=runs[i], b=o.r, g=gapOf(a,b);
      if(g>200) continue;
      if(!best||g<best.g) best={a,b,g};
    }
    if(!best) return;
    const {a,b}=best;
    const midX=Math.round(((a.R<b.L?(a.R+b.L)/2:(b.R+a.L)/2))/TW)-1;
    let placed=false;
    for(const ty of [Math.round((a.top+b.top)/2/TW)-1, Math.round(b.top/TW)-1, Math.round(a.top/TW)-1]){
      if(ty<2||ty>=MH-2) continue;
      for(const dx of [0,-1,1,-2,2]){
        if(freeSpan(midX+dx,ty,2)){ box(midX+dx,ty,2,1,2); bridgeLog.push([midX+dx,ty]); placed=true; break; }
      }
      if(placed) break;
    }
    if(!placed) return;
  }
}
/* Gai bị vùi dưới sàn đặc thì không ai chạm tới được, chỉ làm bẩn hình.
   Xoá sạch sau mỗi lần dựng màn - kể cả gai bị bục cầu tự chèn che mất. */
/* Dưới mọi ô sàn sụp phải có gai hứng, nếu không thì sụp xuống là rơi
   thông đáy bản đồ và chết - đúng cái mà cơ chế này không nên phạt. */
function fixFragile(){
  for(let y=0;y<MH-1;y++)for(let x=0;x<MW;x++){
    if(grid[y][x]!==7) continue;
    let openAll=true, land=-1;
    for(let ty=y+1;ty<MH;ty++){
      if(grid[ty][x]){ openAll=false; land=ty; break; }
    }
    if(openAll) grid[MH-1][x]=5;                   // lót gai ở hàng cuối
    else if(grid[land][x]===5){ /* đã có gai */ }
  }
}
function fixSpikes(){
  const SOL=[1,2,6,7];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(grid[y][x]!==5) continue;
    const above=(y>0)?grid[y-1][x]:0;
    if(SOL.includes(above)) grid[y][x]=1;          // hoá thành gạch thường
  }
}
/* Tỉa bớt nến và đuốc cho thoáng mắt, nhưng:
   - nến chứa đồ quan trọng giữ nguyên
   - bục trên không không được tối lại (lỗi "đứng giữa hư không" cũ)
   - bù lại tim cho nến thường còn lại */
function thinLights(){
  const MINC=6*TW, MINT=12*TW;
  const isKey=c=>c.item&&c.item!=='heart';
  const keep=candleDefs.filter(isKey);
  for(const c of candleDefs.filter(c=>!isKey(c)).sort((a,b)=>a.x-b.x))
    if(keep.every(k=>Math.abs(k.x-c.x)>=MINC)) keep.push(c);
  keep.sort((a,b)=>a.x-b.x);
  keep.forEach((c,i)=>{ if(c.item==='heart'&&i%5<2) c.item='heart5'; });   // bù tim
  candleDefs=keep;

  const all=torches.slice().sort((a,b)=>a.x-b.x), kept=[];
  for(const t of all){
    if(kept.some(k=>Math.abs(k.x-t.x)<MINT)) continue;
    if(candleDefs.some(c=>Math.abs(c.x-t.x)<3*TW&&Math.abs(c.y-t.y)<64)) continue;
    kept.push(t);
  }
  // mặt đứng trên không nào bị tối thì trả lại ngọn đuốc gần nó nhất
  const lit=(cx,cy)=>kept.some(t=>Math.hypot(t.x-cx,t.y-8-cy)<84*0.85)
                  ||candleDefs.some(c=>Math.hypot(c.x-cx,c.y-cy)<74*0.85);
  for(let y=2;y<15;y++) for(let x=0;x<MW;x++){
    const t=grid[y][x];
    if(![1,2,6,7].includes(t)||(grid[y-1][x]&&grid[y-1][x]!==8)) continue;
    if(stage===7) continue;                         // màn 7 đã tự phát sáng
    const cx=x*TW+8, cy=y*TW;
    if(lit(cx,cy)) continue;
    let best=null,bd=1e9;
    for(const o of all){ if(kept.includes(o)) continue;
      const d=Math.hypot(o.x-cx,o.y-8-cy); if(d<bd){bd=d;best=o;} }
    if(best&&bd<84*0.85) kept.push(best);            // đuốc cũ phải thật sự soi tới bục
    else kept.push({x:cx,y:Math.max(2,y-3)*TW+10});    // không có đuốc cũ nào gần: đặt mới ngay trên bục
  }
  torches=kept;
}
function collectSpecial(){
  waterTiles=[]; phaseTiles=[]; voidTiles=[]; glowTiles=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=grid[y][x];
    if(t===8) waterTiles.push({x,y,top:y===0||grid[y-1][x]!==8});
    else if(t===9||t===10) phaseTiles.push({x,y,k:t===10?1:0});
    else if(t===11) voidTiles.push({x,y});
    // màn 7: mọi mặt đứng trên hư không là "ánh trăng đặc lại", tự phát sáng
    if(stage===7&&y<15&&(t===1||t===2)&&(y===0||!grid[y-1][x])) glowTiles.push({x,y});
  }
}
function fixSpawns(){
  for(const d of spawnDefs){
    const S=ESIZE[d.type]; if(!S) continue;
    const w=S[0], h=S[1], dy=S[2], needG=S[3];
    const ok=(x,y)=>bodyFree(x,y+dy,w,h)&&(!needG||hasGround(x,y+dy,w));
    if(ok(d.x,d.y)) continue;
    const tx0=Math.floor(d.x/TW), ty0=Math.round(d.y/TW)-1;
    let done=false;
    for(let rx=0;rx<=6&&!done;rx++){
      for(const sx of (rx?[-rx,rx]:[0])){
        const tx=tx0+sx;
        if(tx<2||tx>=MW-2) continue;
        const nx=tx*TW+8;
        for(let ry=0;ry<=MH&&!done;ry++){
          for(const sy of (ry?[ry,-ry]:[0])){       // xuống trước, rồi lên
            const ty=ty0+sy;
            if(ty<1||ty>=MH-1) continue;
            const ny=(ty+1)*TW;
            if(ok(nx,ny)){ d.x=nx; d.y=ny; done=true; break; }
          }
        }
        if(done) break;
      }
    }
  }
}
function fixMovers(){
  for(const m of moverDefs){
    if(m.axis!=='y') continue;
    const cx=m.x0+m.w/2, tx=Math.floor(cx/TW);
    let stop=MH*TW;                                   // mặc định: đáy bản đồ
    for(let ty=Math.floor(m.y0/TW)+1;ty<MH;ty++){
      if(grid[ty][tx]===5||solid(tx,ty)){ stop=ty*TW; break; }
    }
    const maxLow=stop-24;
    if(m.y0+m.span>maxLow) m.span=Math.max(32,maxLow-m.y0);
    if(m.y0+m.span>maxLow) m.y0=Math.max(TW*2,maxLow-32), m.span=32;
  }
}
function fixCheckpoints(){
  for(const c of CHECK){
    if(footing(c.x,c.y)) continue;
    let best=null;
    for(let d=1;d<=40&&!best;d++){
      for(const s of [1,-1]){
        const nx=c.x+s*d*TW;
        if(nx<TW*2||nx>(MW-2)*TW) continue;
        for(const ny of [c.y,240,160]) if(footing(nx,ny)){ best={x:nx,y:ny}; break; }
        if(best) break;
      }
    }
    if(best){ c.x=best.x; c.y=best.y; }
  }
}

function collideX(e,dx){
  e.x+=dx;
  const t=Math.floor((e.y-e.h+2)/TW), b=Math.floor((e.y-1)/TW);
  if(dx>0){const tx=Math.floor((e.x+e.w/2)/TW); for(let ty=t;ty<=b;ty++) if(solid(tx,ty)){e.x=tx*TW-e.w/2-0.01;e.bumpX=1;return;}}
  else if(dx<0){const tx=Math.floor((e.x-e.w/2)/TW); for(let ty=t;ty<=b;ty++) if(solid(tx,ty)){e.x=(tx+1)*TW+e.w/2+0.01;e.bumpX=-1;return;}}
}
function collideY(e,dy){
  e.y+=dy;
  const l=Math.floor((e.x-e.w/2+2)/TW), r=Math.floor((e.x+e.w/2-2)/TW);
  if(dy>0){const ty=Math.floor(e.y/TW); for(let tx=l;tx<=r;tx++) if(solid(tx,ty)){e.y=ty*TW;e.vy=0;e.onGround=true;return;}}
  else if(dy<0){const ty=Math.floor((e.y-e.h)/TW); for(let tx=l;tx<=r;tx++) if(solid(tx,ty)){e.y=(ty+1)*TW+e.h;e.vy=0.5;return;}}
}
function step2(e,dx,dy){
  let n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/4));
  e.onGround=false;
  for(let i=0;i<n;i++){collideX(e,dx/n); collideY(e,dy/n);}
}

function baseSwords(){
  const a=new Array(NSW).fill(false); a[0]=true;
  if(prof.owned) for(let i=0;i<NSW;i++) if(prof.owned[i]) a[i]=true;
  return a;
}
function ownCount(){ return p.swords.reduce((n,v)=>n+(v?1:0),0); }
function cycleSword(dir){
  if(ownCount()<2||p.atk>0||p.thr>0||p.dead) return false;
  let i=p.whip;
  for(let k=0;k<SWORDNAME.length;k++){
    i=(i+dir+SWORDNAME.length)%SWORDNAME.length;
    if(p.swords[i]){ p.whip=i; p.drainT=0; p.hitDone=true;
      i===3?SFX.iai():(i===BLOOD?SFX.drain():SFX.whip());
      popText(p.x,p.y-36,SWSHORT[i]); return true; }
  }
  return false;
}
function grantSword(i,equip){

  if(equip!==false){ p.whip=i; p.drainT=0; }
  return isNew;
}

      p.drainT=0;

    }
  } else p.drainT=0;

  // stairs
  if(p.stair){
    const st=p.stair; let mv=0;

    const des = K.down || (st.dir>0?K.left:K.right);
    if(p.atk<=0){
      if(asc)mv=1; else if(des)mv=-1;
      if(mv){ p.s+=mv*0.095; p.anim+=0.16; p.face=(st.dir*mv>0)?1:-1; }
    }
    if(K.jumpP){ // thoát khỏi cầu thang

    }
    if(p.s<=0){p.stair=null; p.x=st.pts[0].x; p.y=st.pts[0].y; p.stairCool=6;}
    else if(p.s>=st.pts.length-1){p.stair=null; const q=st.pts[st.pts.length-1]; p.x=q.x; p.y=q.y; p.stairCool=6;}
    else{
      const i=Math.floor(p.s), f=p.s-i, a=st.pts[i], b=st.pts[i+1];

        }
      }
    }
    if(comboT>0){ comboT--; if(comboT===0) combo=0; }
  if(p.dashCd>0)p.dashCd--;
    if(p.onGround)p.airDash=false;
    if(hero===0&&!p.stair&&K.atkP&&K.down&&p.dash<=0&&p.dashCd<=0&&p.atk<=0&&p.thr<=0
       &&(p.onGround||!p.airDash)){
      K.atkP=0;                                    // nuốt phím, không chém thường
      p.dash=DASH_T; p.dashHit=new Set(); p.crouch=false;
      if(!p.onGround)p.airDash=true;

      // xuyên qua địch: mỗi con trúng một lần mỗi cú lao

          p.dashHit.add(e.uid); damage(e,DASH_DMG);    // xuyên qua, không đẩy lùi
        }
      }
      if(boss&&boss.alive&&!p.dashHit.has('boss')&&Math.abs(boss.x-p.x)<24&&boss.y-40<p.y&&boss.y>p.y-26){
        p.dashHit.add('boss'); damage(boss,DASH_DMG);
      }
      if(p.bumpX||p.dash===0){ p.dash=0; p.dashCd=DASH_CD; p.vx=p.face*1.2; }
    }
    if(!p.stair&&p.dash<=0){
      p.crouch=p.onGround&&K.down&&p.atk<=0?true:(p.onGround&&K.down);
      const wet=inWater(p.x,p.y-8);
      if(wet&&!p.wetLast){ for(let i=0;i<10;i++)burst(p.x,p.y-6,'#6ab4d8',1,2); SFX.candle(); }
      p.wetLast=wet;

      if(p.jbuf>0&&p.coyote>0&&!p.crouch&&p.knock<=0){
        p.vy=-curJmp()*(wet?0.76:1); p.onGround=false; p.jbuf=0; p.coyote=0; SFX.jump();
      }
      p.vy+=wet?0.19:0.32; if(p.vy>(wet?4.2:9))p.vy=wet?4.2:9;

        for(let tx=Math.floor((p.x-5)/TW);tx<=Math.floor((p.x+5)/TW);tx++){

          const k=tx+','+fy;

      const fty=Math.floor(p.y/TW), ftx=Math.floor(p.x/TW);
      const onPhase=(fty<MH&&ftx<MW&&ftx>=0)&&(grid[fty][ftx]===9||grid[fty][ftx]===10);
      if(p.onGround&&!ride&&!onPhase&&footing(p.x,p.y)){ p.safeX=p.x; p.safeY=p.y; }

      if(!p.dead&&inVoid){

        for(let i=0;i<8;i++)burst(sx,sy-14,'#8fa4ff',1,2);

    if(ST==='thrust')      box={x:p.face>0?p.x+2:p.x-2-len, y:hy-4,  w:len,    h:10};
    else if(ST==='smash')  box={x:p.face>0?p.x+2:p.x-2-len, y:hy-14, w:len,    h:34};
    else if(ST==='arc')    box={x:p.face>0?p.x-8:p.x-len-2, y:hy-32, w:len+10, h:46};
    else                   box={x:p.face>0?p.x+2:p.x-2-len, y:hy-11, w:len,    h:24};
    const tipLo=p.face>0?box.x+box.w-18:box.x, tipHi=tipLo+18;
    let hit=false;
    for(const c of candles) if(c.alive&&box.x<c.x+5&&box.x+box.w>c.x-5&&box.y<c.y+8&&box.y+box.h>c.y-10){
      c.alive=false; SFX.candle(); burst(c.x,c.y,'#ffb24a',10,2); dropItem(c.x,c.y-4,c.item); score+=100; gainXP(1);
    }
    for(const e of enemies) if(e.alive&&box.x<e.x+e.w/2&&box.x+box.w>e.x-e.w/2&&box.y<e.y&&box.y+box.h>e.y-e.h){
      let d=dmg;
      if(ST==='whip'&&e.x>=tipLo&&e.x<=tipHi) d+=2;           // trúng đầu roi
      if(FX==='crit'&&Math.random()<0.25){ d=Math.round(d*2.5); dmgText(e.x,e.y-e.h-6,'CHÍ MẠNG','hurt'); }
      damage(e,d); hit=true; if(p.swingHits) p.swingHits[e.uid]=99999;
      if(FX==='gale'&&e.alive){ e.x+=p.face*26; burst(e.x,e.y-10,'#c8ffe8',4,2); }
      if(FX==='burn'&&e.alive) e.burn=180;
      if(FX==='bolt') strikeBolt(e,WP);
      if(!e.alive){
        if(FX==='boom') explode(e.x,e.y-(e.h||20)/2,e);
        if(FX==='soul'){ soulN=Math.min(6,soulN+1); soulT=300; dmgText(p.x,p.y-38,'HỒN +'+soulN,'boss'); }
      }
      if(ST==='combo'&&combo===3&&e.alive) e.x+=p.face*14;    // đòn kết đánh bật
      if(ST==='smash'&&e.alive) e.x+=p.face*8;
    }
    for(const s of shots) if(!s.friendly&&s.breakable&&box.x<s.x+s.w/2&&box.x+box.w>s.x-s.w/2&&box.y<s.y+s.h/2&&box.y+box.h>s.y-s.h/2){
      if(FX==='reflect'){                                    // đánh ngược về phía địch
        s.friendly=1; s.vx=p.face*Math.max(3,Math.abs(s.vx)*1.3); s.vy=-Math.abs(s.vy)*0.3;
        s.g=0; s.home=0; s.dmg=(s.dmg||3)+2; s.life=Math.max(s.life,80);
        burst(s.x,s.y,'#c8dcff',8,2.2); SFX.iai(); score+=80;
      } else { s.life=0; burst(s.x,s.y,'#dcd2e8',6,2); score+=50; }
    }
    if(boss&&boss.alive&&box.x<boss.x+19&&box.x+box.w>boss.x-19&&box.y<boss.y&&box.y+box.h>boss.y-36){
      let d=(ST==='whip'&&boss.x>=tipLo&&boss.x<=tipHi)?dmg+2:dmg;
      if(FX==='slayer') d*=2;                                   // Gram diệt long
      if(FX==='crit'&&Math.random()<0.25){ d=Math.round(d*2.5); dmgText(boss.x,boss.y-50,'CHÍ MẠNG','hurt'); }
      damage(boss,d); hit=true;
      if(FX==='burn') boss.burn=180;
      if(FX==='bolt') strikeBolt(boss,WP);
    }
    if(hit){
      p.hitDone=true;
      if(p.whip===BLOOD&&p.hp<p.maxhp){
        p.hp=Math.min(p.maxhp,p.hp+1);
        SFX.drain();
        dmgText(p.x,p.y-34,'+1','heal');
      }
    }
  }

  // falling / timer death
  if(p.y>MH*TW+40&&!p.dead) killPlayer(true);
  if(p.hp<=0&&!p.dead) killPlayer(false);
}
function killPlayer(pit){
  if(training){ p.hp=p.maxhp; p.inv=60; p.x=72; p.y=240; p.vx=p.vy=0; return; }
  p.dead=true; p.vy=pit?2:-4; p.deadT=0; SFX.die();
}
function hurtPlayer(dmg,fromX){
  if(p.inv>0||p.dead)return;
  if(W[p.whip].fx==='turtle'&&Math.random()<0.25){        // rùa vàng đỡ trọn đòn
    p.inv=45; dmgText(p.x,p.y-34,'KIM QUY HỘ THỂ','heal'); SFX.item();
    for(let i=0;i<14;i++) burst(p.x,p.y-14,i%2?'#e8c860':'#4a9a78',1,2.6);
    return;
  }
  dmg=Math.max(1,dmg-curDef());
  p.hp-=dmg; p.inv=90; p.blink=true; p.thr=0; p.atk=0; SFX.hurt();
  dmgText(p.x,p.y-32,'-'+dmg,'hurt');
  shake=10; hitStop=Math.max(hitStop,7); flash=Math.max(flash,10); flashRed=true;
  p.stair=null;
  p.knock=14; p.vx=(p.x<fromX?-1:1)*1.35; p.vy=-2.8; p.onGround=false;
  if(p.hp<=0)killPlayer(false);
}
/* ================= RƠI ĐỒ ================= */
// quái càng khó càng hay rơi; màn càng sâu càng dễ ra đồ hiếm
const DROPRATE={zombie:0.03,bat:0.03,skel:0.06,hunch:0.06,fish:0.06,medusa:0.06,
                armor:0.11,gargoyle:0.11,shade:0.12,eye:0.12};
function rollRarity(minR,noMyth){
  const st=stage||1;
  const w=[Math.max(10,62-st*3.4), 27+st*1.6, 9+st*1.3, 2+st*0.5, noMyth?0:Math.max(0,st-2)*0.35];
  for(let r=0;r<minR;r++) w[r]=0;
  let x=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let r=0;r<5;r++){ x-=w[r]; if(x<=0) return r; }
  return 3;
}
// boss: màn càng sâu càng có cơ hội ra thần khí, trùm cuối 25%
function bossRarity(){
  const mythic=[0,0,0,0,0.03,0.08,0.12,0.25][stage]||0;
  if(Math.random()<mythic) return 4;
  return rollRarity(stage>=7?3:(stage>=4?2:1),true);
}
function pickWeapon(r){
  const pool=W.map((_,i)=>i).filter(i=>W[i].r===r);
  return pool[Math.floor(Math.random()*pool.length)];
}
function dropWeapon(x,y,minR){
  if(training) return;
  const r=rollRarity(minR||0), w=pickWeapon(r);
  items.push({x,y:Math.min(y,226),vy:0,t:'wpn',wi:w,rar:r,life:1800,w:12,h:12,hover:1});
  if(r>=2){ flash=Math.max(flash,8); SFX.item(); }
}
let lootT=0, lootMsg='', lootCol='#fff', lootMyth=false;
let dryKills=0;                // số mạng hạ liên tiếp chưa ra vũ khí
let training=false;            // đang ở Bãi tập: không lưu, không rơi đồ, không chết
// Ragnarök: sét giáng xuống mục tiêu, rồi nhảy sang kẻ gần nhất
function strikeBolt(t,WP){
  const extra=2;
  bolts.push({x:t.x,y:t.y-(t.h||30)/2,life:9});
  if(t.alive) damage(t,extra);
  let best=null,bd=90;
  for(const e of enemies){ if(!e.alive||e===t) continue;
    const dd=Math.hypot(e.x-t.x,e.y-t.y); if(dd<bd){bd=dd;best=e;} }
  if(best){ bolts.push({x:best.x,y:best.y-(best.h||20)/2,life:9,fx:t.x,fy:t.y-(t.h||30)/2}); damage(best,extra); }
  shake=Math.max(shake,3);
}
// Apocalypse: xác nổ, sát thương vùng, KHÔNG nổ dây chuyền
function explode(x,y,src){
  for(let i=0;i<22;i++) burst(x,y,i%2?'#ff4a20':'#ffb040',1,3.6);
  shake=Math.max(shake,6); SFX.boss();
  for(const e of enemies) if(e.alive&&e!==src&&Math.hypot(e.x-x,(e.y-e.h/2)-y)<52) damage(e,4);
  if(boss&&boss.alive&&Math.hypot(boss.x-x,boss.y-20-y)<60) damage(boss,4);
}
function tickMyth(){
  if(soulT>0){ soulT--; if(soulT===0) soulN=0; }
  const list=boss&&boss.alive?[...enemies,boss]:enemies;
  for(const e of list){
    if(!e.alive||!(e.burn>0)) continue;
    e.burn--;
    if(e.burn%30===0) damage(e,1);
    if(frame%3===0) burst(e.x+(Math.random()*10-5),e.y-(e.h||24)/2,'#ff8a20',1,1.4);
  }
  bolts=bolts.filter(b=>--b.life>0);
}
// nhặt vũ khí: chưa có thì mở khoá vĩnh viễn, có rồi thì lên bậc
function claimWeapon(i){
  if(training) return;
  const r=W[i].r; lootCol=RARITY[r].c; lootMyth=(r===4);
  if(!prof.owned[i]){
    prof.owned[i]=true; p.swords[i]=true; p.whip=i; p.drainT=0;
    lootMsg=(r===4?'✦ THẦN KHÍ ✦ ':'VŨ KHÍ MỚI · ')+W[i].n; SFX.win();
    if(r===4){ flash=Math.max(flash,30); shake=Math.max(shake,8); }
  } else if(prof.wlv[i]<WMAXLV){
    prof.wlv[i]=(prof.wlv[i]||0)+1; p.swords[i]=true;
    lootMsg=W[i].n+'  +'+prof.wlv[i]+'  ·  '+RARITY[r].n; SFX.item();
  } else {
    p.hearts=Math.min(99,p.hearts+10);
    lootMsg=W[i].n+' đã tối đa · +10 tim'; SFX.item();
  }
  lootT=150; prof.found++; saveProf();
}
function dropItem(x,y,t){
  if(t==='whip'&&p.swords[1]&&p.swords[2])t='heart5';
  items.push({x,y,vy:-1.5,t,life:420,w:12,h:12});

let UID=0;
function makeEnemy(d){

  if(d.type==='zombie'){Object.assign(b,{w:13,h:24,hp:2,pts:200,dmg:2,speed:0.42});}
  if(d.type==='bat'){Object.assign(b,{w:22,h:16,hp:1,pts:200,dmg:2,y:d.y-8,hang:1,ox:d.x,oy:d.y-8,
    baseY:d.y-8,vx:0,wob:Math.random()*6.28});}
  if(d.type==='skel'){Object.assign(b,{w:14,h:24,hp:4,pts:400,dmg:3,speed:0.5,cd:60+Math.random()*60,home:d.x});}
  if(d.type==='dummy'||d.type==='dummyS'){Object.assign(b,{w:16,h:30,hp:99999,pts:0,dmg:0,dummy:1,log:[],cd:100});}
  if(d.type==='dummyF'){Object.assign(b,{w:14,h:24,hp:3,pts:0,dmg:0,dummy:1,log:[]});}
  if(d.type==='fish'){Object.assign(b,{w:15,h:20,hp:3,pts:500,dmg:3,vy:0,cd:40+Math.random()*60,dive:1,oy:d.y});}
  if(d.type==='eye'){Object.assign(b,{w:18,h:18,hp:3,pts:800,dmg:4,cast:0,cd:70+Math.random()*60,oy:d.y-24});}
  if(d.type==='shade'){Object.assign(b,{w:12,h:26,hp:4,pts:900,dmg:3,vy:0,atk:0,cd:40,anim:0});}
  if(d.type==='gargoyle'){Object.assign(b,{w:18,h:22,hp:4,pts:700,dmg:3,wake:0,vy:0,oy:d.y});}
  if(d.type==='armor'){Object.assign(b,{w:16,h:26,hp:6,pts:600,dmg:3,speed:0.34,cd:70+Math.random()*50,vy:0});}
  if(d.type==='hunch'){Object.assign(b,{w:14,h:20,hp:2,pts:300,dmg:2,cd:20+Math.random()*40,vy:0});}
  if(d.type==='chandelier'){Object.assign(b,{w:26,h:14,hp:3,pts:400,dmg:4,y:d.y-TW,oy:d.y-TW,
    drop:0,vy:0,hangY:d.y-TW});}
  if(d.type==='medusa'){Object.assign(b,{w:19,h:16,hp:1,pts:300,dmg:2,y:d.y-8,oy:d.y-8,base:d.y-8,dir:-1});}
  return b;
}
function damage(e,d){
  if(e.dummy){ (e.log=e.log||[]).push([frame,d]); e.lastHit=frame;
    if(e.type!=='dummyF'){ e.hp=Math.max(e.hp-d,1); e.flash=6; SFX.hit();
      dmgText(e.x,e.y-e.h-6,d,d>=6?'big':'hit'); return; } }
  e.hp-=d; e.flash=6; SFX.hit();
  const bx=e.x-(e.x<p.x?-1:1)*4, by=e.y-e.h/2;
  const isBoss=e.type==='boss';
  dmgText(bx,by-6,d, e.hp<=0?'kill':(isBoss?'boss':(d>=4?'big':'hit')));
  hitStop=Math.max(hitStop,e.type==='boss'?5:3);
  shake=Math.max(shake,e.type==='boss'?5:2.5);
  // máu bắn ngược hướng đòn chém
  for(let i=0;i<7;i++){
    const a=(p.face>0?-0.5:Math.PI-0.5)+Math.random()*1.0;
    parts.push({x:bx,y:by,vx:-Math.cos(a)*(1.5+Math.random()*2.5),
      vy:Math.sin(a)*2-1.5,life:16+Math.random()*14,c:i%3?'#8e1224':'#c8203c'});
  }
  burst(bx,by,'#e8a0c0',4,1.6);
  if(e.type==='boss'&&e.hp>0){
    e.x+=(e.x<p.x?-6:6); shake=Math.max(shake,4);
    if(e.dive>0){ e.diveHits++; if(e.diveHits>=2){ e.dive=0; e.tp=0; } }
  }
  if(e.hp<=0){
    e.alive=false; score+=e.pts||200; gainXP(Math.max(2,Math.round((e.pts||200)/22)));
    hitStop=Math.max(hitStop,e===boss?14:6);
    shake=Math.max(shake,e===boss?12:4);
    burst(e.x,e.y-(e.h||20)/2,'#ffd48a',14,2.6);
    for(let i=0;i<10;i++)burst(e.x,e.y-(e.h||20)/2,'#8e1224',1,3.2);
    if(e.type==='dummyF'&&training){ trainRespawn.push({def:e.def,at:frame+90}); }
    else if(e===boss){
      endT=1; SFX.win(); flash=30;
      claimWeapon(pickWeapon(bossRarity()));                         // boss chắc chắn rơi đồ hiếm
    }
    else {
      // bảo hiểm xui: mỗi mạng hạ trắng tay cộng thêm 1.5%, đủ 18 mạng thì chắc chắn rơi
      const rate=(DROPRATE[e.type]||0)+(stage||1)*0.006+dryKills*0.015;
      if(!training&&!e.dummy&&(Math.random()<rate||dryKills>=18)){ dropWeapon(e.x,e.y-12,0); dryKills=0; }
      else if(!e.dummy) dryKills++;
      else if(Math.random()<0.35) dropItem(e.x,e.y-10,Math.random()<0.25?'heart5':'heart');
    }
  }
}
function updateCracks(){
  if(!cracks.size) return;
  for(const [k,v] of [...cracks]){
    if(v>1){ cracks.set(k,v-1);
      if(v%6===0){ const [tx,ty]=k.split(',').map(Number);
        burst(tx*TW+8,ty*TW+4,'#4a3040',2,1.2); }
      continue; }
    const [tx,ty]=k.split(',').map(Number);
    grid[ty][tx]=0;
    lg.clearRect(tx*TW,ty*TW,TW,TW);                 // xoá khỏi ảnh nền đã dựng
    for(let i=0;i<10;i++)burst(tx*TW+8,ty*TW+8,'#4a3040',1,2.6);
    shake=Math.max(shake,4); SFX.hit();
    cracks.delete(k);
  }
}
function updateMovers(){
  for(const m of movers){
    m.px=m.x; m.py=m.y; m.t+=m.sp;
    const o=Math.sin(m.t*0.02)*0.5+0.5;             // 0..1 mượt, không giật ở hai đầu

  }
}
// đứng trên bục thì được mang theo
function riding(){
  if(p.stair||p.vy<-0.1) return null;
  for(const m of movers){
    if(p.x+5>m.x&&p.x-5<m.x+m.w&&p.y>=m.y-4&&p.y<=m.y+8) return m;

function updateEnemies(){
  // activation
  for(const d of spawnDefs){
    if(d.done)continue;

    if(!e.alive)return false;

  });

  for(const e of enemies){

        else e.vx*=0.93;
        if(e.vx> 0.95)e.vx= 0.95;
        if(e.vx<-0.95)e.vx=-0.95;
        e.x+=e.vx;
        // đường bay nền chỉ trôi tối đa ~1.3px/frame về phía người chơi
        const tgt=Math.max(34,Math.min(MH*TW-26,p.y-24));

          e.x=ox; e.y=oy2; e.vx*=-0.45;
          e.baseY=oy2-Math.sin(e.t*0.09+e.wob)*13;
        }
      }
    }
    else if(e.type==='dummy'||e.type==='dummyF'||e.type==='dummyS'){
      e.face=p.x<e.x?-1:1;
      if(e.type!=='dummyF'&&frame-(e.lastHit||0)>90) e.hp=99999;
      if(e.type==='dummyS'){ e.cd--; if(e.cd<=0&&Math.abs(p.x-e.x)<300){ e.cd=110;
        shots.push({x:e.x-12,y:e.y-20,vx:(p.x<e.x?-1:1)*1.8,vy:0,w:12,h:12,t:'flame',dmg:2,life:220,rot:0,breakable:1});
        SFX.throw(); } }
    }
    else if(e.type==='dummy'||e.type==='dummyS'||e.type==='dummyF'){
    const F=e.type==='dummyF';
    px(x-2,y-30,4,30,'#6b4a2a'); px(x-2,y-30,1,30,'#8a6438');            // cọc gỗ
    if(F){ px(x-7,y-24,14,14,'#c8a858'); px(x-7,y-24,14,3,'#e0c878');     // người rơm
           px(x-5,y-30,10,7,'#d8b868'); px(x-3,y-28,2,2,'#4a3018'); px(x+1,y-28,2,2,'#4a3018'); }
    else { px(x-8,y-28,16,16,'#c8a858'); px(x-8,y-28,16,3,'#e0c878');
           ctx.strokeStyle='#c8203c'; ctx.lineWidth=2;
           ctx.beginPath(); ctx.arc(x,y-20,5,0,6.3); ctx.stroke();
           px(x-1,y-21,2,2,'#c8203c');
           if(e.type==='dummyS'){ px(x-10,y-22,4,4,'#ff7a28'); px(x-11,y-21,2,2,'#ffd257'); } }
    px(x-6,y-2,12,2,'#4a3018');
    // DPS trong 3 giây gần nhất
    if(e.log&&e.log.length){
      e.log=e.log.filter(l=>frame-l[0]<180);
      const dps=e.log.reduce((a,l)=>a+l[1],0)/3;

      b.y=b.ay=b.ty=(b.phase===2?150+Math.random()*40:240);
      for(let i=0;i<16;i++)burst(b.x,b.y-20,'#8a1f3a',1,3);
    }
  }
  else if(b.phase===1){
    b.ay=240;                                        // đứng trên sàn
    b.tp--;
    if(b.tp<=0){ b.tp=170+Math.random()*70; b.warp=28;
      for(let i=0;i<16;i++)burst(b.x,b.y-20,'#8a1f3a',1,3); }
    if(b.cast>0){ b.cast--; if(b.cast===0)fireCount(b); }
    else { b.cd--; if(b.cd<=0){ b.cd=104; b.cast=30; } }
    b.y+=(b.ay-b.y)*0.12;
  }
  else{
    if(b.dash>0){
      b.dash--;
      b.x+=b.dashDir*4.4;
      if(b.dash%3===0)burst(b.x-b.dashDir*10,b.y-20,'#8a1f3a',2,1.5);
      const lo=cam.lock+40, hi=cam.lock+VW-40;
      if(b.x<lo||b.x>hi){ b.x=Math.max(lo,Math.min(hi,b.x)); b.dash=0; b.cd=60; }
      if(b.dash===0&&Math.random()<0.7){              // rải dơi sau cú lao
        for(let i=0;i<2;i++){
          const bt=makeEnemy({type:'bat',x:b.x,y:b.y+8});
          bt.hang=0; bt.baseY=b.y-10; bt.def={x:b.x}; enemies.push(bt);
        }
      }
    } else {
      b.ay=Math.max(120,Math.min(210,p.y-40))+Math.sin(b.t*0.05)*8;
      b.x+=(p.x-b.x)*0.004+Math.sin(b.t*0.03)*0.5;
      if(b.cast>0){ b.cast--; if(b.cast===0)fireCount(b); }
      else{
        b.cd--;
        if(b.cd<=0){
          if(Math.random()<0.55){                     // lao ngang, có báo trước
            b.dashDir=p.x<b.x?-1:1; b.dash=44; b.cd=0;
            b.ay=Math.max(150,Math.min(226,p.y-26));
            shake=Math.max(shake,5);
          } else { b.cd=92; b.cast=28; }
        }
      }
      b.y+=(b.ay-b.y)*0.07;
    }
    b.tp--;
    if(b.tp<=0&&b.dash<=0){ b.tp=260+Math.random()*90; b.warp=28; }
  }
  if(!p.dead&&p.inv<=0&&Math.abs(b.x-p.x)<20&&b.y-36<p.y&&b.y>p.y-p.h) hurtPlayer(b.dmg,b.x);
  bossHP=Math.max(0,b.hp);
}
function updateBoss(){
  if(!boss){
    if(p.x>bossTrigger&&endT===0){
      closeGate(true);
      cam.lock=arenaX*TW; p.cp=CHECK.length-1;
      if(bossKind==='moon'){
        boss={kind:'moon',x:cam.lock+256,y:120,ay:120,ty:120,vx:0,vy:0,alive:true,hp:bossMax=88,
          w:56,h:56,t:0,pts:80000,dmg:5,cd:70,cast:0,castKind:'ring',ring:0,warp:0,flash:0,type:'boss'};
      } else if(bossKind==='abyss'){
        boss={kind:'abyss',x:cam.lock+300,y:248,ay:248,ty:248,vx:0,vy:0,alive:true,hp:bossMax=74,
          w:44,h:40,t:0,pts:55000,dmg:5,cd:70,cast:0,castKind:'slam',sub:0,warp:0,flash:0,type:'boss'};
      } else if(bossKind==='lord'){
        boss={kind:'lord',x:cam.lock+400,y:160,ay:160,ty:160,vx:0,vy:0,alive:true,hp:bossMax=64,
          w:38,h:52,t:0,pts:40000,dmg:5,cd:80,cast:0,castKind:'wall',sweep:0,swDir:1,
          warp:0,tp:200,flash:0,type:'boss'};
      } else if(bossKind==='shadow'){
        boss={kind:'shadow',x:cam.lock+400,y:170,ay:170,ty:170,vx:0,vy:0,alive:true,hp:bossMax=52,
          w:34,h:44,t:0,pts:25000,dmg:4,cd:70,cast:0,castKind:'orb',warp:0,summon:0,flash:0,type:'boss'};
      } else if(bossKind==='demon'){
        boss={kind:'demon',x:cam.lock+400,y:240,ay:240,ty:240,vx:0,vy:0,alive:true,hp:bossMax=44,
          w:38,h:48,t:0,pts:15000,dmg:4,cd:80,cast:0,castKind:'slam',dash:0,dashDir:1,
          slam:0,warp:0,flash:0,type:'boss'};
      } else if(bossKind==='count'){
        boss={kind:'count',x:cam.lock+400,y:240,ay:240,ty:240,vx:0,vy:0,alive:true,hp:bossMax=34,
          w:30,h:40,t:0,pts:8000,dmg:4,tp:110,cast:0,cd:70,phase:1,dash:0,dashDir:1,
          warp:0,flash:0,type:'boss'};
      } else {
        boss={kind:'death',x:cam.lock+380,y:170,ay:170,ty:170,vx:0,vy:0,alive:true,hp:bossMax=28,
          w:34,h:34,t:0,pts:5000,dmg:3,tp:0,dive:0,diveHits:0,cast:0,cd:80,castKind:'fan',
          flash:0,type:'boss'};
      }
      bossHP=boss.hp; SFX.boss(); shake=14; bossCard=140;
    }
    return;
  }
  if(boss.kind==='moon'){ updateMoon(); return; }
  if(boss.kind==='abyss'){ updateAbyss(); return; }
  if(boss.kind==='lord'){ updateLord(); return; }
  if(boss.kind==='shadow'){ updateShadow(); return; }
  if(boss.kind==='demon'){ updateDemon(); return; }
  if(boss.kind==='count'){ updateCount(); return; }
  const b=boss; b.t++; if(b.flash>0)b.flash--;
  if(!b.alive){ b.y+=0.6; return; }
  b.tp--;
  if(b.tp<=0){
    b.tp=210+Math.random()*90;
    b.tx=cam.lock+90+Math.random()*330; b.ty=152+Math.random()*44;
    b.warp=22;
    for(let i=0;i<14;i++)burst(b.x,b.y-16,'#6a5cf0',1,3);
  }
  if(b.warp>0){
    b.warp--;
    if(b.warp===11){b.x=b.tx;b.y=b.ay=b.ty; for(let i=0;i<14;i++)burst(b.x,b.y-16,'#6a5cf0',1,3);}
  }
  else{
    if(b.dive>0){
      b.dive--;
      const tx=p.x+(b.x<p.x?-52:52);
      b.x+=(tx-b.x)*0.035;
      b.ay=238;
      if(b.dive===56) for(let i=0;i<8;i++)burst(b.x,b.y-8,'#c05a8a',1,2);
    } else {
      b.x+=Math.sin(b.t*0.03)*0.7 + (p.x-b.x)*0.006;
      b.ay=b.ty+Math.sin(b.t*0.05)*10;
      if(b.t%210===0){ b.dive=80; b.diveHits=0; }
      if(b.cast>0){
        b.cast--;
        if(b.cast===0)fireBoss(b);
      } else {
        b.cd--;
        if(b.cd<=0){
          b.cd=bossHP<=13?96:126;
          b.cast=32;
          b.castKind=(bossHP<=13&&Math.random()<0.45)?'wall':'fan';
        }
      }
    }
    b.y+=(b.ay-b.y)*0.08;
  }
  if(!p.dead&&p.inv<=0&&Math.abs(b.x-p.x)<22&&b.y-30<p.y&&b.y>p.y-p.h) hurtPlayer(3,b.x);
  bossHP=Math.max(0,b.hp);
}

/* ================= SHOTS & ITEMS ================= */
function updateShots(){
  shots=shots.filter(s=>{
    s.life--; if(s.life<=0)return false;
    if(s.g)s.vy+=s.g;
    if(s.home&&s.homeT>0){
      s.homeT--;
      const a=Math.atan2((p.y-16)-s.y,p.x-s.x);s.vx+=Math.cos(a)*s.home*8;s.vy+=Math.sin(a)*s.home*8;
      const sp=Math.hypot(s.vx,s.vy); if(sp>2.9){s.vx*=2.9/sp;s.vy*=2.9/sp;}
    }
    s.x+=s.vx; s.y+=s.vy; s.rot=(s.rot||0)+0.3;
    if(s.t==='wave'||s.t==='fwave'){
      const ty=Math.floor((s.y+10)/TW), tx=Math.floor(s.x/TW);
      if(!solid(tx,ty)) s.life=0;                    // tới hố thì tắt
    }
    if(s.t==='pillar'){
      const ty=Math.floor(s.y/TW), tx=Math.floor(s.x/TW);
      if(solid(tx,ty)){ s.vy=0; s.g=0; s.y=ty*TW; s.t='hellfire'; s.life=80; s.w=20; s.h=16; s.cool=0;
        shake=Math.max(shake,4); for(let i=0;i<8;i++)burst(s.x,s.y-6,'#ff8c30',1,2.2); }
    }
    if(s.t==='holy'){
      const ty=Math.floor(s.y/TW), tx=Math.floor(s.x/TW);
      if(solid(tx,ty)){
        s.t='fire'; s.vx=0; s.vy=0; s.g=0; s.life=190;   // PHAI xoa trong luc, khong lua se roi xuyen san s.y=ty*TW; s.w=22; s.h=16; s.hits={};
        SFX.candle(); for(let i=0;i<10;i++)burst(s.x,s.y-4,'#7ec8e8',1,1.8);
      }
    }
    if(s.x<cam.x-60||s.x>cam.x+VW+60||s.y>MH*TW+30||s.y<-40)return false;
    if(s.friendly||s.t==='fire'){
      // lửa và rìu xuyên qua nhiều địch, nên phải chặn đánh trùng mỗi frame
      const pierce=(s.t==='fire'||s.t==='axe'||s.t==='fwave'||s.t==='holyb');
      if(pierce&&!s.hits) s.hits={};
      if(pierce) for(const k in s.hits) if(s.hits[k]>0) s.hits[k]--;
      const canHit=(id)=>!pierce||!s.hits[id]||s.hits[id]<=0;
      const markHit=(id)=>{ if(pierce) s.hits[id]=(s.t==='fire'?16:99999); };
      for(const e of enemies) if(e.alive&&Math.abs(e.x-s.x)<(e.w/2+s.w/2)&&e.y-e.h<s.y+s.h/2&&e.y>s.y-s.h/2){
        if(!canHit(e.uid)) continue;
        damage(e,s.dmg); markHit(e.uid);
        if(!pierce) return false;
      }
      if(boss&&boss.alive&&Math.abs(boss.x-s.x)<20&&boss.y-32<s.y&&boss.y>s.y-8){
        if(canHit('boss')){ damage(boss,s.dmg); markHit('boss'); if(!pierce) return false; }
      }
    } else {
      const touch=!p.dead&&p.inv<=0&&Math.abs(p.x-s.x)<(p.w/2+s.w/2-2)&&p.y-p.h<s.y+s.h/2&&p.y>s.y-s.h/2;
      if(touch){ hurtPlayer(s.dmg,s.x); if(s.t!=='hellfire') return false; }
    }
    return true;
  });
  items=items.filter(it=>{
    it.life--; if(it.life<=0)return false;
    if(it.hover){
      const dx=p.x-it.x, dy=(p.y-14)-it.y, dd=Math.hypot(dx,dy);
      if(dd<150&&!p.dead){ it.x+=dx/dd*2.8; it.y+=dy/dd*2.8; }   // nam châm hút đồ
      else it.y+=(214-it.y)*0.02+Math.sin(frame*0.06+it.x)*0.15;  // hạ dần xuống tầm với
    } else { it.vy+=0.28; it.y+=it.vy; }
    const ty=Math.floor(it.y/TW), tx=Math.floor(it.x/TW);
    if(!it.hover&&solid(tx,ty)&&it.vy>0){it.y=ty*TW;it.vy=0;}
    if(Math.abs(p.x-it.x)<14&&p.y-p.h-4<it.y&&p.y+4>it.y-12&&!p.dead){
      SFX.item();
      if(it.t==='heart'){const n=gearOf('charm').heart;p.hearts=Math.min(99,p.hearts+n);popText(it.x,it.y,'+'+n);}
      if(it.t==='heart5'){const n=5*gearOf('charm').heart;p.hearts=Math.min(99,p.hearts+n);popText(it.x,it.y,'+'+n);}
      if(it.t==='meat'){p.hp=Math.min(p.maxhp,p.hp+8);popText(it.x,it.y,'HP');}
      if(it.t==='wpn'){ claimWeapon(it.wi); }
      if(it.t==='whip'){
        const next=!p.swords[1]?1:(!p.swords[2]?2:-1);
        if(next>=0){ grantSword(next,true); popText(it.x,it.y,SWORDNAME[next]); flash=12; }
        else { p.hearts=Math.min(99,p.hearts+5); popText(it.x,it.y,'+5'); }
      }
      if(it.t==='katana'){grantSword(3,true);popText(it.x,it.y,'KATANA');flash=18;SFX.iai();}
      if(it.t==='blood'){grantSword(BLOOD,true);popText(it.x,it.y,'HUYẾT KIẾM');flash=22;SFX.drain();}
      if(it.t==='dagger'||it.t==='axe'||it.t==='holy'){p.sub=it.t;popText(it.x,it.y,it.t==='dagger'?'DAO':it.t==='axe'?'RÌU':'NƯỚC');}
      score+=300;
      return false;
    }
    return true;
  });
  parts=parts.filter(q=>{q.life--; q.x+=q.vx; q.y+=q.vy;
    q.vy+=(q.g!==undefined?q.g:(q.txt?0:0.12)); return q.life>0;});
}

/* ================= DRAW ================= */
let G=ctx;                                     // đích vẽ hiện tại (ctx hoặc buffer)
function px(x,y,w,h,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),w,h);}
/* Lớp tối phủ toàn màn, rồi "khoét" lỗ sáng ở mỗi nguồn sáng.
   Nến, lửa, cầu lửa, đèn chùm và lưỡi kiếm đều phát sáng thật. */
const lite=document.createElement('canvas'); lite.width=VW; lite.height=VH;
const ltg=lite.getContext('2d');
function drawLighting(){
  const dark=LIGHTS[lightLv].d+(stage===2?0.06:0);
  ltg.setTransform(1,0,0,1,0,0);
  ltg.globalCompositeOperation='source-over';
  ltg.fillStyle='rgba(5,3,12,'+dark+')';
  ltg.fillRect(0,0,VW,VH);
  // ánh trăng hắt từ trên xuống
  const mg=ltg.createLinearGradient(0,0,0,150);
  mg.addColorStop(0,'rgba(0,0,0,0.55)'); mg.addColorStop(1,'rgba(0,0,0,0)');
  ltg.globalCompositeOperation='destination-out';
  ltg.fillStyle=mg; ltg.fillRect(0,0,VW,150);

  const hole=(x,y,r,s)=>{
    if(x<-r||x>VW+r||r<=0) return;
    const g=ltg.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,'+s+')');
    g.addColorStop(0.5,'rgba(0,0,0,'+s*0.42+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ltg.fillStyle=g; ltg.beginPath(); ltg.arc(x,y,r,0,6.3); ltg.fill();
  };
  for(const t of torches){
    const fl=Math.sin(frame*0.16+t.x*0.5)*5+Math.sin(frame*0.37+t.x)*2;
    hole(t.x-cam.x,t.y-8,84+fl,1);
  }
  for(const it of items) if(it.t==='wpn') hole(it.x-cam.x,it.y-14,30+it.rar*8,0.9);
  for(const b of bolts) hole(b.x-cam.x,b.y,70,1);
  for(const t of phaseTiles){                      // bục nhấp nháy sáng khi đang bật
    if(t.x%2||!phaseOn(t.k)) continue;
    const sx=t.x*TW+16-cam.x; if(sx<-40||sx>VW+40) continue;
    hole(sx,t.y*TW+2,36,0.8);
  }
  for(const t of glowTiles){                       // đường ánh trăng màn 7
    if(t.x%2) continue;
    const sx=t.x*TW+16-cam.x; if(sx<-40||sx>VW+40) continue;
    hole(sx,t.y*TW+2,32,0.7);
  }
  for(const v of voidTiles){                       // vực tự phát sáng
    if(voidAt(v.x,v.y-1)) continue;
    hole(v.x*TW+8-cam.x,v.y*TW+2,58,0.95);
  }
  for(const c of candles){
    if(!c.alive) continue;
    const fl=Math.sin(frame*0.19+c.x*0.7)*4+Math.sin(frame*0.41+c.x)*2;
    hole(c.x-cam.x,c.y-11,74+fl,0.95);
  }
  for(const e of enemies){
    if(e.type==='chandelier') hole(e.x-cam.x,e.y-6,e.drop?86:72,0.95);
  }
  for(const q of shots){
    if(q.t==='fire')  hole(q.x-cam.x,q.y-4,62,1);
    if(q.t==='flame') hole(q.x-cam.x,q.y,42,0.95);
    if(q.t==='hellfire') hole(q.x-cam.x,q.y-6,56,1);
    if(q.t==='pillar') hole(q.x-cam.x,q.y,40,0.9);
    if(q.t==='wave') hole(q.x-cam.x,q.y-6,34,0.85);
    if(q.t==='beam') hole(q.x-cam.x,q.y,40,0.9);
    if(q.t==='fwave') hole(q.x-cam.x,q.y-6,30,0.8);
    if(q.t==='holyb') hole(q.x-cam.x,q.y,44,1);
    if(q.t==='drop') hole(q.x-cam.x,q.y,22,0.7);
    if(q.t==='tentacle') hole(q.x-cam.x,q.y-14,30,0.6);
    if(q.t==='holy')  hole(q.x-cam.x,q.y,20,0.8);
  }
  for(const it of items) hole(it.x-cam.x,it.y-2,30,0.7);
  for(const st of stairs){ const q=st.pts[0], r=st.pts[st.pts.length-1];
    hole(q.x-cam.x,q.y-14,44,0.5); hole(r.x-cam.x,r.y-14,44,0.5); }
  if(boss&&boss.alive&&boss.cast>0) hole(boss.x-cam.x,boss.y-24,34,0.8);
  if(!p.dead&&state!=='title'){
    hole(p.x-cam.x,p.y-16,p.atk>0?92:74,0.98);   // luôn thấy rõ quanh mình
  }
  ltg.globalCompositeOperation='source-over';
  ctx.drawImage(lite,0,0);
}
/* ================= NỀN VẼ TAY THEO TỪNG MÀN ================= */
function moon(mx,my,r,glow){
  ctx.fillStyle='rgba(190,60,90,'+glow+')';
  ctx.beginPath(); ctx.arc(mx,my,r*2.1,0,6.3); ctx.fill();
  ctx.fillStyle='#e8d8b8'; ctx.beginPath(); ctx.arc(mx,my,r,0,6.3); ctx.fill();
  ctx.fillStyle='#cbb894';
  ctx.beginPath(); ctx.arc(mx-r*0.33,my-r*0.25,r*0.17,0,6.3);
  ctx.arc(mx+r*0.28,my+r*0.2,r*0.24,0,6.3); ctx.arc(mx+r*0.05,my-r*0.48,r*0.12,0,6.3); ctx.fill();
  ctx.fillStyle='rgba(160,40,60,0.16)'; ctx.beginPath(); ctx.arc(mx,my,r*1.25,0,6.3); ctx.fill();
}
function starfield(n,spd,tint){
  for(let i=0;i<n;i++){
    let sx=((i*97)-cam.x*spd)%(VW+40); if(sx<-20)sx+=VW+40;
    const sy=(i*53)%130, tw=Math.sin(frame*0.05+i)*0.5+0.5;
    ctx.globalAlpha=0.35+tw*0.5; px(sx,sy,1,1,i%4?tint:'#cfc4e4');
  }
  ctx.globalAlpha=1;
}
// bóng núi / tường xa, vẽ bằng đường gấp khúc mềm
function ridge(off,base,amp,step,col,seed){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-20,VH);
  for(let x=-20;x<=VW+20;x+=step){
    const w=(x-off)*0.011+seed;
    const y=base-Math.abs(Math.sin(w))*amp-Math.sin(w*2.3)*amp*0.3;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(VW+20,VH); ctx.closePath(); ctx.fill();
}
function bgCastle(){                      // MÀN 1 — ngoài trời, lâu đài dưới trăng máu
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#0d0818'); g.addColorStop(0.42,'#1a1030');
  g.addColorStop(0.72,'#2a1636'); g.addColorStop(1,'#150d22');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  starfield(46,0.04,'#6a5f88');
  moon(392-cam.x*0.05,54,27,0.05);
  // mây mỏng vắt qua mặt trăng
  for(let i=0;i<5;i++){
    const cx=((i*190)-cam.x*0.07)%(VW+260)-130, cy=40+((i*37)%46);
    ctx.fillStyle='rgba(60,40,80,'+(0.30-i*0.03)+')';
    ctx.beginPath(); ctx.ellipse(cx,cy,64+i*14,6+i,0,0,6.3); ctx.fill();
  }
  ridge(cam.x*0.10,196,58,14,'#180f28',0.7);       // núi xa
  // toà lâu đài chính: thân + nhiều tháp nhọn + cửa sổ sáng
  const bx=-cam.x*0.16+120;
  ctx.fillStyle='#120b1e';
  ctx.fillRect(bx,120,250,VH-120);

function drawPlayerBody(g,x,y,d,who,A){
  const C=(who===hero&&SKIN_C)?SKIN_C:PAL;
  const P=(ox,oy,w,h,c)=>{ if(w<=0||h<=0)return; g.fillStyle=c;
    g.fillRect(Math.round(d>0?x+ox:x-ox-w),Math.round(y+oy),w,h); };
  const crouch=A.crouch, moving=A.moving, air=A.air, whip=A.whip;
  A.vf=A.vf||0;
  const thr=A.thr>0, swing=A.atk&&!thr, atk=swing;   // `atk` = sword out; the throw keeps it sheathed
  const tu=A.thrT||0;
  const f=A.f|0, bob=moving?[0,-1,0,-1][f]:0;
  const dy=crouch?9:0, T=dy+bob, lean=(atk||thr)?1:0;
  const sway=Math.sin(frame*0.10)*1.2+(moving?2.0:0)+(air?3.5:0);
  const ty=-22+T, hy=-33+T;
  let fw=moving?[3,1,-3,1][f]:0, bk=moving?[-3,1,3,1][f]:0;
  if(air){fw=3;bk=-3;}

  if(who===0){
    const ST=[[-6,4,-23,18],[-9,4,-22,15],[-12,3,-21,11],[-15,3,-20,7]];
    for(let i=0;i<4;i++){const t=ST[i];
      P(t[0],t[2]+T,t[1],Math.max(3,Math.round(t[3]-sway*i*0.8)),i>=2?C.CPs:C.CP);}
    P(-6,-23+T,2,13,C.CPh); P(-5,-23+T,1,12,C.CPs);
  } else {
    for(let i=0;i<4;i++) P(-5-i*3,ty-1+i*2-Math.round(sway*i*0.4),4,2,i>=2?C.SCs:C.SC);
    for(let i=0;i<5;i++){
      const w=i<2?4:(i<3?3:2);
      P(-5-i*2,Math.round(hy+8+i*i*0.9+sway*i*0.22),w,3,i>=3?C.fHRs:(i===0?C.fHRh:C.fHR));
    }
    P(-6,hy+7,3,2,C.SC);
  }

  // ---- legs ----
  if(who===0){
    if(crouch){
      P(-6,-11,12,6,C.TUs); P(-2,-11,8,5,C.TU);
      P(-8,-5,7,5,C.BTs); P(0,-5,8,5,C.BT); P(0,-6,8,2,C.LE);
      P(-8,-1,16,1,C.SOLE);

      P(-5+bk,-8,6,2,C.LEs); P(-5+bk,-7,6,7,C.BTs); P(-5+bk,-1,7,1,C.SOLE);
      P(0+fw,-13+bob,5,8,C.TU); P(0+fw,-13+bob,2,8,C.TUs);
      P(-1+fw,-8,7,2,C.LE); P(-1+fw,-8,7,1,C.LEh);
      P(-1+fw,-6,7,6,C.BT); P(4+fw,-6,2,6,C.BTs); P(-1+fw,-6,1,6,C.BTs);
      P(-1+fw,-1,8,1,C.SOLE);
    }
  } else {
    if(crouch){
      P(-6,-11,12,6,C.fBTs); P(-2,-11,8,5,C.fBT);
      P(-8,-5,7,5,C.fBTs); P(0,-5,8,5,C.fBT);
      P(0,-6,8,2,C.SKTs); P(-8,-1,16,1,C.SOLE);
    } else {
      P(-4+bk,-14+bob,4,14,C.fBTs); P(-4+bk,-14+bob,4,2,C.SKTs); P(-5+bk,-1,6,1,C.SOLE);
      P(0+fw,-14+bob,4,14,C.fBT); P(3+fw,-14+bob,1,14,C.fBTs);

    P(2+L,ty,3,4,C.VT); P(2+L,ty,3,1,C.VTh); P(2+L,ty+3,3,1,C.TRIM);   // vai nhỏ

/* Dây verlet trong hệ toạ độ theo hướng mặt (ox>0 = phía trước).
   Mỗi đốt trễ hơn đốt trước, nên chạy thì tóc bạt về sau, dừng thì còn đưa thêm. */
function makeChain(n,ax,ay,seg){
  const c=[]; for(let i=0;i<n;i++) c.push({x:ax-i*seg,y:ay+i*seg*0.5,px:ax-i*seg,py:ay+i*seg*0.5});
  return c;
}
function stepChain(c,ax,ay,seg,grav,windK,damp){
  c[0].x=ax; c[0].y=ay; c[0].px=ax; c[0].py=ay;
  const vf=p.vx*p.face;
  const wind=-vf*windK, lift=-p.vy*0.055;
  for(let i=1;i<c.length;i++){
    const n=c[i];
    const nx=n.x+(n.x-n.px)*damp+wind*(0.5+i*0.22);
    const ny=n.y+(n.y-n.py)*damp+grav+lift*(0.5+i*0.2);
    n.px=n.x; n.py=n.y; n.x=nx; n.y=ny;
    const q=c[i-1], dx=n.x-q.x, dy=n.y-q.y;
    const d=Math.hypot(dx,dy)||1;
    n.x=q.x+dx/d*seg; n.y=q.y+dy/d*seg;
  }
}
function updateFlow(){
  if(hero!==1){ p.tail=null; return; }
  if(!p.tail){
    p.tail =makeChain(5,-4,-26,3.6);
    p.scarf=makeChain(4,-3,-20,3.2);
  }
  const T=(p.crouch&&!p.stair)?9:0;
  stepChain(p.tail ,-4,-26+T,3.6,0.62,0.13,0.78);
  stepChain(p.scarf,-3,-20+T,3.2,0.34,0.22,0.85);
}
// Gió chỉ có ở màn 4: thổi từng cơn, có quãng lặng để người chơi kịp đọc
function windNow(){
  if(stage!==4) return 0;
  const w=Math.sin(frame*0.0062);
  if(Math.abs(w)<0.42) return 0;
  return Math.sign(w)*(Math.abs(w)-0.42)/0.58*0.30;
}
function swingDur(){
  const extra=(W[p.whip].st==='combo'&&combo===3)?5:0;     // đòn kết dài hơn
  return Math.max(8, SWORDDUR[p.whip]+extra-HEROES[hero].fast);
}
function throwDur(){ return Math.max(14, 20-HEROES[hero].fast); }

/* Buffer dùng để dập viền tối. Địch dùng buffer nhỏ cho nhẹ,
   boss dùng buffer lớn vì cánh + áo choàng rộng. */
function mkBuf(w,h,ox,oy){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const m=document.createElement('canvas'); m.width=w; m.height=h;
  return {c,g:c.getContext('2d'),m,mg:m.getContext('2d'),w,h,ox,oy};
}
const BUF_E=mkBuf(80,80,40,60);                // địch thường

/* Vẽ fn() vào buffer (giữ nguyên toạ độ màn hình), rồi dập silhouette
   tối 4 hướng lệch 1px trước khi dập sprite thật lên trên. */
function stampOutlined(buf,sx,sy,alpha,fn){
  const X=Math.round(sx), Y=Math.round(sy);
  buf.g.setTransform(1,0,0,1,0,0);
  buf.g.clearRect(0,0,buf.w,buf.h);
  buf.g.setTransform(1,0,0,1,buf.ox-X,buf.oy-Y);
  const prev=G; G=buf.g;
  try{ fn(buf.g); } finally { G=prev; buf.g.setTransform(1,0,0,1,0,0); }
  buf.mg.setTransform(1,0,0,1,0,0);
  buf.mg.clearRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  buf.mg.drawImage(buf.c,0,0);
  buf.mg.globalCompositeOperation='source-in';
  buf.mg.fillStyle=PAL.OUT; buf.mg.fillRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  const dx=X-buf.ox, dy=Y-buf.oy, oa=ctx.globalAlpha;
  if(alpha!==undefined&&alpha!==null) ctx.globalAlpha=alpha;
  ctx.drawImage(buf.m,dx-1,dy); ctx.drawImage(buf.m,dx+1,dy);
  ctx.drawImage(buf.m,dx,dy-1); ctx.drawImage(buf.m,dx,dy+1);
  ctx.drawImage(buf.c,dx,dy);
  ctx.globalAlpha=oa;
}
function stampHero(who,sx,sy,d,A){

  drawPlayerBody(sg,SPX,SPY,d,who,A);

  ilg.globalCompositeOperation='source-over';
  ilg.drawImage(spr,0,0);
  ilg.globalCompositeOperation='source-in';
  ilg.fillStyle=PAL.OUT; ilg.fillRect(0,0,SPW,SPH);
  ilg.globalCompositeOperation='source-over';
  const dx=sx-SPX, dy=sy-SPY;
  ctx.drawImage(sil,dx-1,dy); ctx.drawImage(sil,dx+1,dy);
  ctx.drawImage(sil,dx,dy-1); ctx.drawImage(sil,dx,dy+1);
  ctx.drawImage(spr,dx,dy);
}

function drawBolts(){

      ctx.strokeStyle=col; ctx.lineWidth=wd; ctx.beginPath(); ctx.moveTo(x0,y0);
      const n=7; for(let i=1;i<=n;i++){ const u=i/n;

function drawGhosts(){

    ctx.fillStyle='#e8a060';

function drawBoss(){
  const b=boss; if(!b)return;
  if(b.kind==='moon'){ drawMoon(); return; }
  if(b.kind==='abyss'){ drawAbyss(); return; }
  if(b.kind==='lord'){ drawLord(); return; }
  if(b.kind==='shadow'){ drawShadow(); return; }
  if(b.kind==='demon'){ drawDemon(); return; }
  if(b.kind==='count'){ drawCount(); return; }
  const x=Math.round(b.x-cam.x), y=Math.round(b.y);
  if(b.dive>0){
    ctx.fillStyle='rgba(220,60,90,0.16)';
    ctx.beginPath(); ctx.arc(x,y-18,30,0,6.3); ctx.fill();
  }
  if(b.cast>0){
    const k=1-b.cast/32;
    ctx.fillStyle=b.castKind==='wall'?'rgba(255,180,60,'+(0.10+k*0.22)+')':'rgba(120,200,255,'+(0.10+k*0.22)+')';
    ctx.beginPath(); ctx.arc(x+18,y-40,10+k*14,0,6.3); ctx.fill();
    if(b.castKind==='wall'){
      ctx.fillStyle='rgba(255,180,60,'+(0.06+k*0.14)+')';
      ctx.fillRect(0,226,VW,15);
    }
  }
  let al=1;
  if(b.warp>0){ const a=b.warp>13?(26-b.warp)/13:b.warp/13; al=1-a; }
  if(b.flash>0&&Math.floor(frame/2)%2)al*=0.5;
  stampOutlined(BUF_B,x,y,al,g=>drawDeathBody(b,x,y,g));
}

function drawShot(s){
  const x=Math.round(s.x-cam.x), y=Math.round(s.y);
  if(s.t==='dagger'){px(x-5,y-2,10,3,'#d8d2e4'); px(x+3,y-3,3,5,'#f0ecf8'); px(x-6,y-3,3,5,'#8a6a3a');}
  else if(s.t==='axe'){ctx.save();ctx.translate(x,y);ctx.rotate(s.rot);px(-1,-6,3,12,'#8a5a2a');px(-6,-7,7,6,'#c8cede');px(2,-7,5,6,'#c8cede');ctx.restore();}
  else if(s.t==='holy'){px(x-3,y-5,6,9,'#7ec8e8'); px(x-2,y-6,4,3,'#e8f4ff');}
  else if(s.t==='fire'){
    const fade=Math.min(1,s.life/40);
    ctx.globalAlpha=fade;
    px(x-11,y-2,22,3,'#8a3a10');

      const h=7+Math.sin(frame*0.34+i*1.3)*6;

  }

    px(-1,-7,3,14,'#6b4a2a'); px(-6,-8,6,6,'#b8c0d0'); px(1,-8,5,6,'#b8c0d0');
    px(-6,-8,6,2,'#e0e6f2'); ctx.restore();}
  else if(s.t==='bone'){ctx.save();ctx.translate(x,y);ctx.rotate(s.rot);px(-5,-2,10,3,'#e4dccc');px(-6,-3,3,5,'#f4eee0');px(3,-3,3,5,'#f4eee0');ctx.restore();}

  else if(s.t==='drop'){
    ctx.fillStyle='rgba(80,200,220,0.20)'; ctx.beginPath(); ctx.arc(x,y,9,0,6.3); ctx.fill();
    px(x-4,y-5,8,10,'#3fa8c8'); px(x-3,y-6,5,4,'#a8e8f8'); px(x-1,y-3,2,3,'#eafaff');

    px(x-13,y-h/2,26,h,'#b47aff'); px(x-13,y-h/2,26,2,'#eedcff');
    for(let i=1;i<4;i++) px(x-13-s.vx*i*2,y-2,4,4,i<2?'#d8a8ff':'#7a4ab0');
  }
  else if(s.t==='holyb'){
    const a=Math.min(1,s.life/12);
    ctx.globalAlpha=a*0.35; ctx.fillStyle='#ffe07a'; ctx.fillRect(x-14,y-8,28,16);
    ctx.globalAlpha=a;
    px(x-11,y-3,22,6,'#fff4c0'); px(x-11,y-1,22,2,'#ffffff');
    px(x+(s.vx>0?9:-13),y-5,4,10,'#ffe07a');
    ctx.globalAlpha=1;
  }
  else if(s.t==='fwave'){
    const h=9+Math.sin(frame*0.6+s.x*0.1)*3;
    ctx.globalAlpha=Math.min(1,s.life/14);
    for(let i=0;i<3;i++){ px(x-7+i*5,y-h+i*2,4,h-i*2,i%2?'#e8c870':'#fff0b8'); }

  else if(s.t==='wave'){

  else if(s.t==='hellfire'){

      px(x-10+i*4,y-h,4,2,'#ffe0a0');

  else if(s.t==='pillar'){
    ctx.fillStyle='rgba(255,120,40,0.18)';
    ctx.fillRect(x-8,0,16,y);                       // vệt sáng từ trần
    for(let i=0;i<3;i++){

  }

    ctx.strokeStyle='#a8e0f0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,7,0.4,4.2);ctx.stroke();
    ctx.strokeStyle='#e8fbff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,9,0.6,3.9);ctx.stroke();ctx.restore();}
}
function drawItem(it){
  const x=Math.round(it.x-cam.x), y=Math.round(it.y), bl=Math.floor(frame/6)%2;
  if(it.life<90&&Math.floor(frame/4)%2)return;
  if(it.t==='wpn'){
    if(it.life<180&&Math.floor(frame/5)%2) return;          // nhấp nháy trước khi biến mất
    const col=it.rar===4?('hsl('+((frame*5)%360)+',90%,62%)'):RARITY[it.rar].c, bob=Math.sin(frame*0.1+it.x)*2;
    const beam=it.rar>=1?(0.10+it.rar*0.06):0.06;

// biểu tượng nhỏ của từng cây kiếm, dùng cho nút đổi và cho HUD
function drawMythBlade(g,len,w){
  // chuôi + chắn
  g.fillStyle='#1a1018'; g.fillRect(-9,-2,10,4);
  g.fillStyle=w.guard;   for(let i=-8;i<1;i+=3) g.fillRect(i,-2,1,4);
  g.fillStyle=w.guard;   g.fillRect(-11,-3,3,6);
  g.fillStyle=w.guard;   g.fillRect(1,-7,4,14);
  g.fillStyle=w.hi;      g.fillRect(2,-1,2,2);                  // ngọc giữa chắn
  // hào quang
  const pulse=0.22+Math.sin(frame*0.2)*0.08;
  g.globalAlpha=pulse; g.fillStyle=w.glow; g.fillRect(4,-7,len+4,14); g.globalAlpha=1;
  const sh=w.shape;
  if(sh==='curve'){                                           // lưỡi cong một bên
    for(let i=0;i<len;i++){ const u=i/len, cy=u*u*6;
      g.fillStyle=w.col; g.fillRect(5+i,cy-2,1,4);
      g.fillStyle=w.hi;  g.fillRect(5+i,cy+1,1,1); }
  } else if(sh==='wave'){                                     // lưỡi lượn sóng như lửa
    for(let i=0;i<len;i++){ const hw=3+Math.sin(i*0.55)*1.4;
      g.fillStyle=w.col; g.fillRect(5+i,-hw,1,hw*2);
      g.fillStyle=w.hi;  g.fillRect(5+i,-hw,1,1); }
  } else {
    const bw=sh==='broad'?8:5;
    g.fillStyle=w.col; g.fillRect(5,-bw/2,len,bw);
    g.fillStyle=w.hi;  g.fillRect(5,-bw/2,len,1);
    g.fillStyle='rgba(0,0,0,0.35)'; g.fillRect(5,-0.5,len-6,1);  // rãnh máu
    if(sh==='jagged') for(let i=6;i<len-4;i+=5){ g.fillStyle=w.col; g.fillRect(5+i,-bw/2-2,3,2);
                                                   g.fillStyle=w.hi; g.fillRect(5+i,-bw/2-2,1,1); }
  }
  // mũi kiếm
  g.fillStyle=w.col; g.beginPath(); g.moveTo(5+len,-3); g.lineTo(5+len+7,0); g.lineTo(5+len,3); g.closePath(); g.fill();
  g.fillStyle=w.hi; g.fillRect(5+len,-1,5,1);
  // ấn ký chạy dọc lưỡi
  for(let k=0;k<3;k++){ const rx=5+((frame*1.4+k*len/3)%len);
    g.fillStyle=w.glow; g.fillRect(Math.round(rx),-1,2,2); }
}
function drawSwordIcon(cx,cy,i){
  const t=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(cx+x),Math.round(cy+y),w,h);};
  if(i===3){                                   // katana: lưỡi cong
    for(let k=0;k<11;k++){const u=k/11; t(-5+k,-4+Math.round(u*u*4),1,2,'#9aa4bb');
      if(k%3===0)t(-5+k,-4+Math.round(u*u*4),1,1,'#e8eefb');}
    t(-6,-4,2,5,'#b08a2e'); t(-8,-3,2,3,'#241a24');
  } else if(i===4){                            // huyết kiếm: lõi đen rìa đỏ
    t(-2,-7,3,11,'#2a0a12'); t(-2,-7,1,11,'#c8203c'); t(0,-7,1,11,'#8e1224');
    t(-4,3,7,2,'#8a1020'); t(-1,5,2,3,'#241016'); t(-1,3,2,2,'#ff2244');
  } else if(i>=10){                             // thần khí: lưỡi có hào quang
    const w=W[i];
    ctx.globalAlpha=0.35+Math.sin(frame*0.2)*0.15; t(-4,-10,8,16,w.glow); ctx.globalAlpha=1;
    const bw2=w.shape==='broad'?4:3;
    t(-bw2/2,-10,bw2,12,w.col); t(-bw2/2,-10,1,12,w.hi);
    t(-4,2,8,2,w.guard); t(-1,4,2,4,'#1a1018'); t(-1,2,2,2,w.hi);
    if(w.shape==='jagged'){ t(bw2/2,-8,2,2,w.col); t(bw2/2,-4,2,2,w.col); }
  } else if(i===5){                            // giáo
    t(-1,-8,2,16,'#6b4a2a'); t(-2,-11,4,4,'#b8c0d0'); t(-1,-12,2,2,'#eef2ff'); t(1,-6,2,3,'#c8203c');
  } else if(i===6){                            // song đao
    t(-4,-6,2,9,'#c8cede'); t(-4,-6,1,9,'#f4f8ff'); t(-5,3,4,2,'#b08a2e');
    t(2,-6,2,9,'#c8cede'); t(2,-6,1,9,'#f4f8ff'); t(1,3,4,2,'#b08a2e');
  } else if(i===7){                            // búa chiến
    t(-1,-4,2,12,'#5c3818'); t(-6,-9,12,7,'#4a4f5c'); t(-6,-9,12,2,'#6a7080');
  } else if(i===8){                            // roi xích
    for(let k=0;k<6;k++) t(-6+k*2,-6+Math.round(Math.sin(k)*3),2,2,k%2?'#7a8090':'#a8b0c0');
    t(6,-7,2,2,'#e0e6f2'); t(-7,2,3,5,'#5c3818');
  } else if(i===9){                            // liềm hái
    t(-1,-6,2,14,'#3a2a20');
    ctx.strokeStyle='#c8cede'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx-2,cy-7,6,-0.3,1.9); ctx.stroke();
  } else {                                     // ba cây kiếm thẳng, dài dần
    const L=[7,9,11][i], Wd=[2,3,3][i];
    t(-Wd/2,-L+2,Wd,L,'#9aa2b6'); t(-Wd/2,-L+2,1,L,'#e8eefb');
    t(-4,3,8,2,'#b08a2e'); t(-1,5,2,3,'#5c3818');
    if(i===2) t(-4,2,8,1,'#d8b85e');
  }
}

let gearRow=0;                                   // 0..2 đồ · 3 tạo hình · 4 kho vũ khí
function updateGear(){
  if(K.downP){gearRow=(gearRow+1)%5;SFX.candle();}
  if(K.upP){gearRow=(gearRow+4)%5;SFX.candle();}
  const step=(d)=>{
    if(gearRow<3){
      const slot=GSLOT[gearRow], list=GEAR[slot];
      for(let k=0;k<list.length;k++){
        const n=(prof.gear[gearRow]+d*(k+1)+list.length*4)%list.length;
        if(list[n].lv<=prof.lv){ prof.gear[gearRow]=n; SFX.item(); saveProf(); break; }
      }
    } else if(gearRow===4){                     // chọn vũ khí mang theo đầu lượt
      for(let k=1;k<=NSW;k++){
        const n=(prof.startW+d*k+NSW*4)%NSW;
        if(prof.owned[n]){ prof.startW=n; SFX.item(); saveProf(); break; }
      }
    } else {
      const list=SKINS[hero];
      for(let k=0;k<list.length;k++){
        const n=(prof.skin[hero]+d*(k+1)+list.length*4)%list.length;
        if(list[n].lv<=prof.lv){ prof.skin[hero]=n; applySkin(); SFX.item(); saveProf(); break; }
      }
    }
  };
  if(K.leftP)step(-1);
  if(K.rightP)step(1);
  if((K.jumpP||K.atkP)&&gearRow===4&&gearFrom!=='menu'){ startTraining(); return; }
  if(K.jumpP||K.atkP){ state=(gearFrom==='menu')?'menu':'title'; }
  if(tap){
    if(tap.y>=238&&tap.y<256&&gearFrom!=='menu'){ tap=null; startTraining(); return; }
    if(tap.y>=256){ state=(gearFrom==='menu')?'menu':'title'; }
    else { const r=Math.floor((tap.y-88)/30); if(r>=0&&r<5){ gearRow=r; step(tap.x<VW/2?-1:1); } }
    tap=null;
  }
}
