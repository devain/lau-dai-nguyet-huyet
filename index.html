<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lâu Đài Nguyệt Huyết</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0a0710;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#c8bcd8;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;overflow:hidden}
  #stage{position:relative;line-height:0;max-width:100%;box-shadow:0 0 0 2px #2a2138,0 0 40px #1b0f2c}
  canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto}
  #pad{width:100%;max-width:760px;display:none;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
  .cluster{display:grid;gap:6px}
  .dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,46px)}
  .acts{grid-template-columns:repeat(2,72px);grid-template-rows:64px}
  .btn{display:flex;align-items:center;justify-content:center;background:#241b33;border:2px solid #4a3a63;border-radius:9px;
       color:#d8cbe8;font:600 13px/1 ui-monospace,monospace;letter-spacing:.5px}
  .btn:active,.btn.on{background:#6a3050;border-color:#c46a8a;color:#fff}
  .btn.big{font-size:12px}
  #bar{display:flex;gap:14px;font-size:11px;color:#6d5f85;letter-spacing:.5px;flex-wrap:wrap;justify-content:center}
  #bar b{color:#a892c4;font-weight:600}
  #bar button{background:none;border:1px solid #4a3a63;color:#8d7aa8;border-radius:5px;padding:3px 8px;font:inherit;font-size:11px}
  @media (pointer:coarse){#pad{display:flex}}
  /* ---- màn hình ngang: canvas chiếm hết màn, nút mờ đè lên hai góc dưới ---- */
  @media (orientation:landscape) and (max-height:620px) and (pointer:coarse),
         (orientation:landscape) and (max-height:620px) and (max-width:960px){
    #wrap{padding:0;gap:0}
    #stage{box-shadow:none}
    #pad{position:fixed;left:0;right:0;bottom:5px;display:flex;justify-content:space-between;
         align-items:flex-end;padding:0 8px;gap:0;pointer-events:none;z-index:4}
    .cluster{pointer-events:auto}
    .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,38px);gap:4px}
    .acts{grid-template-columns:repeat(2,58px);grid-template-rows:52px;gap:5px}
    .btn{opacity:.42;border-radius:12px;backdrop-filter:blur(2px)}
    .btn:active,.btn.on{opacity:.95}
    #bar{position:fixed;top:4px;left:8px;font-size:10px;gap:6px;z-index:5;opacity:.55}
    #bar:hover,#bar:active{opacity:1}
    #bar span{display:none}
  }
  @media (orientation:landscape) and (max-height:620px) and (max-width:700px){
    .dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,34px)}
    .acts{grid-template-columns:repeat(2,52px);grid-template-rows:46px}
    .btn{font-size:11px} .btn.big{font-size:10px}
  }

  /* nền đặc khi vào toàn màn hình, tránh viền trắng của trình duyệt */
  #wrap:fullscreen, #wrap:-webkit-full-screen{background:#0a0710}
  html:fullscreen, :root:fullscreen{background:#0a0710}
  #note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;
        background:#2a1b3a;border:1px solid #6a4a8a;color:#e0d0f0;border-radius:7px;
        padding:6px 11px;font:600 11px/1.35 ui-monospace,monospace;max-width:88vw;
        text-align:center;display:none}
</style>
</head>
<body>
<div id="note"></div>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="512" height="288"></canvas></div>
  <div id="pad">
    <div class="cluster dpad">
      <i></i><div class="btn" data-k="up">▲</div><i></i>
      <div class="btn" data-k="left">◀</div><i></i><div class="btn" data-k="right">▶</div>
      <i></i><div class="btn" data-k="down">▼</div><i></i>
    </div>
    <div class="cluster acts">
      <div class="btn big" data-k="atk">KIẾM</div>
      <div class="btn big" data-k="jump">NHẢY</div>
    </div>
  </div>
  <div id="bar">
    <span><b>Z/J</b> kiếm · <b>X/K</b> nhảy · <b>↑+Z</b> phụ khí · đứng ở mũi ▲ rồi <b>giữ ↑</b> để leo thang</span>
    <button id="fs">⛶ Toàn màn hình</button>
    <button id="menu">☰ Menu</button>
    <button id="mute">🔊 Nhạc</button>
  </div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const SS=2;                       // supersample factor
cv.width=512*SS; cv.height=288*SS;
ctx.setTransform(SS,0,0,SS,0,0);  // all drawing stays in 512x288 logical space
ctx.imageSmoothingEnabled=false;
const VW=512, VH=288, TW=16, MH=18;

/* ================= INPUT ================= */
const K={left:0,right:0,up:0,down:0,atk:0,jump:0,atkP:0,jumpP:0,upP:0,downP:0,leftP:0,rightP:0,anyP:0};
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyZ:'atk',KeyJ:'atk',KeyX:'jump',KeyK:'jump',Space:'jump',Enter:'jump'};
addEventListener('keydown',e=>{const n=KEYMAP[e.code]; if(!n)return; e.preventDefault(); if(!e.repeat){K[n]=1;K[n+'P']=1;} audioUnlock();},{passive:false});
addEventListener('keyup',e=>{const n=KEYMAP[e.code]; if(!n)return; e.preventDefault(); K[n]=0;},{passive:false});
/* Nút cảm ứng: hit-test theo toạ độ ngón thay vì gắn sự kiện lên từng nút.
   Chạm cảm ứng bị "implicit pointer capture" nên trượt từ ◀ sang ▶ KHÔNG phát
   pointerdown trên ▶ - phải nhấc ngón lên mới đổi được hướng. Đây là cách sửa. */
const BTNS=[...document.querySelectorAll('[data-k]')];
const touchMap=new Map();               // pointerId -> tên nút
const SNAP=30;                          // bán kính hút, để hở giữa các nút vẫn ăn
function btnAt(x,y){
  let best=null,bd=1e9;
  for(const b of BTNS){
    const r=b.getBoundingClientRect();
    if(!r.width) continue;
    const cx=Math.max(r.left,Math.min(x,r.right));
    const cy=Math.max(r.top ,Math.min(y,r.bottom));
    const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    if(d<bd){bd=d;best=b;}
  }
  return bd<=SNAP*SNAP?best:null;
}
function syncTouch(){
  const held=new Set([...touchMap.values()]);
  for(const b of BTNS) b.classList.toggle('on',held.has(b.dataset.k));
  for(const n of ['left','right','up','down','atk','jump']){
    if(held.has(n)){ if(!K[n]){K[n]=1;K[n+'P']=1;} }
    else K[n]=0;
  }
}
function padDown(e){
  const b=btnAt(e.clientX,e.clientY);
  if(!b) return;
  e.preventDefault();
  touchMap.set(e.pointerId,b.dataset.k);
  syncTouch(); audioUnlock();
}
function padMove(e){
  if(!touchMap.has(e.pointerId)) return;
  e.preventDefault();
  const b=btnAt(e.clientX,e.clientY);
  const now=b?b.dataset.k:null;
  if(touchMap.get(e.pointerId)!==now){
    if(now) touchMap.set(e.pointerId,now); else touchMap.delete(e.pointerId);
    syncTouch();
  }
}
function padUp(e){
  if(!touchMap.has(e.pointerId)) return;
  touchMap.delete(e.pointerId); syncTouch();
}
document.getElementById('pad').addEventListener('pointerdown',padDown,{passive:false});
addEventListener('pointermove',padMove,{passive:false});
addEventListener('pointerup',padUp);
addEventListener('pointercancel',padUp);
addEventListener('blur',()=>{touchMap.clear();syncTouch();});
let tap=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(r.width>0) tap={x:(e.clientX-r.left)/r.width*512, y:(e.clientY-r.top)/r.height*288};
  K.anyP=1; audioUnlock();
});
function openMenu(){ if(state==='play'){state='menu';menuSel=0;} else if(state==='menu'){state='play';} }
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();openMenu();}
  if(e.code==='KeyR'&&(state==='play'||state==='menu')){e.preventDefault();state='play';p.cp=0;buildStage(stage);resetStage(true);}
},{passive:false});
function clearEdges(){K.atkP=K.jumpP=K.upP=K.downP=K.leftP=K.rightP=K.anyP=0; tap=null;}

/* ================= AUDIO ================= */
let AC=null, musicOn=true, musicTimer=null, step=0;
function audioUnlock(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;} startMusic(); } if(AC.state==='suspended')AC.resume(); }
function tone(freq,dur,type,vol,slide){
  if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol){
  if(!AC)return; const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur);
  const b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const g=AC.createGain(); g.gain.value=vol||0.05;
  s.connect(g); g.connect(AC.destination); s.start(t);
}
const SFX={
  whip:()=>{noise(0.06,0.035);tone(760,0.1,'triangle',0.03,2.0);},
  drain:()=>{tone(180,0.16,'sine',0.05,2.4);setTimeout(()=>tone(520,0.1,'triangle',0.03,0.5),60);},
  iai:()=>{noise(0.045,0.03);tone(1500,0.07,'triangle',0.03,0.35);
    setTimeout(()=>tone(2100,0.16,'sine',0.022,0.6),40);},
  jump:()=>tone(300,0.12,'square',0.04,2.2),
  hit:()=>{noise(0.07,0.07);tone(150,0.1,'square',0.05,0.5);},
  hurt:()=>tone(260,0.28,'sawtooth',0.06,0.35),
  item:()=>{tone(880,0.07,'square',0.05);setTimeout(()=>tone(1320,0.1,'square',0.05),70);},
  candle:()=>tone(500,0.05,'square',0.03,1.6),
  throw:()=>tone(700,0.07,'triangle',0.04,1.5),
  boss:()=>tone(90,0.5,'sawtooth',0.07,0.6),
  die:()=>{[400,330,260,180].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'square',0.06),i*130));},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'square',0.06),i*140));}
};
const CHORDS=[[45,57,60,64],[41,53,57,60],[43,55,59,62],[40,52,56,59]];
const LEADS=[[72,71,69,71],[69,68,65,68],[67,71,74,71],[68,71,68,64]];
const mid=n=>440*Math.pow(2,(n-69)/12);
function startMusic(){
  if(musicTimer)clearInterval(musicTimer);
  musicTimer=setInterval(()=>{
    if(!musicOn||!AC||AC.state!=='running')return;
    const ci=Math.floor(step/8)%4, ch=CHORDS[ci], s=step%8;
    if(s%2===0) tone(mid(ch[0]-12),0.14,'triangle',0.055);
    tone(mid(ch[1+(s%3)]),0.1,'square',0.022);
    if(s===0||s===4) tone(mid(LEADS[ci][(step>>2)%4]),0.3,'square',0.03);
    if(s===0||s===4) noise(0.04,0.03);
    step++;
  },125);
}
document.getElementById('menu').onclick=()=>{openMenu();audioUnlock();};
document.getElementById('mute').onclick=()=>{musicOn=!musicOn;document.getElementById('mute').textContent=(musicOn?'🔊':'🔇')+' Nhạc';audioUnlock();};

/* ================= BẢNG ĐIỂM CAO (window.storage) ================= */
const SKEY='nguyethuyet:scores:v2';
let hiScores=[], hiReady=false, hiErr='', lastRank=-1, submitted=false;
async function loadScores(){
  try{
    if(!window.storage){ hiErr='không có bộ lưu'; hiReady=true; return; }
    const r=await window.storage.get(SKEY);
    if(r&&r.value){ const v=JSON.parse(r.value); if(Array.isArray(v)) hiScores=v; }
  }catch(e){ /* chưa có bản ghi nào - không phải lỗi */ }
  hiReady=true;
}
async function saveScores(){
  try{ if(window.storage) await window.storage.set(SKEY,JSON.stringify(hiScores)); }
  catch(e){ hiErr='không lưu được'; }
}
function submitScore(){
  if(score<=0) return;
  const rec={s:score,h:HEROES[hero].name,st:stage,w:SWORDNAME[p.whip],d:Date.now()};
  hiScores.push(rec);
  hiScores.sort((a,b)=>b.s-a.s);
  hiScores=hiScores.slice(0,5);
  lastRank=hiScores.indexOf(rec);
  saveScores();
}
function endRun(st){
  if(!submitted){ submitted=true; submitScore(); }
  state=st;
}
loadScores();

/* ================= LEVEL ================= */
/* Tile: 0 trống · 1 gạch · 2 bục · 3 thang phải · 4 thang trái · 5 gai · 6 sàn gỗ */
let MW=215, LW=MW*TW;   // đổi theo từng màn
let grid=[], stairs=[], candleDefs=[], spawnDefs=[], moverDefs=[], CHECK=[];
let stage=1, stageName='', bossName='', bossKind='death', bossTrigger=0, arenaX=0;

function box(x,y,w,h,t){t=t===undefined?1:t;
  for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) if(i>=0&&i<MW&&j>=0&&j<MH) grid[j][i]=t;}
function stair(x,y,len,dir){
  const pts=[{x:(x-dir)*TW+8,y:(y+1)*TW}];
  for(let k=0;k<len;k++){const i=x+dir*k,j=y-k; if(i>=0&&i<MW&&j>=0&&j<MH) grid[j][i]=dir>0?3:4; pts.push({x:i*TW+8,y:(j+1)*TW});}
  pts.push({x:(x+dir*len)*TW+8,y:(y-len+1)*TW});
  stairs.push({pts,dir,len});
}
function candle(tx,ty,item){candleDefs.push({x:tx*TW+8,y:ty*TW+14,item:item||'heart'});}
function spawn(type,tx,ty){spawnDefs.push({type,x:tx*TW+8,y:ty*TW+TW});}
// bục di chuyển: dài w ô, đi từ (tx,ty) theo trục axis, biên độ span ô, tốc sp
function mover(tx,ty,w,axis,span,sp){
  moverDefs.push({x0:tx*TW,y0:ty*TW,w:w*TW,h:6,axis,span:span*TW,sp:sp||0.6,ph:Math.random()*6.28});
}
function solid(tx,ty){ if(tx<0||tx>=MW) return true; if(ty<0||ty>=MH) return false;
  const t=grid[ty][tx]; return t===1||t===2||t===5||t===6; }
function spikeAt(tx,ty){ return ty>=0&&ty<MH&&tx>=0&&tx<MW&&grid[ty][tx]===5; }

/* ---------------- MÀN 1: Tiền đình lâu đài ---------------- */
function buildStage1(){
  MW=215; resetGrid();
  stageName='TIỀN ĐÌNH'; bossName='TỬ THẦN'; bossKind='death';
  box(0,15,MW,3); box(0,0,1,18);
  box(29,15,3,3,0); box(88,15,3,3,0); box(104,15,2,3,0); box(166,15,3,3,0); box(174,15,3,3,0);
  box(103,12,4,1,2); box(165,12,2,1,2); box(173,12,3,1,2); box(96,11,4,1,2);
  box(49,10,22,2); stair(44,14,5,1); stair(75,14,5,-1);
  box(130,10,23,2); stair(125,14,5,1); stair(157,14,5,-1);
  box(112,9,8,1,2); box(118,13,5,1,2);
  box(213,0,2,18); box(182,0,1,10);
  box(0,0,MW,1);

  [[6,13],[10,13],[16,13],[21,13],[26,13],[35,13],[40,13],[52,8],[57,8],[62,8],[67,8],
   [80,13],[85,13],[94,13],[99,13],[110,13],[115,7],[122,11],[128,13],[135,8],[141,8],
   [147,8],[150,8],[160,13],[170,13],[179,13],[186,13],[195,13]].forEach(c=>candle(c[0],c[1]));
  candleDefs[4].item='dagger';  candleDefs[7].item='whip';
  candleDefs[9].item='axe';     candleDefs[12].item='heart5';
  candleDefs[15].item='holy';   candleDefs[17].item='meat';
  candleDefs[20].item='whip';   candleDefs[22].item='heart5';
  candleDefs[24].item='axe';    candleDefs[26].item='meat';
  candleDefs[27].item='heart5';
  candle(97,10,'katana');

  [[12,14],[19,14],[24,14],[38,14],[42,14],[82,14],[92,14],[110,14],[163,14],[180,14]].forEach(q=>spawn('zombie',q[0],q[1]));
  [[27,9],[34,8],[46,7],[86,9],[102,8],[121,7],[168,8],[177,9]].forEach(q=>spawn('bat',q[0],q[1]));
  [[55,9],[65,9],[97,14],[113,14],[137,9],[148,9],[161,14],[190,14]].forEach(q=>spawn('skel',q[0],q[1]));
  [[60,8],[68,8],[133,8],[145,8],[152,8]].forEach(q=>spawn('medusa',q[0],q[1]));

  CHECK=[{x:40,y:240},{x:80*16,y:240},{x:130*16,y:160},{x:186*16,y:240}];
  bossTrigger=190*TW; arenaX=182;
}

/* ---------------- MÀN 2: Hầm mộ & nhà nguyện đổ ---------------- */
function buildStage2(){
  MW=232; resetGrid();
  stageName='HẦM MỘ'; bossName='BÁ TƯỚC'; bossKind='count';
  box(0,15,MW,3); box(0,0,1,18); box(0,0,MW,1);

  // --- khu 1: hầm mộ, hố gai xen kẽ ---
  box(22,15,4,3,0); box(22,17,4,1,5);            // hố có gai đáy
  box(23,12,2,1,6);                               // ván gỗ cứu mạng
  box(38,15,3,3,0); box(38,17,3,1,5);
  box(50,14,1,1,5); box(58,14,1,1,5);             // gai lẻ trên sàn
  mover(30,12,3,'x',5,0.7);                       // bục ngang qua khoảng trống
  box(29,13,1,5); box(36,13,1,5);                 // hai trụ hai bên bục

  // --- khu 2: giếng trời, leo bục dọc ---
  box(66,15,10,3,0); box(66,17,10,1,5);
  mover(68,13,3,'y',4,0.5);
  mover(73,11,3,'y',4,0.55);
  box(78,10,14,2); stair(94,14,5,-1);             // sàn trên rồi thang xuống
  box(78,9,1,6);
  [[80,8],[84,8],[88,8]].forEach(c=>candle(c[0],c[1]));

  // --- khu 3: nhà nguyện, đèn chùm rơi ---
  box(100,11,4,1,2); box(108,9,4,1,2); box(116,11,4,1,2);
  box(112,15,3,3,0);
  spawn('chandelier',103,6); spawn('chandelier',111,6); spawn('chandelier',119,6);
  box(124,10,18,2); stair(119,14,5,1); stair(147,14,5,-1);
  box(130,7,6,1,2);

  // --- khu 4: hành lang gai, bục ngang ---
  box(152,15,6,3,0); box(152,17,6,1,5);
  mover(152,12,4,'x',3,0.9);
  box(164,14,1,1,5); box(168,14,1,1,5); box(172,14,1,1,5);
  box(178,15,5,3,0); box(178,17,5,1,5);
  mover(178,11,3,'x',4,0.75);
  box(188,12,5,1,2); box(196,10,5,1,2);

  // --- đấu trường boss ---
  box(230,0,2,18); box(199,0,1,10);

  [[6,13],[12,13],[18,13],[44,13],[54,13],[62,13],[97,13],[101,10],[109,8],[117,10],
   [126,8],[132,6],[138,8],[145,8],[160,13],[166,13],[176,13],[186,13],[190,11],
   [198,11],[206,13],[214,13],[222,13]].forEach(c=>candle(c[0],c[1]));
  const L=candleDefs.length;
  candleDefs[3].item='heart5'; candleDefs[6].item='axe';
  candleDefs[9].item='meat';   candleDefs[11].item='katana';
  candleDefs[13].item='holy';  candleDefs[16].item='heart5';
  candleDefs[18].item='meat';  candleDefs[L-3].item='heart5';
  candle(197,9,'blood');
  candleDefs[L-1].item='meat';

  [[10,14],[16,14],[46,14],[56,14],[100,14],[143,14],[162,14],[186,14],[205,14],[214,14]].forEach(q=>spawn('zombie',q[0],q[1]));
  [[28,8],[34,7],[70,7],[105,6],[115,6],[155,8],[181,7],[210,8]].forEach(q=>spawn('bat',q[0],q[1]));

function hash(a,b){let h=a*374761393+b*668265263;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
const TILEPAL=[
  null,
  {base:'#443c56',b2:'#4b4159',hi:'#564a6c',hi2:'#4e4363',s1:'#4a3f5e',s2:'#524668',
   s3:'#463b5a',mortar:'#2a2338',moss:'#3a5a3c',rail:'#6a5c80',railHi:'#8a7aa4',railSh:'#3a3150'},
  {base:'#3b4a42',b2:'#42544a',hi:'#4c6055',hi2:'#455a4f',s1:'#3d5147',s2:'#476054',
   s3:'#3a4c43',mortar:'#22302a',moss:'#6a8a3c',rail:'#5c6f64',railHi:'#7f978a',railSh:'#2c3a33'}
];

    const t=grid[y][x], px=x*TW, py=y*TW, v=hash(x,y);
    if(t===1||t===2){
      lg.fillStyle=t===2?C.b2:C.base; lg.fillRect(px,py,16,16);
      lg.fillStyle=v>0.75?C.hi:C.hi2;  lg.fillRect(px+1,py+1,14,6);
      lg.fillStyle=v>0.5?C.s1:C.s2;    lg.fillRect(px+1,py+9,6,6);
      lg.fillStyle=C.s3;               lg.fillRect(px+9,py+9,6,6);
      lg.fillStyle=C.mortar; lg.fillRect(px,py+8,16,1); lg.fillRect(px+8,py+9,1,7); lg.fillRect(px,py,1,16);
      if(v>0.93){lg.fillStyle=C.moss; lg.fillRect(px+2,py+1,3,2); lg.fillRect(px+10,py+10,4,2);}
    } else if(t===6){                                  // ván gỗ
      lg.fillStyle='#6b4a2a'; lg.fillRect(px,py,16,7);
      lg.fillStyle='#8a6238'; lg.fillRect(px,py,16,3);
      lg.fillStyle='#3f2a14'; lg.fillRect(px,py+7,16,2);
      lg.fillStyle='#2a1c0e'; lg.fillRect(px+3,py+1,1,6); lg.fillRect(px+11,py+1,1,6);
    } else if(t===5){                                  // gai
      lg.fillStyle='#241c28'; lg.fillRect(px,py+11,16,5);
      for(let k=0;k<4;k++){
        const sx=px+k*4;
        lg.fillStyle='#8f97a8'; lg.fillRect(sx+1,py+4,2,8);
        lg.fillStyle='#d4dcea'; lg.fillRect(sx+1,py+4,1,8);
        lg.fillStyle='#f2f6ff'; lg.fillRect(sx+1,py+3,2,2);
      }
    } else if(t===3||t===4){
      const d=t===3?1:-1;
      lg.fillStyle=C.rail;   lg.fillRect(px+(d>0?0:8),py+8,8,4);
      lg.fillStyle=C.railHi; lg.fillRect(px+(d>0?0:8),py+8,8,2);
      lg.fillStyle=C.railSh; lg.fillRect(px+(d>0?0:8),py+12,8,2);
      lg.fillStyle=C.rail;   lg.fillRect(px+(d>0?8:0),py,8,4);
      lg.fillStyle=C.railHi; lg.fillRect(px+(d>0?8:0),py,8,2);
      lg.fillStyle=C.railSh; lg.fillRect(px+(d>0?8:0),py+4,8,2);
    }
  }
}

/* ================= HELPERS ================= */
function collideX(e,dx){
  e.x+=dx;
  const t=Math.floor((e.y-e.h+2)/TW), b=Math.floor((e.y-1)/TW);
  if(dx>0){const tx=Math.floor((e.x+e.w/2)/TW); for(let ty=t;ty<=b;ty++) if(solid(tx,ty)){e.x=tx*TW-e.w/2-0.01;e.bumpX=1;return;}}
  else if(dx<0){const tx=Math.floor((e.x-e.w/2)/TW); for(let ty=t;ty<=b;ty++) if(solid(tx,ty)){e.x=(tx+1)*TW+e.w/2+0.01;e.bumpX=-1;return;}}
}
function collideY(e,dy){
  e.y+=dy;
  const l=Math.floor((e.x-e.w/2+2)/TW), r=Math.floor((e.x+e.w/2-2)/TW);
  if(dy>0){const ty=Math.floor(e.y/TW); for(let tx=l;tx<=r;tx++) if(solid(tx,ty)){e.y=ty*TW;e.vy=0;e.onGround=true;return;}}
  else if(dy<0){const ty=Math.floor((e.y-e.h)/TW); for(let tx=l;tx<=r;tx++) if(solid(tx,ty)){e.y=(ty+1)*TW+e.h;e.vy=0.5;return;}}
}
function step2(e,dx,dy){
  let n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/4));
  e.onGround=false;
  for(let i=0;i<n;i++){collideX(e,dx/n); collideY(e,dy/n);}
}
const AABB=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function burst(x,y,c,n,sp){for(let i=0;i<(n||8);i++){const a=Math.random()*6.283,v=(sp||2)*(0.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:20+Math.random()*16,c});}}
function popText(x,y,t){parts.push({x,y,vx:0,vy:-0.5,life:40,txt:t,c:'#ffe08a'});}

/* ================= PLAYER ================= */
const SWORDLEN=[30,42,54,46,40], SWORDDMG=[2,3,4,3,3], SWORDDUR=[18,18,18,11,14];
const SWORDNAME=['ĐOẢN KIẾM','TRƯỜNG KIẾM','ĐẠI KIẾM','KATANA','HUYẾT KIẾM'];
const BLOOD=4;                       // chỉ số của Huyết Kiếm
const DRAIN=270;                     // rút 1 HP mỗi 270 frame (~4,5 giây)
function updatePlayer(){
  if(p.dead){p.vy+=0.32; p.y+=p.vy; return;}
  if(p.orb>0){p.orb--; return;}
  if(p.inv>0)p.inv--;
  if(p.stairCool>0)p.stairCool--;
  // Huyết Kiếm: lưỡi kiếm tự uống máu chủ nhân, nhưng không hạ nổi xuống dưới 2 HP
  if(p.whip===BLOOD&&!p.dead){
    p.drainT=(p.drainT||0)+1;
    if(p.drainT>=DRAIN){
      p.drainT=0;
      if(p.hp>2){ p.hp--; SFX.drain(); burst(p.x,p.y-20,'#8a1020',5,1.2); }
    }
  } else p.drainT=0;

  // stairs
  if(p.stair){
    const st=p.stair; let mv=0;
    const asc = K.up || (st.dir>0?K.right:K.left);
    const des = K.down || (st.dir>0?K.left:K.right);
    if(p.atk<=0){
      if(asc)mv=1; else if(des)mv=-1;
      if(mv){ p.s+=mv*0.095; p.anim+=0.16; p.face=(st.dir*mv>0)?1:-1; }
    }
    if(K.jumpP){ // thoát khỏi cầu thang
      p.stair=null; p.vy=-4.2; p.vx=p.face*1.2; p.onGround=false; p.stairCool=18; SFX.jump(); return;
    }
    if(p.s<=0){p.stair=null; p.x=st.pts[0].x; p.y=st.pts[0].y; p.stairCool=6;}
    else if(p.s>=st.pts.length-1){p.stair=null; const q=st.pts[st.pts.length-1]; p.x=q.x; p.y=q.y; p.stairCool=6;}
    else{
      const i=Math.floor(p.s), f=p.s-i, a=st.pts[i], b=st.pts[i+1];
      p.x=a.x+(b.x-a.x)*f; p.y=a.y+(b.y-a.y)*f;
    }
    p.onGround=true; p.vy=0; p.crouch=false;
  } else {
    // enter stairs
    if((K.up||K.down)&&p.onGround&&p.atk<=0&&p.stairCool<=0){
      for(const st of stairs){
        const bot=st.pts[0], top=st.pts[st.pts.length-1];
        if(K.up&&Math.abs(p.x-bot.x)<26&&Math.abs(p.y-bot.y)<12){
          p.stair=st; p.s=0.02; p.x=bot.x; p.y=bot.y; p.vx=0; p.vy=0; break;
        }
        if(K.down&&Math.abs(p.x-top.x)<26&&Math.abs(p.y-top.y)<12){
          p.stair=st; p.s=st.pts.length-1.02; p.x=top.x; p.y=top.y; p.vx=0; p.vy=0; break;
        }
      }
    }
    if(!p.stair){
      p.crouch=p.onGround&&K.down&&p.atk<=0?true:(p.onGround&&K.down);
      const SP=HEROES[hero].spd;
      if(p.jbuf>0)p.jbuf--;
      if(K.jumpP)p.jbuf=9;                       // đệm: bấm sớm vẫn nhớ 9 frame
      if(p.knock>0){p.knock--;}
      else if(p.onGround){
        if(p.atk>0||p.crouch) p.vx=0;
        else{
          p.vx=0;
          if(K.left){p.vx=-SP;p.face=-1;}
          if(K.right){p.vx=SP;p.face=1;}
        }
      } else {
        // lái trên không: chỉnh được nhưng chậm, đà lúc nhảy vẫn quan trọng
        if(K.left){ p.vx=Math.max(-SP,p.vx-0.085); p.face=-1; }
        if(K.right){ p.vx=Math.min( SP,p.vx+0.085); p.face= 1; }
      }
      // coyote: rời mép rồi vẫn nhảy được trong 7 frame
      if(p.jbuf>0&&p.coyote>0&&!p.crouch&&p.knock<=0){
        p.vy=-HEROES[hero].jmp; p.onGround=false; p.jbuf=0; p.coyote=0; SFX.jump();
      }
      p.vy+=0.32; if(p.vy>9)p.vy=9;
      p.h=p.crouch?18:26;
      const ride=riding();
      if(ride){ p.x+=ride.x-ride.px; }                 // bục mang đi ngang
      step2(p,p.vx,p.vy);
      // hạ cánh lên bục di chuyển
      if(!p.onGround&&p.vy>=0){
        for(const m of movers){
          if(p.x+5>m.x&&p.x-5<m.x+m.w&&p.y>=m.y-10&&p.y<=m.y+Math.max(8,m.y-m.py+8)){
            p.y=m.y; p.vy=0; p.onGround=true; break;
          }
        }
      }
      if(p.onGround)p.coyote=7; else if(p.coyote>0)p.coyote--;
      // ghi nhớ chỗ đứng an toàn gần nhất (đất đặc, không phải gai, không phải bục)
      const onSpike=spikeAt(Math.floor(p.x/TW),Math.floor(p.y/TW));
      if(p.onGround&&!onSpike&&!ride){ p.safeX=p.x; p.safeY=p.y; }
      // gai: mất 4 HP rồi bị hất về chỗ an toàn vừa rời
      if(!p.dead&&p.inv<=0&&onSpike){
        hurtPlayer(4,p.x);
        burst(p.x,p.y-8,'#c8203c',12,2.4);
        shake=Math.max(shake,7);
        // chốt chặn: điểm an toàn phải là đất đặc và không phải gai, nếu không thì về checkpoint
        let sx=p.safeX, sy=p.safeY;
        const stx=Math.floor(sx/TW), sty=Math.floor(sy/TW);
        if(spikeAt(stx,sty)||!solid(stx,sty)){ const c=CHECK[p.cp||0]; sx=c.x; sy=c.y; }
        p.x=sx; p.y=sy; p.safeX=sx; p.safeY=sy; p.vx=0; p.vy=0; p.knock=0; p.stair=null;
        for(let i=0;i<8;i++)burst(sx,sy-14,'#8fa4ff',1,2);
      }
      if(p.vx&&p.onGround&&p.knock<=0)p.anim+=0.16; else if(p.onGround)p.anim=0;
    }
  }

  // attack
  // both timers tick together, so p.thr never lags p.atk by a frame
  if(p.atk>0)p.atk--;
  if(p.thr>0)p.thr--;
  if(K.atkP&&p.atk<=0){
    if(K.up&&p.sub&&p.hearts>0&&!p.stair){
      const D=throwDur();
      p.atk=D; p.thr=D; p.thrDur=D; p.thrType=p.sub; p.thrDir=p.face; p.hitDone=true;
    } else {
      p.atk=swingDur(); p.thr=0; p.hitDone=false; p.whip===3?SFX.iai():SFX.whip();
    }
  }
  // release the sub-weapon partway through the throw animation
  if(p.thr>0){
    if(p.thr===Math.ceil(p.thrDur*0.5)&&p.hearts>0){
      p.hearts--; SFX.throw();
      const y=p.y-16, d=p.thrDir, t=p.thrType;
      if(t==='dagger') shots.push({x:p.x+d*10,y,vx:d*4.2,vy:0,w:10,h:4,t:'dagger',dmg:1,life:120,friendly:1});
      if(t==='axe') shots.push({x:p.x+d*10,y,vx:d*2.2,vy:-5,w:12,h:12,t:'axe',dmg:2,life:150,friendly:1,g:0.18,rot:0});
      if(t==='holy') shots.push({x:p.x+d*10,y,vx:d*1.6,vy:-1.5,w:8,h:10,t:'holy',dmg:1,life:200,friendly:1,g:0.3});
    }
  }
  const SDUR=swingDur();
  if(p.thr<=0&&p.atk>0&&p.atk<=SDUR-3&&p.atk>=Math.floor(SDUR*0.18)&&!p.hitDone){
    const len=SWORDLEN[p.whip], dmg=SWORDDMG[p.whip];
    const hy=(p.crouch?p.y-10:p.y-19);
    const box={x:p.face>0?p.x+2:p.x-2-len,y:hy-11,w:len,h:24};
    let hit=false;
    for(const c of candles) if(c.alive&&box.x<c.x+5&&box.x+box.w>c.x-5&&box.y<c.y+8&&box.y+box.h>c.y-10){
      c.alive=false; SFX.candle(); burst(c.x,c.y,'#ffb24a',10,2); dropItem(c.x,c.y-4,c.item); score+=100;
    }
    for(const e of enemies) if(e.alive&&box.x<e.x+e.w/2&&box.x+box.w>e.x-e.w/2&&box.y<e.y&&box.y+box.h>e.y-e.h){
      damage(e,dmg); hit=true;
    }
    for(const s of shots) if(!s.friendly&&s.breakable&&box.x<s.x+s.w/2&&box.x+box.w>s.x-s.w/2&&box.y<s.y+s.h/2&&box.y+box.h>s.y-s.h/2){s.life=0;burst(s.x,s.y,'#dcd2e8',6,2);score+=50;}
    if(boss&&boss.alive&&box.x<boss.x+19&&box.x+box.w>boss.x-19&&box.y<boss.y&&box.y+box.h>boss.y-36){damage(boss,dmg);hit=true;}
    if(hit){
      p.hitDone=true;
      if(p.whip===BLOOD&&p.hp<p.maxhp){
        p.hp=Math.min(p.maxhp,p.hp+1);
        SFX.drain();
        popText(p.x,p.y-34,'+1');
      }
    }
  }

  // falling / timer death
  if(p.y>MH*TW+40&&!p.dead) killPlayer(true);
  if(p.hp<=0&&!p.dead) killPlayer(false);
}
function killPlayer(pit){
  p.dead=true; p.vy=pit?2:-4; p.deadT=0; SFX.die();
}
function hurtPlayer(dmg,fromX){
  if(p.inv>0||p.dead)return;
  p.hp-=dmg; p.inv=90; p.blink=true; p.thr=0; p.atk=0; SFX.hurt(); shake=8;
  p.stair=null;
  p.knock=14; p.vx=(p.x<fromX?-1:1)*1.35; p.vy=-2.8; p.onGround=false;
  if(p.hp<=0)killPlayer(false);
}
function dropItem(x,y,t){
  if(t==='whip'&&p.whip>=2)t='heart5';
  items.push({x,y,vy:-1.5,t,life:420,w:12,h:12});
}

function makeEnemy(d){
  const b={x:d.x,y:d.y,vx:0,vy:0,alive:true,face:-1,t:0,def:d,type:d.type,flash:0};
  if(d.type==='zombie'){Object.assign(b,{w:13,h:24,hp:2,pts:200,dmg:2,speed:0.42});}
  if(d.type==='bat'){Object.assign(b,{w:22,h:16,hp:1,pts:200,dmg:2,y:d.y-8,hang:1,ox:d.x,oy:d.y-8,
    baseY:d.y-8,vx:0,wob:Math.random()*6.28});}
  if(d.type==='skel'){Object.assign(b,{w:14,h:24,hp:4,pts:400,dmg:3,speed:0.5,cd:60+Math.random()*60,home:d.x});}
  if(d.type==='hunch'){Object.assign(b,{w:14,h:20,hp:2,pts:300,dmg:2,cd:20+Math.random()*40,vy:0});}
  if(d.type==='chandelier'){Object.assign(b,{w:26,h:14,hp:3,pts:400,dmg:4,y:d.y-TW,oy:d.y-TW,
    drop:0,vy:0,hangY:d.y-TW});}
  if(d.type==='medusa'){Object.assign(b,{w:19,h:16,hp:1,pts:300,dmg:2,y:d.y-8,oy:d.y-8,base:d.y-8,dir:-1});}
  return b;
}
function damage(e,d){
  e.hp-=d; e.flash=6; SFX.hit(); burst(e.x,e.y-e.h/2,'#e8a0c0',5,1.6);
  if(e.type==='boss'&&e.hp>0){
    e.x+=(e.x<p.x?-6:6); shake=Math.max(shake,4);
    if(e.dive>0){ e.diveHits++; if(e.diveHits>=2){ e.dive=0; e.tp=0; } }
  }
  if(e.hp<=0){
    e.alive=false; score+=e.pts||200; burst(e.x,e.y-(e.h||20)/2,'#ffd48a',14,2.6);
    if(e===boss){ endT=1; SFX.win(); flash=30; }
    else if(Math.random()<0.35) dropItem(e.x,e.y-10,Math.random()<0.25?'heart5':'heart');
  }
}
function updateMovers(){
  for(const m of movers){
    m.px=m.x; m.py=m.y; m.t+=m.sp;
    const o=Math.sin(m.t*0.02)*0.5+0.5;             // 0..1 mượt, không giật ở hai đầu
    if(m.axis==='x'){ m.x=m.x0+o*m.span; m.y=m.y0; }
    else            { m.y=m.y0+o*m.span; m.x=m.x0; }
  }
}
// đứng trên bục thì được mang theo
function riding(){
  if(p.stair||p.vy<-0.1) return null;
  for(const m of movers){
    if(p.x+5>m.x&&p.x-5<m.x+m.w&&p.y>=m.y-4&&p.y<=m.y+8) return m;
  }
  return null;
}
function updateEnemies(){
  // activation
  for(const d of spawnDefs){
    if(d.done)continue;
    if(d.x>cam.x-40&&d.x<cam.x+VW+40&&Math.abs(d.x-p.x)>60){ d.done=true; enemies.push(makeEnemy(d)); }
  }
  for(const d of spawnDefs) if(d.done&&(d.x<cam.x-260||d.x>cam.x+VW+260)) d.done=false;
  enemies=enemies.filter(e=>{
    if(!e.alive)return false;
    if(e.x<cam.x-240||e.x>cam.x+VW+240){e.def.done=false;return false;}
    return true;
  });

  for(const e of enemies){
    e.t++; if(e.flash>0)e.flash--;
    if(e.type==='zombie'){
      e.face=p.x<e.x?-1:1;
      e.bumpX=0; step2(e,e.face*e.speed,(e.vy+=0.3));
      if(e.bumpX)e.vy=-3.2;
    }
    else if(e.type==='bat'){
      if(e.hang){
        e.y=e.oy+Math.sin(e.t*0.05)*0.7;           // treo ngược, khẽ đưa
        if(Math.abs(p.x-e.x)<110&&Math.abs(p.y-e.y)<130){
          e.hang=0; e.t=0; e.vx=0; e.baseY=e.y;    // bám từ đúng chỗ đang treo -> không giật
        }
      } else {
        const ox=e.x, oy2=e.y;
        // lái ngang bằng gia tốc, không bật/tắt cứng
        const dx=p.x-e.x;
        if(Math.abs(dx)>20) e.vx+=(dx<0?-1:1)*0.035;
        else e.vx*=0.93;
        if(e.vx> 0.95)e.vx= 0.95;
        if(e.vx<-0.95)e.vx=-0.95;
        e.x+=e.vx;
        // đường bay nền chỉ trôi tối đa ~1.3px/frame về phía người chơi
        const tgt=Math.max(34,Math.min(MH*TW-26,p.y-24));
        e.baseY+=(tgt-e.baseY)*0.019;
        e.y=e.baseY+Math.sin(e.t*0.09+e.wob)*13;
        if(Math.abs(e.vx)>0.12) e.face=e.vx<0?-1:1;
        // không xuyên tường: dội nhẹ ra
        const tx=Math.floor(e.x/TW), ty=Math.floor((e.y-8)/TW);
        if(solid(tx,ty)){
          e.x=ox; e.y=oy2; e.vx*=-0.45;
          e.baseY=oy2-Math.sin(e.t*0.09+e.wob)*13;
        }
      }
    }
    else if(e.type==='hunch'){
      // nhảy chồm về phía người chơi, trên không không đổi hướng
      e.vy=(e.vy||0)+0.34;
      e.bumpX=0; step2(e,e.vx||0,e.vy);
      if(e.onGround){
        e.vx=0; e.cd--;
        if(e.cd<=0){
          e.cd=34+Math.random()*26;
          e.face=p.x<e.x?-1:1;
          e.vx=e.face*1.5; e.vy=-4.6; e.onGround=false;
        }
      } else if(e.bumpX) e.vx*=-0.6;
    }
    else if(e.type==='chandelier'){
      // treo trên trần, người chơi đi qua bên dưới thì rơi
      if(!e.drop){
        e.y=e.hangY+Math.sin(e.t*0.05)*1.2;
        if(Math.abs(p.x-e.x)<26&&p.y>e.y){ e.drop=1; e.vy=0; shake=Math.max(shake,3); }
      } else {
        e.vy+=0.42; e.y+=e.vy;
        const ty=Math.floor(e.y/TW), tx=Math.floor(e.x/TW);
        if(solid(tx,ty)){
          e.alive=false; burst(e.x,e.y,'#ffcc66',16,3); shake=Math.max(shake,7);
          SFX.hit(); dropItem(e.x,e.y-10,Math.random()<0.5?'heart5':'heart'); score+=200;
        }
      }
    }
    else if(e.type==='skel'){
      e.vy=(e.vy||0)+0.3;
      if(Math.abs(p.x-e.x)<160)e.face=p.x<e.x?-1:1;
      let mv=0;
      if(e.t%180<110) mv=e.face*e.speed;
      e.bumpX=0; step2(e,mv,e.vy);
      if(e.bumpX)e.face*=-1;
      e.cd--;
      if(e.cd<=0&&Math.abs(p.x-e.x)<200){
        e.cd=110+Math.random()*70;
        shots.push({x:e.x+e.face*8,y:e.y-18,vx:e.face*1.9,vy:-3.1,g:0.14,w:9,h:9,t:'bone',dmg:2,life:200,rot:0,breakable:1});
        SFX.throw();
      }
    }
    else if(e.type==='hunch'){
    const sq=e.onGround?0:-2;
    px(x-6,y-13+sq,12,13,'#5a4a2e');                       // lưng gù
    px(x-6,y-13+sq,12,4,'#6f5c3a');
    px(x-2,y-19+sq,9,7,'#c8a06a');                         // đầu chúi
    px(x-1,y-18+sq,7,2,'#e0bb84');
    px(e.face>0?x+3:x-1,y-17+sq,2,2,'#2a1408');
    px(e.face>0?x+2:x-4,y-13+sq,5,7,'#c8a06a');            // tay dài
    px(x-5,y-3,4,3,'#3a2a16'); px(x+1,y-3,4,3,'#3a2a16');
    px(x-6,y-6+sq,3,4,'#6f5c3a');
  }
  else if(e.type==='chandelier'){
    if(!e.drop){ px(x-1,y-14,2,14,'#4a4a52'); }            // dây
    px(x-13,y-2,26,4,'#c8a24a'); px(x-13,y-2,26,2,'#eccd76');
    px(x-11,y+2,3,3,'#8a6a24'); px(x+8,y+2,3,3,'#8a6a24');
    px(x-2,y-6,5,5,'#c8a24a');
    for(let i=-1;i<2;i++){
      const cx=x+i*9;
      px(cx-2,y-7,4,5,'#e8dcc0');
      const f=Math.sin(frame*0.3+i)*1;
      px(cx-1,y-11+f,2,4,'#ff9c30'); px(cx-1,y-13+f,1,3,'#ffe07a');
    }
  }
  else if(e.type==='medusa'){
      e.x+=e.dir*1.15;
      e.base+=((p.y-32)-e.base)*0.018;
      if(e.base<40)e.base=40;
      e.y=e.base+Math.sin(e.t*0.095)*18;
      e.face=e.dir;
      if(e.x<cam.x-70||e.x>cam.x+VW+70){e.x=e.def.x;e.t=0;e.base=e.oy;}
    }
    // contact
    if(!p.dead&&p.inv<=0&&Math.abs(e.x-p.x)<(e.w/2+p.w/2)&&e.y-e.h<p.y&&e.y>p.y-p.h) hurtPlayer(e.dmg,e.x);
  }
}

/* ================= BOSS ================= */
function fireBoss(b){
  SFX.throw();
  if(b.castKind==='wall'){
    const d=p.x<b.x?-1:1;
    for(let i=0;i<3;i++)
      shots.push({x:b.x+d*i*34,y:233,vx:d*2.1,vy:0,w:14,h:14,t:'sickle',dmg:3,life:280,rot:0,breakable:1});
  } else {
    const n=bossHP<=13?3:2;
    for(let i=0;i<n;i++){
      const a=Math.atan2((p.y-18)-(b.y-16),p.x-b.x)+(i-(n-1)/2)*0.44;
      shots.push({x:b.x,y:b.y-16,vx:Math.cos(a)*2.3,vy:Math.sin(a)*2.3,w:14,h:14,
        t:'sickle',dmg:3,life:200,rot:0,home:0.016,homeT:32,breakable:1});
    }
  }
}
/* ---- BOSS MÀN 2: Bá Tước Huyết Nguyệt ----
   GĐ1 (HP > nửa): đứng trên sàn, dịch chuyển rồi bắn chùm 3 cầu lửa. Chém đứng được.
   GĐ2 (HP <= nửa): mọc cánh, bay lên rồi lao ngang ở tầm người chơi, rải dơi. */
function fireCount(b){
  SFX.throw();
  const n=b.phase===2?4:3;
  const base=Math.atan2((p.y-18)-(b.y-24),p.x-b.x);
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*0.30;
    shots.push({x:b.x,y:b.y-24,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,w:13,h:13,
      t:'flame',dmg:3,life:220,rot:0,breakable:1});
  }
}
function updateCount(){
  const b=boss; b.t++; if(b.flash>0)b.flash--;
  if(!b.alive){ b.y+=0.5; return; }
  const half=bossMax/2;
  if(b.phase===1&&b.hp<=half){                       // chuyển giai đoạn
    b.phase=2; b.warp=30; b.cast=0; b.dash=0; b.cd=70;
    flash=22; shake=12; SFX.boss();
    for(let i=0;i<26;i++)burst(b.x,b.y-20,'#c8324a',1,4);
  }

  if(b.warp>0){
    b.warp--;
    if(b.warp===14){
      b.x=cam.lock+70+Math.random()*370;
      b.y=b.ay=b.ty=(b.phase===2?150+Math.random()*40:240);
      for(let i=0;i<16;i++)burst(b.x,b.y-20,'#8a1f3a',1,3);
    }
  }
  else if(b.phase===1){
    b.ay=240;                                        // đứng trên sàn
    b.tp--;
    if(b.tp<=0){ b.tp=170+Math.random()*70; b.warp=28;
      for(let i=0;i<16;i++)burst(b.x,b.y-20,'#8a1f3a',1,3); }
    if(b.cast>0){ b.cast--; if(b.cast===0)fireCount(b); }
    else { b.cd--; if(b.cd<=0){ b.cd=104; b.cast=30; } }
    b.y+=(b.ay-b.y)*0.12;
  }
  else{
    if(b.dash>0){
      b.dash--;
      b.x+=b.dashDir*4.4;
      if(b.dash%3===0)burst(b.x-b.dashDir*10,b.y-20,'#8a1f3a',2,1.5);
      const lo=cam.lock+40, hi=cam.lock+VW-40;
      if(b.x<lo||b.x>hi){ b.x=Math.max(lo,Math.min(hi,b.x)); b.dash=0; b.cd=60; }
      if(b.dash===0&&Math.random()<0.7){              // rải dơi sau cú lao
        for(let i=0;i<2;i++){
          const bt=makeEnemy({type:'bat',x:b.x,y:b.y+8});
          bt.hang=0; bt.baseY=b.y-10; bt.def={x:b.x}; enemies.push(bt);
        }
      }
    } else {
      b.ay=Math.max(120,Math.min(210,p.y-40))+Math.sin(b.t*0.05)*8;
      b.x+=(p.x-b.x)*0.004+Math.sin(b.t*0.03)*0.5;
      if(b.cast>0){ b.cast--; if(b.cast===0)fireCount(b); }
      else{
        b.cd--;
        if(b.cd<=0){
          if(Math.random()<0.55){                     // lao ngang, có báo trước
            b.dashDir=p.x<b.x?-1:1; b.dash=44; b.cd=0;
            b.ay=Math.max(150,Math.min(226,p.y-26));
            shake=Math.max(shake,5);
          } else { b.cd=92; b.cast=28; }
        }
      }
      b.y+=(b.ay-b.y)*0.07;
    }
    b.tp--;
    if(b.tp<=0&&b.dash<=0){ b.tp=260+Math.random()*90; b.warp=28; }
  }
  if(!p.dead&&p.inv<=0&&Math.abs(b.x-p.x)<20&&b.y-36<p.y&&b.y>p.y-p.h) hurtPlayer(b.dmg,b.x);
  bossHP=Math.max(0,b.hp);
}
function updateBoss(){
  if(!boss){
    if(p.x>bossTrigger&&endT===0){
      closeGate(true);
      cam.lock=arenaX*TW; p.cp=CHECK.length-1;
      if(bossKind==='count'){
        boss={kind:'count',x:cam.lock+400,y:240,ay:240,ty:240,vx:0,vy:0,alive:true,hp:bossMax=34,
          w:30,h:40,t:0,pts:8000,dmg:4,tp:110,cast:0,cd:70,phase:1,dash:0,dashDir:1,
          warp:0,flash:0,type:'boss'};
      } else {
        boss={kind:'death',x:cam.lock+380,y:170,ay:170,ty:170,vx:0,vy:0,alive:true,hp:bossMax=28,
          w:34,h:34,t:0,pts:5000,dmg:3,tp:0,dive:0,diveHits:0,cast:0,cd:80,castKind:'fan',
          flash:0,type:'boss'};
      }
      bossHP=boss.hp; SFX.boss(); shake=14;
    }
    return;
  }
  if(boss.kind==='count'){ updateCount(); return; }
  const b=boss; b.t++; if(b.flash>0)b.flash--;
  if(!b.alive){ b.y+=0.6; return; }
  b.tp--;
  if(b.tp<=0){
    b.tp=210+Math.random()*90;
    b.tx=cam.lock+90+Math.random()*330; b.ty=152+Math.random()*44;
    b.warp=22;
    for(let i=0;i<14;i++)burst(b.x,b.y-16,'#6a5cf0',1,3);
  }
  if(b.warp>0){
    b.warp--;
    if(b.warp===11){b.x=b.tx;b.y=b.ay=b.ty; for(let i=0;i<14;i++)burst(b.x,b.y-16,'#6a5cf0',1,3);}
  }
  else{
    if(b.dive>0){
      b.dive--;
      const tx=p.x+(b.x<p.x?-52:52);
      b.x+=(tx-b.x)*0.035;
      b.ay=238;
      if(b.dive===56) for(let i=0;i<8;i++)burst(b.x,b.y-8,'#c05a8a',1,2);
    } else {
      b.x+=Math.sin(b.t*0.03)*0.7 + (p.x-b.x)*0.006;
      b.ay=b.ty+Math.sin(b.t*0.05)*10;
      if(b.t%210===0){ b.dive=80; b.diveHits=0; }
      if(b.cast>0){
        b.cast--;
        if(b.cast===0)fireBoss(b);
      } else {
        b.cd--;
        if(b.cd<=0){
          b.cd=bossHP<=13?96:126;
          b.cast=32;
          b.castKind=(bossHP<=13&&Math.random()<0.45)?'wall':'fan';
        }
      }
    }
    b.y+=(b.ay-b.y)*0.08;
  }
  if(!p.dead&&p.inv<=0&&Math.abs(b.x-p.x)<22&&b.y-30<p.y&&b.y>p.y-p.h) hurtPlayer(3,b.x);
  bossHP=Math.max(0,b.hp);
}

/* ================= SHOTS & ITEMS ================= */
function updateShots(){
  shots=shots.filter(s=>{
    s.life--; if(s.life<=0)return false;
    if(s.g)s.vy+=s.g;
    if(s.home&&s.homeT>0){
      s.homeT--;
      const a=Math.atan2((p.y-16)-s.y,p.x-s.x);s.vx+=Math.cos(a)*s.home*8;s.vy+=Math.sin(a)*s.home*8;
      const sp=Math.hypot(s.vx,s.vy); if(sp>2.9){s.vx*=2.9/sp;s.vy*=2.9/sp;}
    }
    s.x+=s.vx; s.y+=s.vy; s.rot=(s.rot||0)+0.3;
    if(s.t==='holy'){
      const ty=Math.floor(s.y/TW), tx=Math.floor(s.x/TW);
      if(solid(tx,ty)){ s.t='fire'; s.vx=0; s.vy=0; s.life=Math.min(s.life,110); s.y=ty*TW; s.w=16;s.h=14; }
    }
    if(s.x<cam.x-60||s.x>cam.x+VW+60||s.y>MH*TW+30||s.y<-40)return false;
    if(s.friendly||s.t==='fire'){
      for(const e of enemies) if(e.alive&&Math.abs(e.x-s.x)<(e.w/2+s.w/2)&&e.y-e.h<s.y+s.h/2&&e.y>s.y-s.h/2){
        damage(e,s.dmg); if(s.t!=='fire'&&s.t!=='axe')return false;
      }
      if(boss&&boss.alive&&Math.abs(boss.x-s.x)<20&&boss.y-32<s.y&&boss.y>s.y-8){damage(boss,s.dmg); if(s.t!=='fire'&&s.t!=='axe')return false;}
    } else {
      if(!p.dead&&p.inv<=0&&Math.abs(p.x-s.x)<(p.w/2+s.w/2-2)&&p.y-p.h<s.y+s.h/2&&p.y>s.y-s.h/2){hurtPlayer(s.dmg,s.x);return false;}
    }
    return true;
  });
  items=items.filter(it=>{
    it.life--; if(it.life<=0)return false;
    it.vy+=0.28; it.y+=it.vy;
    const ty=Math.floor(it.y/TW), tx=Math.floor(it.x/TW);
    if(solid(tx,ty)&&it.vy>0){it.y=ty*TW;it.vy=0;}
    if(Math.abs(p.x-it.x)<14&&p.y-p.h-4<it.y&&p.y+4>it.y-12&&!p.dead){
      SFX.item();
      if(it.t==='heart'){p.hearts=Math.min(99,p.hearts+1);popText(it.x,it.y,'+1');}
      if(it.t==='heart5'){p.hearts=Math.min(99,p.hearts+5);popText(it.x,it.y,'+5');}
      if(it.t==='meat'){p.hp=Math.min(p.maxhp,p.hp+8);popText(it.x,it.y,'HP');}
      if(it.t==='whip'){p.whip=Math.min(2,p.whip+1);popText(it.x,it.y,SWORDNAME[p.whip]);flash=12;}
      if(it.t==='katana'){p.whip=3;popText(it.x,it.y,'KATANA');flash=18;SFX.iai();}
      if(it.t==='blood'){p.whip=BLOOD;p.drainT=0;popText(it.x,it.y,'HUYẾT KIẾM');flash=22;SFX.drain();}
      if(it.t==='dagger'||it.t==='axe'||it.t==='holy'){p.sub=it.t;popText(it.x,it.y,it.t==='dagger'?'DAO':it.t==='axe'?'RÌU':'NƯỚC');}
      score+=300;
      return false;
    }
    return true;
  });
  parts=parts.filter(q=>{q.life--; q.x+=q.vx; q.y+=q.vy; q.vy+=q.txt?0:0.12; return q.life>0;});
}

/* ================= DRAW ================= */
let G=ctx;                                     // đích vẽ hiện tại (ctx hoặc buffer)
function px(x,y,w,h,c){G.fillStyle=c;G.fillRect(Math.round(x),Math.round(y),w,h);}
function drawBG(){
  const S2=stage===2;
  const g=ctx.createLinearGradient(0,0,0,VH);
  if(S2){ g.addColorStop(0,'#08120e'); g.addColorStop(0.55,'#0f1e18'); g.addColorStop(1,'#16281f'); }
  else  { g.addColorStop(0,'#100a1e'); g.addColorStop(0.55,'#1a1030'); g.addColorStop(1,'#241638'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // moon
  const mx=380-cam.x*0.08, my=52;
  ctx.fillStyle='#e6dcc0'; ctx.beginPath(); ctx.arc(mx,my,26,0,6.3); ctx.fill();
  ctx.fillStyle='#cfc2a2'; ctx.beginPath(); ctx.arc(mx-8,my-6,4,0,6.3); ctx.arc(mx+7,my+5,6,0,6.3); ctx.arc(mx+2,my-12,3,0,6.3); ctx.fill();
  ctx.fillStyle='rgba(180,60,90,0.10)'; ctx.beginPath(); ctx.arc(mx,my,44,0,6.3); ctx.fill();
  // stars
  for(let i=0;i<40;i++){const sx=(i*97%VW+ -cam.x*0.05)%VW; if(sx<0)continue; const sy=(i*53)%120;
    px(sx,sy,1,1,i%3?'#5d5478':'#8e83aa');}
  // distant towers
  const off=-cam.x*0.25;
  ctx.fillStyle=S2?'#0b1712':'#150e26';
  for(let i=0;i<16;i++){
    const bx=((i*160+off)%(VW+320))-160, bw=70+ (i%3)*24, bh=90+(i%4)*36;
    ctx.fillRect(bx,VH-bh,bw,bh);

// render into the offscreen buffer, then stamp a 1px dark outline around it
/* Buffer dùng để dập viền tối. Địch dùng buffer nhỏ cho nhẹ,
   boss dùng buffer lớn vì cánh + áo choàng rộng. */
function mkBuf(w,h,ox,oy){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const m=document.createElement('canvas'); m.width=w; m.height=h;
  return {c,g:c.getContext('2d'),m,mg:m.getContext('2d'),w,h,ox,oy};
}
const BUF_E=mkBuf(80,80,40,60);                // địch thường
const BUF_B=mkBuf(160,112,80,92);              // boss

/* Vẽ fn() vào buffer (giữ nguyên toạ độ màn hình), rồi dập silhouette
   tối 4 hướng lệch 1px trước khi dập sprite thật lên trên. */
function stampOutlined(buf,sx,sy,alpha,fn){
  const X=Math.round(sx), Y=Math.round(sy);
  buf.g.setTransform(1,0,0,1,0,0);
  buf.g.clearRect(0,0,buf.w,buf.h);
  buf.g.setTransform(1,0,0,1,buf.ox-X,buf.oy-Y);
  const prev=G; G=buf.g;
  try{ fn(buf.g); } finally { G=prev; buf.g.setTransform(1,0,0,1,0,0); }
  buf.mg.setTransform(1,0,0,1,0,0);
  buf.mg.clearRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  buf.mg.drawImage(buf.c,0,0);
  buf.mg.globalCompositeOperation='source-in';
  buf.mg.fillStyle=PAL.OUT; buf.mg.fillRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  const dx=X-buf.ox, dy=Y-buf.oy, oa=ctx.globalAlpha;
  if(alpha!==undefined&&alpha!==null) ctx.globalAlpha=alpha;
  ctx.drawImage(buf.m,dx-1,dy); ctx.drawImage(buf.m,dx+1,dy);
  ctx.drawImage(buf.m,dx,dy-1); ctx.drawImage(buf.m,dx,dy+1);
  ctx.drawImage(buf.c,dx,dy);
  ctx.globalAlpha=oa;
}
function stampHero(who,sx,sy,d,A){
  sg.clearRect(0,0,SPW,SPH);
  drawPlayerBody(sg,SPX,SPY,d,who,A);
  ilg.clearRect(0,0,SPW,SPH);
  ilg.globalCompositeOperation='source-over';
  ilg.drawImage(spr,0,0);
  ilg.globalCompositeOperation='source-in';
  ilg.fillStyle=PAL.OUT; ilg.fillRect(0,0,SPW,SPH);
  ilg.globalCompositeOperation='source-over';
  const dx=sx-SPX, dy=sy-SPY;
  ctx.drawImage(sil,dx-1,dy); ctx.drawImage(sil,dx+1,dy);
  ctx.drawImage(sil,dx,dy-1); ctx.drawImage(sil,dx,dy+1);
  ctx.drawImage(spr,dx,dy);
}

function drawHUD(){
  const HH=46;
  ctx.fillStyle='rgba(8,5,16,0.88)'; ctx.fillRect(0,0,VW,HH);

  const F=z=>{ctx.font='bold '+z+'px ui-monospace,monospace';};
  const R1=8, R2=27;
  F(12);

  // ---- left: score + timer ----
  ctx.fillStyle='#8d7aa8'; ctx.fillText('ĐIỂM',8,R1);
  ctx.fillStyle='#e8e0f4'; ctx.fillText(String(score).padStart(6,'0'),52,R1);

  ctx.fillStyle=stageTimer<60?(Math.floor(frame/12)%2?'#ff8080':'#e05a5a'):'#e8e0f4';
  ctx.fillText(String(Math.max(0,Math.ceil(stageTimer))).padStart(3,'0'),52,R2);
  ctx.fillStyle='#a890c8'; ctx.fillText('M'+stage,90,R2);

  // ---- middle: labelled bars ----
  const BX=206, BW=146, BH=12;
  const bar=(by,val,max,c)=>{
    ctx.fillStyle='#221a30'; ctx.fillRect(BX,by,BW,BH);
    const w=Math.max(0,Math.round(BW*val/max));
    ctx.fillStyle=c; ctx.fillRect(BX,by,w,BH);

  };

  ctx.fillStyle='#a890c8'; ctx.fillText(bossName,146,R2);
  bar(R1-1,p.hp,p.maxhp,'#e04a5a');

  const EDGE=VW-8;

  const lt='MẠNG ×'+Math.max(0,lives);
  ctx.fillStyle='#8d7aa8'; ctx.fillText(lt,EDGE,R1);
  const lw=ctx.measureText(lt).width;

  const hx=hEnd-ctx.measureText(ht).width-15;

  ctx.fillRect(hx,R1+1,4,3); ctx.fillRect(hx+6,R1+1,4,3);
  ctx.fillRect(hx,R1+3,10,4); ctx.fillRect(hx+2,R1+7,6,2); ctx.fillRect(hx+4,R1+9,2,2);

  const wn=SWORDNAME[p.whip];
  ctx.fillStyle=p.whip===BLOOD?(Math.floor(frame/16)%2?'#ff6a80':'#e0304c'):(p.whip===3?'#d8c8f0':'#c8b8dc');
  ctx.fillText(wn,EDGE,R2);
  if(p.whip===BLOOD){                       // vạch đếm tới lần rút máu kế tiếp
    const w=Math.round(28*(1-(p.drainT||0)/DRAIN));
    ctx.fillStyle='#3a1018'; ctx.fillRect(EDGE-28,R2+14,28,2);
    ctx.fillStyle='#c8203c'; ctx.fillRect(EDGE-28,R2+14,w,2);
  }
  if(p.sub){
    const ix=EDGE-ctx.measureText(wn).width-22, iy=R2+7;
    if(p.sub==='dagger'){px(ix-6,iy-1,12,3,'#d8d2e4');px(ix-7,iy-3,3,7,'#8a6a3a');}
    if(p.sub==='axe'){px(ix-1,iy-6,3,12,'#8a5a2a');px(ix-6,iy-7,6,5,'#c8cede');px(ix+2,iy-7,5,5,'#c8cede');}
    if(p.sub==='holy'){px(ix-4,iy-6,8,11,'#7ec8e8');px(ix-2,iy-8,4,3,'#c8e8f8');}
  }
  ctx.textAlign='left';
}
function drawScoreBoard(){
  const x=VW/2, top=VH/2+46;
  ctx.textAlign='center';
  ctx.font='bold 10px ui-monospace,monospace';
  ctx.fillStyle=lastRank===0?'#ffe08a':'#8d7aa8';
  ctx.fillText(lastRank===0?'★ KỶ LỤC MỚI ★':(lastRank>0?'Hạng '+(lastRank+1):'BẢNG ĐIỂM CAO'),x,top-16);
  ctx.font='bold 9px ui-monospace,monospace';
  for(let i=0;i<hiScores.length;i++){
    const r=hiScores[i], me=i===lastRank;
    if(me){ ctx.fillStyle='rgba(120,70,160,0.35)'; ctx.fillRect(x-108,top+i*13-2,216,12); }
    ctx.fillStyle=me?'#f4ead0':'#9b88b8';
    ctx.textAlign='left';   ctx.fillText((i+1)+'.',x-104,top+i*13);
    ctx.fillText(r.h,x-88,top+i*13);
    ctx.fillText('M'+r.st,x-30,top+i*13);
    ctx.textAlign='right';  ctx.fillText(String(r.s).padStart(6,'0'),x+104,top+i*13);
  }
  if(hiErr){ ctx.textAlign='center'; ctx.fillStyle='#7d6d99';
    ctx.fillText('('+hiErr+' - điểm chỉ giữ trong phiên này)',x,top+hiScores.length*13+6); }
  ctx.textAlign='left';
}
function drawOverlay(txt,sub,sub2){
  ctx.fillStyle='rgba(6,4,12,0.78)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign='center';
  ctx.font='bold 26px ui-monospace,monospace';
  ctx.fillStyle='#1a0e20'; ctx.fillText(txt,VW/2+2,VH/2-54+2);
  ctx.fillStyle='#e8d8a0'; ctx.fillText(txt,VW/2,VH/2-54);
  if(sub){ctx.font='bold 11px ui-monospace,monospace'; ctx.fillStyle='#b8a8d0'; ctx.fillText(sub,VW/2,VH/2-32);}
  if(sub2){ctx.font='bold 10px ui-monospace,monospace'; ctx.fillStyle='#7d6d99'; ctx.fillText(sub2,VW/2,VH/2-12);}
  ctx.textAlign='left';
}
function draw(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.86;if(shake<0.4)shake=0;}
  drawBG();
  ctx.drawImage(lc,Math.round(cam.x),0,VW,VH,0,0,VW,VH);
  drawStairHints();
  for(const m of movers){
    const x=Math.round(m.x-cam.x), y=Math.round(m.y);
    if(x>VW+30||x+m.w<-30) continue;
    px(x,y,m.w,3,'#8a6238'); px(x,y+3,m.w,4,'#5a3a1c'); px(x,y+6,m.w,2,'#2e1c0c');
    for(let i=4;i<m.w;i+=12) px(x+i,y+1,2,5,'#3f2a14');
    px(x+m.w/2-1,y-6,2,6,'#4a4a52');                  // dây treo
    px(x-1,y,2,7,'#c8a24a'); px(x+m.w-1,y,2,7,'#c8a24a');
  }
  drawCandles();
  items.forEach(drawItem);
  enemies.forEach(drawEnemy);
  if(boss)drawBoss();
  shots.forEach(drawShot);
  if(state==='play'||state==='dead'||state==='clear'||state==='menu')drawPlayer();
  for(const q of parts){
    const x=Math.round(q.x-cam.x),y=Math.round(q.y);
    if(q.txt){ctx.font='bold 10px ui-monospace,monospace';ctx.fillStyle=q.c;ctx.textAlign='center';ctx.fillText(q.txt,x,y);ctx.textAlign='left';}
    else px(x,y,2,2,q.c);
  }
  if(flash>0){ctx.fillStyle='rgba(255,240,200,'+(flash/40)+')';ctx.fillRect(0,0,VW,VH);flash--;}
  ctx.restore();
  // vignette
  const vg=ctx.createRadialGradient(VW/2,VH/2,120,VW/2,VH/2,340);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  if(endT>0&&state==='play'){
    ctx.fillStyle='rgba(6,4,12,'+Math.min(0.8,endT/120)+')'; ctx.fillRect(0,0,VW,VH);
    if(endT>40){
      ctx.textAlign='center';
      ctx.font='bold 20px ui-monospace,monospace';
      ctx.fillStyle='#e8d8a0';
      ctx.fillText(stage===1?'MÀN 1 HOÀN THÀNH':'PHÁ ĐẢO!',VW/2,116);
      ctx.font='bold 11px ui-monospace,monospace'; ctx.fillStyle='#b8a8d0';
      ctx.fillText(bossName+' đã bị hạ  ·  +'+(stage===1?'10.000':'20.000')+' điểm',VW/2,146);
      if(stage===1){ctx.fillStyle='#8d7aa8';ctx.fillText('MÀN 2 · HẦM MỘ',VW/2,170);}
      ctx.textAlign='left';
    }
  }
  if(intro>0&&state==='play'){
    ctx.fillStyle='rgba(4,2,10,'+(intro/42)+')'; ctx.fillRect(0,0,VW,VH); intro--;
  }
  if(state!=='title')drawHUD();

  if(state==='title'){
    ctx.textAlign='center';
    if(!isLand){
      ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#6d5f85';
      ctx.fillText('↻ Xoay ngang · ⛶ Toàn màn hình (F) để khung lớn nhất',VW/2,6);
    }
    ctx.font='bold 27px ui-monospace,monospace';
    ctx.fillStyle='#3a0f1a'; ctx.fillText('LÂU ĐÀI',VW/2+3,43); ctx.fillText('NGUYỆT HUYẾT',VW/2+3,71);
    ctx.fillStyle='#d8c078'; ctx.fillText('LÂU ĐÀI',VW/2,40);   ctx.fillText('NGUYỆT HUYẾT',VW/2,68);
    ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#9b88b8';
    ctx.fillText('Kiếm · Nến · Cầu thang · Huyết Kiếm · Bá Tước',VW/2,100);

    // ---- chọn nhân vật ----
    for(let i=0;i<2;i++){
      const sel=hero===i, cx=HSLOT[i];
      ctx.fillStyle=sel?'rgba(120,70,160,0.30)':'rgba(30,22,48,0.55)';
      ctx.fillRect(cx-46,HBOXT,92,HBOXH);
      ctx.strokeStyle=sel?(Math.floor(frame/8)%2?'#e8d8a0':'#b09050'):'#3a3050';
      ctx.lineWidth=1; ctx.strokeRect(cx-45.5,HBOXT+0.5,91,HBOXH-1);
      stampHero(i,cx,HFEET,i===0?1:-1,{crouch:0,moving:0,air:0,atk:0,whip:0,f:0,t:0,thr:0,thrT:0});
      ctx.font='bold 11px ui-monospace,monospace';
      ctx.fillStyle=sel?'#f0e4c0':'#7d6d99';
      ctx.fillText(HEROES[i].name,cx,198);
      ctx.font='bold 8px ui-monospace,monospace';
      ctx.fillStyle=sel?'#b8a8d0':'#5d5078';
      ctx.fillText(HEROES[i].tag,cx,212);
    }
    ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#c8b070';
    ctx.fillText('HP '+HEROES[hero].hp+'  ·  '+(hero?'chạy nhanh, nhảy cao, vung kiếm lẹ':'máu dày, ổn định'),VW/2,232);

    if(hiScores.length){
      const b=hiScores[0];
      ctx.font='bold 10px ui-monospace,monospace'; ctx.fillStyle='#8a7a4a';
      ctx.fillText('KỶ LỤC '+String(b.s).padStart(6,'0')+'  '+b.h+' · MÀN '+b.st,VW/2,245);
    }
    ctx.font='bold 10px ui-monospace,monospace'; ctx.fillStyle='#8d7aa8';
    ctx.fillText('◀ ▶ hoặc chạm vào nhân vật để chọn',VW/2,258);
    ctx.fillStyle=Math.floor(frame/24)%2?'#e8e0f4':'#6d5f85';
    ctx.font='bold 12px ui-monospace,monospace';
    ctx.fillText('NHẤN NHẢY ĐỂ VÀO',VW/2,271);
    ctx.textAlign='left';
  }
  if((state==='over'||state==='clear')&&hiScores.length) drawScoreBoard();
  if(state==='over')drawOverlay('HẾT MẠNG','Điểm: '+score,'NHẢY chơi lại  ·  ▲ đổi nhân vật');
  if(state==='clear')drawOverlay('PHÁ ĐẢO LÂU ĐÀI','Điểm: '+score,'NHẢY chơi lại  ·  ▲ đổi nhân vật');
}

/* ================= LOOP ================= */
function update(){
  frame++;
  if(state==='title'){
    if(K.leftP&&hero!==0){hero=0;SFX.candle();}
    if(K.rightP&&hero!==1){hero=1;SFX.candle();}
    if(tap){                                  // tapping a portrait picks, it does not start
      for(let i=0;i<2;i++){
        if(Math.abs(tap.x-HSLOT[i])<52&&tap.y>HBOXT-8&&tap.y<HBOXT+HBOXH+8){
          if(hero!==i){hero=i;SFX.candle();}
          K.anyP=0; break;
        }
      }
    }
    if(K.jumpP||K.atkP||K.anyP){state='play';p.cp=0;buildStage(1);resetStage(true);}
    return;
  }
  if(state==='menu'){
    if(K.upP){menuSel=(menuSel+MENU.length-1)%MENU.length;SFX.candle();}
    if(K.downP){menuSel=(menuSel+1)%MENU.length;SFX.candle();}
    if(K.jumpP||K.atkP){
      SFX.item();
      if(menuSel===0) state='play';
      else if(menuSel===1){state='play';p.cp=0;buildStage(stage);resetStage(true);}
      else if(menuSel===2){state='title';buildStage(1);p.cp=0;resetStage(true);}
      else fullReset();
    }
    return;
  }
  if(state==='dead'){ if(K.jumpP||K.anyP){ if(lives>0){state='play';resetStage(false);} else endRun('over'); } return; }
  if(state==='over'||state==='clear'){
    if(K.upP){state='title';buildStage(1);p.cp=0;resetStage(true);return;}
    if(K.jumpP||K.anyP){state='play';p.cp=0;buildStage(stage);resetStage(true);}
    return;
  }

  tick++;
  if(tick%40===0&&stageTimer>0&&!p.dead&&endT===0){stageTimer--; if(stageTimer<=0)killPlayer(false);}

  updateMovers();
  updatePlayer();
  updateEnemies();
  updateBoss();
  updateShots();

  // checkpoints
  if(!p.dead){
    if(p.x>80*TW&&p.cp<1)p.cp=1;
    if(p.x>130*TW&&p.y<200&&p.cp<2)p.cp=2;
  }
  if(p.dead){ p.deadT++; if(p.deadT>70){ lives--; if(lives<0) endRun('over'); else state='dead'; } }

  if(endT>0){
    endT++;
    if(endT===2) score+=stage===1?10000:20000;
    if(endT>150){
      if(stage===1){ nextStage(); } else endRun('clear');
    }
  }

  // camera
  let target=p.x-VW/2;
  if(cam.lock>=0) cam.x=cam.lock;
  else cam.x+=((Math.max(0,Math.min(LW-VW,target)))-cam.x)*0.14;
  if(cam.x<0)cam.x=0; if(cam.x>LW-VW)cam.x=LW-VW;
  if(cam.lock>=0&&p.x<cam.lock+14)p.x=cam.lock+14;
}
let last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  acc+=Math.min(100,t-last); last=t;
  while(acc>=16.667){ update(); clearEdges(); acc-=16.667; }
  draw();
}
const LANDQ='(orientation:landscape) and (max-height:620px) and (pointer:coarse),'
             +'(orientation:landscape) and (max-height:620px) and (max-width:960px)';
let isLand=false;
function fit(){
  const wrap=document.getElementById('wrap');
  isLand=window.matchMedia?window.matchMedia(LANDQ).matches:false;
  let availW,availH;
  if(isLand){
    // controls float over the canvas, so the canvas gets the full viewport
    availW=Math.max(160,wrap.clientWidth-8);
    availH=Math.max(100,wrap.clientHeight-8);
  } else {
    const padH=document.getElementById('pad').offsetHeight+document.getElementById('bar').offsetHeight+34;
    availW=Math.max(160,wrap.clientWidth-10);
    availH=Math.max(100,wrap.clientHeight-padH);
  }
  let s=Math.min(availW/VW,availH/VH);   // may be <1 on a portrait phone
  if(s>=2)s=Math.floor(s);               // crisp integer steps when there is room
  s=Math.max(0.4,s);
  cv.style.width=Math.round(VW*s)+'px';
  cv.style.height=Math.round(VH*s)+'px';
  // nearest-neighbour only helps when enlarging; shrinking with it eats thin glyph strokes
  cv.style.imageRendering=(s<1?'auto':'pixelated');
}

/* ================= TOÀN MÀN HÌNH ================= */
const noteEl=document.getElementById('note');
let noteT=0;
function note(msg,ms){
  noteEl.textContent=msg; noteEl.style.display='block';
  clearTimeout(noteT); noteT=setTimeout(()=>{noteEl.style.display='none'},ms||4200);
}
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function fsAllowed(){
  return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
}
async function enterFS(){
  const el=document.documentElement, w=document.getElementById('wrap');
  const req=t=>(t.requestFullscreen||t.webkitRequestFullscreen||t.webkitRequestFullScreen||t.msRequestFullscreen);
  for(const t of [el,w]){
    const fn=req(t);
    if(!fn) continue;
    try{ await fn.call(t,{navigationUI:'hide'}); }
    catch(e){ try{ await fn.call(t); }catch(e2){ continue; } }
    if(fsEl()){
      try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
      return true;
    }
  }
  return false;
}
function exitFS(){
  const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  if(fn) try{ fn.call(document); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
async function toggleFS(){
  if(fsEl()){ exitFS(); return; }
  if(!fsAllowed()){
    note('Khung nhúng của app không cho phép toàn màn hình. Dùng nút mở rộng ⤢ của khung artifact, hoặc mở game trong tab riêng.',7000);
    return;
  }
  const ok=await enterFS();
  if(!ok) note('Trình duyệt từ chối toàn màn hình. Thử nút mở rộng ⤢ của khung artifact.',6000);
}
function syncFSBtn(){
  const b=document.getElementById('fs');
  b.textContent=fsEl()?'⛶ Thoát toàn màn':'⛶ Toàn màn hình';
}
document.getElementById('fs').onclick=()=>{toggleFS();audioUnlock();};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{syncFSBtn();fit();setTimeout(fit,140);setTimeout(fit,450);}));
addEventListener('keydown',e=>{ if(e.code==='KeyF'){e.preventDefault();toggleFS();} },{passive:false});
syncFSBtn();

addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
setTimeout(fit,50); setTimeout(fit,400); fit();
requestAnimationFrame(loop);
})();
</script>
