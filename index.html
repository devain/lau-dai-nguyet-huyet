/* Dây verlet trong hệ toạ độ theo hướng mặt (ox>0 = phía trước).
   Mỗi đốt trễ hơn đốt trước, nên chạy thì tóc bạt về sau, dừng thì còn đưa thêm. */
function makeChain(n,ax,ay,seg){
  const c=[]; for(let i=0;i<n;i++) c.push({x:ax-i*seg,y:ay+i*seg*0.5,px:ax-i*seg,py:ay+i*seg*0.5});
  return c;
}
function stepChain(c,ax,ay,seg,grav,windK,damp){
  c[0].x=ax; c[0].y=ay; c[0].px=ax; c[0].py=ay;
  const vf=p.vx*p.face;
  const wind=-vf*windK, lift=-p.vy*0.055;
  for(let i=1;i<c.length;i++){
    const n=c[i];
    const nx=n.x+(n.x-n.px)*damp+wind*(0.5+i*0.22);
    const ny=n.y+(n.y-n.py)*damp+grav+lift*(0.5+i*0.2);
    n.px=n.x; n.py=n.y; n.x=nx; n.y=ny;
    const q=c[i-1], dx=n.x-q.x, dy=n.y-q.y;
    const d=Math.hypot(dx,dy)||1;
    n.x=q.x+dx/d*seg; n.y=q.y+dy/d*seg;
  }
}
function updateFlow(){
  if(hero!==1){ p.tail=null; return; }
  if(!p.tail){
    p.tail =makeChain(5,-4,-26,3.6);
    p.scarf=makeChain(4,-3,-20,3.2);
  }
  const T=(p.crouch&&!p.stair)?9:0;
  stepChain(p.tail ,-4,-26+T,3.6,0.62,0.13,0.78);
  stepChain(p.scarf,-3,-20+T,3.2,0.34,0.22,0.85);
}
// Gió chỉ có ở màn 4: thổi từng cơn, có quãng lặng để người chơi kịp đọc
function windNow(){
  if(stage!==4) return 0;
  const w=Math.sin(frame*0.0062);
  if(Math.abs(w)<0.42) return 0;
  return Math.sign(w)*(Math.abs(w)-0.42)/0.58*0.30;
}
function swingDur(){
  const extra=(W[p.whip].st==='combo'&&combo===3)?5:0;     // đòn kết dài hơn
  return Math.max(8, SWORDDUR[p.whip]+extra-HEROES[hero].fast);
}
function throwDur(){ return Math.max(14, 20-HEROES[hero].fast); }

const SPW=152, SPH=104, SPX=76, SPY=82;

/* Buffer dùng để dập viền tối. Địch dùng buffer nhỏ cho nhẹ,
   boss dùng buffer lớn vì cánh + áo choàng rộng. */
function mkBuf(w,h,ox,oy){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const m=document.createElement('canvas'); m.width=w; m.height=h;
  return {c,g:c.getContext('2d'),m,mg:m.getContext('2d'),w,h,ox,oy};
}
const BUF_E=mkBuf(80,80,40,60);                // địch thường
const BUF_B=mkBuf(160,112,80,92);              // boss

/* Vẽ fn() vào buffer (giữ nguyên toạ độ màn hình), rồi dập silhouette
   tối 4 hướng lệch 1px trước khi dập sprite thật lên trên. */
function stampOutlined(buf,sx,sy,alpha,fn){
  const X=Math.round(sx), Y=Math.round(sy);
  buf.g.setTransform(1,0,0,1,0,0);
  buf.g.clearRect(0,0,buf.w,buf.h);
  buf.g.setTransform(1,0,0,1,buf.ox-X,buf.oy-Y);
  const prev=G; G=buf.g;
  try{ fn(buf.g); } finally { G=prev; buf.g.setTransform(1,0,0,1,0,0); }
  buf.mg.setTransform(1,0,0,1,0,0);
  buf.mg.clearRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  buf.mg.drawImage(buf.c,0,0);
  buf.mg.globalCompositeOperation='source-in';
  buf.mg.fillStyle=PAL.OUT; buf.mg.fillRect(0,0,buf.w,buf.h);
  buf.mg.globalCompositeOperation='source-over';
  const dx=X-buf.ox, dy=Y-buf.oy, oa=ctx.globalAlpha;
  if(alpha!==undefined&&alpha!==null) ctx.globalAlpha=alpha;
  ctx.drawImage(buf.m,dx-1,dy); ctx.drawImage(buf.m,dx+1,dy);
  ctx.drawImage(buf.m,dx,dy-1); ctx.drawImage(buf.m,dx,dy+1);
  ctx.drawImage(buf.c,dx,dy);
  ctx.globalAlpha=oa;
}
function stampHero(who,sx,sy,d,A){
  sg.clearRect(0,0,SPW,SPH);
  drawPlayerBody(sg,SPX,SPY,d,who,A);
  ilg.clearRect(0,0,SPW,SPH);
  ilg.globalCompositeOperation='source-over';
  ilg.drawImage(spr,0,0);
  ilg.globalCompositeOperation='source-in';
  ilg.fillStyle=PAL.OUT; ilg.fillRect(0,0,SPW,SPH);
  ilg.globalCompositeOperation='source-over';
  const dx=sx-SPX, dy=sy-SPY;
  ctx.drawImage(sil,dx-1,dy); ctx.drawImage(sil,dx+1,dy);
  ctx.drawImage(sil,dx,dy-1); ctx.drawImage(sil,dx,dy+1);
  ctx.drawImage(spr,dx,dy);
}

function drawBolts(){
  for(const b of bolts){
    const x1=b.x-cam.x, y1=b.y, x0=(b.fx!==undefined?b.fx-cam.x:x1+(Math.random()*20-10)), y0=(b.fy!==undefined?b.fy:0);
    ctx.globalAlpha=b.life/9;
    for(const [wd,col] of [[5,'rgba(106,216,255,0.5)'],[2,'#e8faff']]){
      ctx.strokeStyle=col; ctx.lineWidth=wd; ctx.beginPath(); ctx.moveTo(x0,y0);
      const n=7; for(let i=1;i<=n;i++){ const u=i/n;
        ctx.lineTo(x0+(x1-x0)*u+(i<n?(Math.random()*14-7):0), y0+(y1-y0)*u); }
      ctx.stroke(); }
    ctx.globalAlpha=1;
  }
}
function drawGhosts(){
  for(const g of p.ghost){
    g.a-=0.09; if(g.a<=0) continue;
    ctx.globalAlpha=g.a*0.55;
    ctx.fillStyle='#e8a060';
    const gx=Math.round(g.x-cam.x), gy=Math.round(g.y);
    ctx.fillRect(gx-6,gy-26,12,26);
    ctx.fillRect(gx-(g.f>0?14:-2),gy-18,12,3);          // vệt tốc độ
    ctx.globalAlpha=1;
  }
  p.ghost=p.ghost.filter(g=>g.a>0);
}
function drawPlayer(){
  drawBolts();
  drawGhosts();
  if(p.inv>0&&p.blink&&Math.floor(frame/3)%2)return;
  const x=Math.round(p.x-cam.x), y=Math.round(p.y), C=PAL;

  if(p.dead){
    const P=(ox,oy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x+ox),Math.round(y+oy),w,h);};
    if(hero===0){
      P(-14,-9,27,9,C.CP); P(-12,-9,22,3,C.CPh);
      P(-4,-17,9,9,C.SK); P(-5,-19,11,3,C.HR); P(-5,-15,11,2,C.BD);
      P(2,-15,2,2,C.EYE); P(6,-12,11,3,C.AR);
    } else {
      P(-14,-9,27,9,C.SKT); P(-12,-9,22,3,C.SKTh);
      P(-4,-17,9,9,C.fSK); P(-6,-20,12,4,C.fHR); P(-13,-18,8,3,C.fHRs);
      P(2,-15,2,2,C.EYE); P(-5,-13,10,2,C.SC); P(6,-12,11,3,C.AR);
    }
    return;
  }

  if(p.onGround||p.stair){
    ctx.fillStyle='rgba(0,0,0,0.30)';
    ctx.beginPath(); ctx.ellipse(x,y+1,9,2.5,0,0,6.3); ctx.fill();
  }

  const dur=swingDur();
  if(p.dash>0){ ctx.fillStyle='rgba(255,170,80,0.18)'; ctx.beginPath(); ctx.arc(x+p.face*8,y-14,20,0,6.3); ctx.fill(); }
  stampHero(hero,x,y,p.face,{
    crouch:p.crouch&&!p.stair,
    moving:(Math.abs(p.vx)>0.1&&p.onGround)||(p.stair&&(K.up||K.down)),
    air:!p.onGround&&!p.stair,
    atk:p.atk>0&&p.thr<=0, whip:p.whip, f:Math.floor(p.anim)%4,
    thr:p.thr, thrT:p.thr>0?1-p.thr/Math.max(1,p.thrDur):0, tail:p.tail, scarf:p.scarf,
    vf:p.vx*p.face,
    t:Math.min(1,Math.max(0,(dur-p.atk)/Math.max(1,dur-5)))
  });
}
function drawShade(e){
  const x=Math.round(e.x-cam.x), y=Math.round(e.y);
  sg.setTransform(1,0,0,1,0,0); sg.clearRect(0,0,SPW,SPH);
  drawPlayerBody(sg,SPX,SPY,e.face,hero,{crouch:0,moving:e.atk<=0,air:!e.onGround,

  ilg.globalCompositeOperation='source-over'; ilg.drawImage(spr,0,0);
  ilg.globalCompositeOperation='source-in';
  ilg.fillStyle='#160a22'; ilg.fillRect(0,0,SPW,SPH);

function drawEnemy(e){
  if(e.type==='chandelier'&&!e.drop){                 // xích từ trần xuống, rơi thì đứt
    const x=Math.round(e.x-cam.x), y=Math.round(e.y);
    for(let cy=TW;cy<y-6;cy+=4){ px(x-1,cy,3,3,'#55555e'); px(x,cy+3,1,1,'#2a2a30'); }
  }
  if(e.type==='shade'){ drawShade(e); return; }
  const sx=Math.round(e.x-cam.x), sy=Math.round(e.y);
  // hào quang / vệt sáng vẽ thẳng lên canvas: không nên bị viền

    ctx.fillStyle='rgba(255,180,60,0.14)';
    ctx.beginPath(); ctx.arc(sx,sy,22,0,6.3); ctx.fill();
  }
  const al=(e.flash>0&&Math.floor(frame/2)%2)?0.55:1;
  stampOutlined(BUF_E,sx,sy,al,()=>drawEnemyBody(e,sx,sy));

function drawEnemyBody(e,x,y){
  if(e.type==='zombie'){
    const b=Math.sin(e.t*0.12)*1;
    px(x-6,y-22,12,14,'#3f5a33'); px(x-4,y-8,4,8,'#2e4426'); px(x+1,y-8,4,8,'#2e4426');
    px(x-5,y-30,10,9,'#7d9a63'); px(x-6,y-31,12,3,'#3a2a1c');
    px(e.face>0?x+1:x-3,y-27,2,2,'#c02020');
    px(e.face>0?x+5:x-9,y-22+b,4,10,'#7d9a63');
    px(x-6,y-2,5,2,'#2a2018'); px(x+1,y-2,5,2,'#2a2018');
  }
  else if(e.type==='bat'){
    const f=Math.sin(e.t*(e.hang?0.06:0.4))*4;
    px(x-4,y-8,8,7,'#4a3560'); px(x-2,y-10,4,3,'#4a3560');
    px(x-3,y-7,2,2,'#e04a4a'); px(x+1,y-7,2,2,'#e04a4a');
    px(x-12,y-9-f,9,4+Math.abs(f),'#6b4b86'); px(x+3,y-9-f,9,4+Math.abs(f),'#6b4b86');
    px(x-14,y-8-f,3,3,'#523a68'); px(x+11,y-8-f,3,3,'#523a68');
  }
  else if(e.type==='skel'){

function drawAbyss(){
  const b=boss;
  const x=Math.round(b.x-cam.x), y=Math.round(b.y);
  if(b.cast>0){
    const k=1-b.cast/40;
    if(b.castKind==='slam'){                       // bóng báo trước chỗ xúc tu đập
      const n=b.hp<=bossMax/2?4:3;
      for(let i=0;i<n;i++){
        const tx=Math.round(p.x+(i-(n-1)/2)*44-cam.x);
        ctx.fillStyle='rgba(40,160,190,'+(0.10+k*0.26)+')';
        ctx.fillRect(tx-10,0,20,VH);
        ctx.fillStyle='rgba(20,90,120,'+(0.18+k*0.3)+')';
        ctx.beginPath(); ctx.ellipse(tx,238,14,4,0,0,6.3); ctx.fill();
      }

      ctx.fillStyle=(b.castKind==='spit'?'rgba(80,200,220,':'rgba(60,150,200,')+(0.10+k*0.24)+')';

}

function drawMoon(){
  const b=boss;
  const x=Math.round(b.x-cam.x), y=Math.round(b.y);
  const rage=b.hp<=bossMax/2;
  if(b.cast>0){
    const k=1-b.cast/34;
    const col=b.castKind==='ring'?'rgba(255,60,90,':(b.castKind==='beam'?'rgba(200,120,255,':'rgba(255,150,60,');
    ctx.fillStyle=col+(0.08+k*0.22)+')';
    ctx.beginPath(); ctx.arc(x,y,34+k*40,0,6.3); ctx.fill();
    if(b.castKind==='beam') for(let i=0;i<3;i++){
      ctx.fillStyle=col+(0.06+k*0.14)+')'; ctx.fillRect(0,110+i*46-5,VW,10); }
  }
  ctx.fillStyle='rgba(200,40,70,0.14)';
  ctx.beginPath(); ctx.arc(x,y,52,0,6.3); ctx.fill();
  let al=(b.flash>0&&Math.floor(frame/2)%2)?0.55:1;
  ctx.globalAlpha=al;
  // vầng trăng máu
  ctx.fillStyle=rage?'#c02840':'#8e3550';
  ctx.beginPath(); ctx.arc(x,y,30,0,6.3); ctx.fill();
  ctx.fillStyle=rage?'#e04a5e':'#a8455f';
  ctx.beginPath(); ctx.arc(x,y,27,0,6.3); ctx.fill();
  ctx.fillStyle=rage?'#8e1a2e':'#93394f';

  ctx.arc(x+2,y-16,4,0,6.3); ctx.arc(x-15,y+11,5,0,6.3); ctx.fill();
  // khuôn mặt lộ ra trong trăng
  px(x-11,y-6,7,5,'#2a0810'); px(x+5,y-6,7,5,'#2a0810');
  px(x-9,y-5,3,3,rage?'#ffe070':'#ffd257'); px(x+7,y-5,3,3,rage?'#ffe070':'#ffd257');
  px(x-8,y+7,17,3,'#2a0810');
  for(let i=0;i<5;i++) px(x-7+i*4,y+7,2,4,'#e8d8c0');

  const n=rage?9:7;
  for(let i=0;i<n;i++){
    const a=b.ring+i*6.283/n, r=44+Math.sin(b.t*0.04+i)*4;

  }
  ctx.globalAlpha=1;
}

function drawBoss(){
  const b=boss; if(!b)return;
  if(b.kind==='moon'){ drawMoon(); return; }
  if(b.kind==='abyss'){ drawAbyss(); return; }
  if(b.kind==='lord'){ drawLord(); return; }
  if(b.kind==='shadow'){ drawShadow(); return; }
  if(b.kind==='demon'){ drawDemon(); return; }
  if(b.kind==='count'){ drawCount(); return; }
  const x=Math.round(b.x-cam.x), y=Math.round(b.y);
  if(b.dive>0){
    ctx.fillStyle='rgba(220,60,90,0.16)';
    ctx.beginPath(); ctx.arc(x,y-18,30,0,6.3); ctx.fill();
  }
  if(b.cast>0){
    const k=1-b.cast/32;
    ctx.fillStyle=b.castKind==='wall'?'rgba(255,180,60,'+(0.10+k*0.22)+')':'rgba(120,200,255,'+(0.10+k*0.22)+')';
    ctx.beginPath(); ctx.arc(x+18,y-40,10+k*14,0,6.3); ctx.fill();
    if(b.castKind==='wall'){
      ctx.fillStyle='rgba(255,180,60,'+(0.06+k*0.14)+')';
      ctx.fillRect(0,226,VW,15);
    }
  }
  let al=1;
  if(b.warp>0){ const a=b.warp>13?(26-b.warp)/13:b.warp/13; al=1-a; }
  if(b.flash>0&&Math.floor(frame/2)%2)al*=0.5;
  stampOutlined(BUF_B,x,y,al,g=>drawDeathBody(b,x,y,g));
}

function drawItem(it){
  const x=Math.round(it.x-cam.x), bl=Math.floor(frame/6)%2;
  // it.y là mặt sàn nơi đồ dừng: nâng hình lên đúng phần thò xuống dưới tâm để đáy chạm sàn
  const SINK={heart:3,heart5:3,whip:9,blood:14,katana:10,dagger:3,axe:7,holy:5,meat:4}[it.t]||0;
  const y=Math.round(it.y)-SINK-1;
  if(it.life<90&&Math.floor(frame/4)%2)return;
  if(it.t==='wpn'){
    if(it.life<180&&Math.floor(frame/5)%2) return;          // nhấp nháy trước khi biến mất
    const col=it.rar===4?('hsl('+((frame*5)%360)+',90%,62%)'):RARITY[it.rar].c, bob=Math.sin(frame*0.1+it.x)*2;
    const beam=it.rar>=1?(0.10+it.rar*0.06):0.06;
    const grd=ctx.createLinearGradient(0,y-90,0,y);
    grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,col);
    ctx.globalAlpha=beam+Math.sin(frame*0.15)*0.03;
    ctx.fillStyle=grd; ctx.fillRect(x-5,y-90,10,90);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(10,6,16,0.7)'; ctx.fillRect(x-9,y-22+bob,18,18);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(x-8.5,y-21.5+bob,17,17);
    drawSwordIcon(x,y-13+bob,it.wi);
    return;
  }
  if(it.t==='heart'||it.t==='heart5'){
    const c=it.t==='heart5'?'#5aa8e8':'#e8506a';
    px(x-5,y-6,4,3,c);px(x+1,y-6,4,3,c);px(x-5,y-4,10,3,c);px(x-3,y-1,6,2,c);px(x-1,y+1,2,2,c);

  else if(it.t==='blood'){
    ctx.fillStyle='rgba(200,20,50,0.18)'; ctx.beginPath(); ctx.arc(x,y-2,13,0,6.3); ctx.fill();

    px(x-5,y+4,10,3,'#2a1018'); px(x-6,y+4,3,2,'#8a1020'); px(x+3,y+4,3,2,'#8a1020');
    px(x-1,y+4,2,3,'#ff2244');                       // hồng ngọc
    px(x-1,y+7,2,4,'#241016');
    if(Math.floor(frame/8)%3===0) px(x,y+12,1,2,'#c8203c');   // giọt máu nhỏ
  }
  else if(it.t==='katana'){
    for(let i=0;i<13;i++){const cx=Math.round(Math.pow(i/13,2)*3);
      px(x-1+cx,y-10+i,3,1,'#9aa4bb'); px(x-1+cx,y-10+i,1,1,'#eef4ff');}
    px(x-3,y+3,7,2,'#eac54c'); px(x-1,y+5,3,5,'#241a24');
    px(x-1,y+6,3,1,'#8d7a5e'); px(x-1,y+8,3,1,'#8d7a5e');
    if(Math.floor(frame/5)%2)px(x+4,y-11,2,2,'#fff');
  }
  else if(it.t==='dagger'){px(x-6,y-2,12,3,'#d8d2e4');px(x-7,y-4,3,7,'#8a6a3a');}
  else if(it.t==='axe'){px(x-1,y-7,3,14,'#8a5a2a');px(x-7,y-8,7,6,'#c8cede');px(x+2,y-8,5,6,'#c8cede');}
  else if(it.t==='holy'){px(x-4,y-6,8,11,'#7ec8e8');px(x-2,y-8,4,3,'#c8e8f8');}
  else if(it.t==='meat'){px(x-7,y-5,14,9,'#a8442a');px(x-5,y-7,10,4,'#c8623a');px(x+4,y-2,5,4,'#e8e0d0');}
  if(bl)px(x-8,y-9,2,2,'#fff');
}
function drawStairHints(){

    for(const pair of ends){
      const q=pair[0];

function drawTorches(){
  for(const t of torches){
    const x=Math.round(t.x-cam.x), y=Math.round(t.y);
    if(x<-24||x>VW+24) continue;
    const fy=t.fy!==undefined?Math.round(t.fy):y+30;
    px(x-1,y+4,3,fy-y-6,'#2a2018'); px(x-1,y+4,1,fy-y-6,'#4a3a28');   // cột sắt cắm xuống sàn
    px(x-4,fy-3,9,3,'#2a2018'); px(x-3,fy-4,7,1,'#4a3a28');           // đế
    px(x-5,y,11,4,'#3a2c1e'); px(x-5,y,11,1,'#6a5434'); px(x-3,y+4,7,2,'#2a2018');   // chậu than
    const f=Math.sin(frame*0.28+t.x)*1.4;
    const tg=ctx.createRadialGradient(x,y-9,1,x,y-9,20);
    tg.addColorStop(0,'rgba(255,180,80,0.32)'); tg.addColorStop(1,'rgba(255,170,60,0)');
    ctx.fillStyle=tg; ctx.fillRect(x-20,y-29,40,40);
    px(x-3,y-10+f,6,9,'#ff8c20'); px(x-2,y-13+f,4,8,'#ffb444'); px(x-1,y-15+f,2,6,'#ffe89a');
  }
}
function drawLamps(){
  for(const l of lamps){
    const x=Math.round(l.x-cam.x); if(x<-20||x>VW+20) continue;
    const sw=Math.sin(frame*0.03+l.x)*1.2, ly=Math.round(l.y);
    px(x,l.by+1,1,ly-l.by-5,'#3a3036');                       // xích treo từ đỉnh vòm
    px(Math.round(x-3+sw),ly-5,7,2,'#2a2018');                 // nắp đèn
    px(Math.round(x-3+sw),ly-3,7,8,'#4a3a28');
    const fl=0.75+Math.sin(frame*0.31+l.x)*0.15;
    ctx.globalAlpha=fl; px(Math.round(x-2+sw),ly-2,5,6,'#ffb444'); px(Math.round(x-1+sw),ly-1,3,3,'#ffe89a');
    ctx.globalAlpha=1;
    px(Math.round(x-3+sw),ly+5,7,1,'#2a2018');
  }
}
function drawCandles(){
  for(const c of candles){
    if(!c.alive)continue;
    if(c.x<cam.x-20||c.x>cam.x+VW+20)continue;
    const x=Math.round(c.x-cam.x), fy=Math.round(c.y)+2;   // fy = mặt sàn, chân nến đặt TRÊN đó
    // vầng sáng mờ dần (không phải đĩa phẳng)
    const f=Math.sin(frame*0.3+c.x)*1, gy=fy-22;
    const gr=ctx.createRadialGradient(x,gy,1,x,gy,18);
    gr.addColorStop(0,'rgba(255,190,90,0.30)'); gr.addColorStop(1,'rgba(255,170,60,0)');
    ctx.fillStyle=gr; ctx.fillRect(x-18,gy-18,36,36);
    // chân nến sắt: đế -> thân -> đĩa hứng sáp
    px(x-5,fy-2,11,2,'#2a2018'); px(x-4,fy-3,9,1,'#5a4630');
    px(x-1,fy-12,3,9,'#3a2c1e'); px(x-1,fy-12,1,9,'#6a5434');
    px(x-2,fy-8,5,1,'#5a4630');                                   // khấc giữa thân
    px(x-4,fy-14,9,2,'#4a3a28'); px(x-4,fy-14,9,1,'#7a6040');     // đĩa hứng sáp
    // cây nến + sáp chảy
    px(x-2,fy-21,5,7,'#e8dcc0'); px(x-2,fy-21,1,7,'#fff4e0'); px(x+2,fy-21,1,7,'#c8b48a');
    px(x+2,fy-17,1,3,'#e8dcc0'); px(x-3,fy-15,1,2,'#e8dcc0');    // giọt sáp
    px(x,fy-22,1,1,'#3a2c1e');                                   // bấc
    px(x-2,fy-28+f,4,6,'#ff9c30'); px(x-1,fy-30+f,2,5,'#ffe07a');
  }
}
// biểu tượng nhỏ của từng cây kiếm, dùng cho nút đổi và cho HUD
function drawMythBlade(g,len,w){
  // chuôi + chắn
  g.fillStyle='#1a1018'; g.fillRect(-9,-2,10,4);
  g.fillStyle=w.guard;   for(let i=-8;i<1;i+=3) g.fillRect(i,-2,1,4);
  g.fillStyle=w.guard;   g.fillRect(-11,-3,3,6);
  g.fillStyle=w.guard;   g.fillRect(1,-7,4,14);
  g.fillStyle=w.hi;      g.fillRect(2,-1,2,2);                  // ngọc giữa chắn
  // hào quang
  const pulse=0.22+Math.sin(frame*0.2)*0.08;
  g.globalAlpha=pulse; g.fillStyle=w.glow; g.fillRect(4,-7,len+4,14); g.globalAlpha=1;
  const sh=w.shape;
  if(sh==='curve'){                                           // lưỡi cong một bên
    for(let i=0;i<len;i++){ const u=i/len, cy=u*u*6;
      g.fillStyle=w.col; g.fillRect(5+i,cy-2,1,4);
      g.fillStyle=w.hi;  g.fillRect(5+i,cy+1,1,1); }
  } else if(sh==='wave'){                                     // lưỡi lượn sóng như lửa
    for(let i=0;i<len;i++){ const hw=3+Math.sin(i*0.55)*1.4;
      g.fillStyle=w.col; g.fillRect(5+i,-hw,1,hw*2);
      g.fillStyle=w.hi;  g.fillRect(5+i,-hw,1,1); }
  } else {
    const bw=sh==='broad'?8:5;
    g.fillStyle=w.col; g.fillRect(5,-bw/2,len,bw);
    g.fillStyle=w.hi;  g.fillRect(5,-bw/2,len,1);
    g.fillStyle='rgba(0,0,0,0.35)'; g.fillRect(5,-0.5,len-6,1);  // rãnh máu
    if(sh==='jagged') for(let i=6;i<len-4;i+=5){ g.fillStyle=w.col; g.fillRect(5+i,-bw/2-2,3,2);
                                                   g.fillStyle=w.hi; g.fillRect(5+i,-bw/2-2,1,1); }
  }
  // mũi kiếm
  g.fillStyle=w.col; g.beginPath(); g.moveTo(5+len,-3); g.lineTo(5+len+7,0); g.lineTo(5+len,3); g.closePath(); g.fill();
  g.fillStyle=w.hi; g.fillRect(5+len,-1,5,1);
  // ấn ký chạy dọc lưỡi
  for(let k=0;k<3;k++){ const rx=5+((frame*1.4+k*len/3)%len);
    g.fillStyle=w.glow; g.fillRect(Math.round(rx),-1,2,2); }
}
function drawSwordIcon(cx,cy,i){
  const t=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(cx+x),Math.round(cy+y),w,h);};
  if(i===3){                                   // katana: lưỡi cong
    for(let k=0;k<11;k++){const u=k/11; t(-5+k,-4+Math.round(u*u*4),1,2,'#9aa4bb');
      if(k%3===0)t(-5+k,-4+Math.round(u*u*4),1,1,'#e8eefb');}
    t(-6,-4,2,5,'#b08a2e'); t(-8,-3,2,3,'#241a24');
  } else if(i===4){                            // huyết kiếm: lõi đen rìa đỏ
    t(-2,-7,3,11,'#2a0a12'); t(-2,-7,1,11,'#c8203c'); t(0,-7,1,11,'#8e1224');
    t(-4,3,7,2,'#8a1020'); t(-1,5,2,3,'#241016'); t(-1,3,2,2,'#ff2244');
  } else if(i>=10){                             // thần khí: lưỡi có hào quang
    const w=W[i];
    ctx.globalAlpha=0.35+Math.sin(frame*0.2)*0.15; t(-4,-10,8,16,w.glow); ctx.globalAlpha=1;
    const bw2=w.shape==='broad'?4:3;
    t(-bw2/2,-10,bw2,12,w.col); t(-bw2/2,-10,1,12,w.hi);
    t(-4,2,8,2,w.guard); t(-1,4,2,4,'#1a1018'); t(-1,2,2,2,w.hi);
    if(w.shape==='jagged'){ t(bw2/2,-8,2,2,w.col); t(bw2/2,-4,2,2,w.col); }
  } else if(i===5){                            // giáo
    t(-1,-8,2,16,'#6b4a2a'); t(-2,-11,4,4,'#b8c0d0'); t(-1,-12,2,2,'#eef2ff'); t(1,-6,2,3,'#c8203c');
  } else if(i===6){                            // song đao
    t(-4,-6,2,9,'#c8cede'); t(-4,-6,1,9,'#f4f8ff'); t(-5,3,4,2,'#b08a2e');
    t(2,-6,2,9,'#c8cede'); t(2,-6,1,9,'#f4f8ff'); t(1,3,4,2,'#b08a2e');
  } else if(i===7){                            // búa chiến
    t(-1,-4,2,12,'#5c3818'); t(-6,-9,12,7,'#4a4f5c'); t(-6,-9,12,2,'#6a7080');
  } else if(i===8){                            // roi xích
    for(let k=0;k<6;k++) t(-6+k*2,-6+Math.round(Math.sin(k)*3),2,2,k%2?'#7a8090':'#a8b0c0');
    t(6,-7,2,2,'#e0e6f2'); t(-7,2,3,5,'#5c3818');
  } else if(i===9){                            // liềm hái
    t(-1,-6,2,14,'#3a2a20');
    ctx.strokeStyle='#c8cede'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx-2,cy-7,6,-0.3,1.9); ctx.stroke();
  } else {                                     // ba cây kiếm thẳng, dài dần
    const L=[7,9,11][i], Wd=[2,3,3][i];
    t(-Wd/2,-L+2,Wd,L,'#9aa2b6'); t(-Wd/2,-L+2,1,L,'#e8eefb');
    t(-4,3,8,2,'#b08a2e'); t(-1,5,2,3,'#5c3818');
    if(i===2) t(-4,2,8,1,'#d8b85e');
  }
}
function drawHUD(){
  const HH=46;
  ctx.fillStyle='rgba(8,5,16,0.88)'; ctx.fillRect(0,0,VW,HH);
  ctx.fillStyle='#3a3050'; ctx.fillRect(0,HH,VW,1);
  ctx.textBaseline='top'; ctx.textAlign='left';
  const F=z=>{ctx.font='bold '+z+'px ui-monospace,monospace';};
  const R1=8, R2=27;
  F(12);

  // ---- left: score + timer ----
  ctx.fillStyle='#8d7aa8'; ctx.fillText('ĐIỂM',8,R1);
  ctx.fillStyle='#e8e0f4'; ctx.fillText(String(score).padStart(6,'0'),52,R1);
  ctx.fillStyle='#8d7aa8'; ctx.fillText('TG',8,R2);
  ctx.fillStyle=stageTimer<60?(Math.floor(frame/12)%2?'#ff8080':'#e05a5a'):'#e8e0f4';
  ctx.fillText(String(Math.max(0,Math.ceil(stageTimer))).padStart(3,'0'),52,R2);
  ctx.fillStyle='#a890c8'; ctx.fillText(training?'TẬP':'M'+stage,90,R2);
  ctx.fillStyle='#c8a24a'; ctx.fillText('Lv'+prof.lv,116,R2);

  // ---- middle: labelled bars ----
  const BX=206, BW=146, BH=12;
  const bar=(by,val,max,c)=>{
    ctx.fillStyle='#221a30'; ctx.fillRect(BX,by,BW,BH);
    const w=Math.max(0,Math.round(BW*val/max));
    ctx.fillStyle=c; ctx.fillRect(BX,by,w,BH);
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(BX,by,w,3);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(BX,by+BH-2,w,2);
    ctx.strokeStyle='#5a4a76'; ctx.lineWidth=1; ctx.strokeRect(BX+0.5,by+0.5,BW-1,BH-1);
  };
  ctx.fillStyle='#c8b8dc'; ctx.fillText(HEROES[hero].name,146,R1);
  const bossOn=boss&&boss.alive;
  if(bossOn){ ctx.fillStyle='#a890c8'; ctx.fillText(bossName,146,R2); }
  bar(R1-1,p.hp,p.maxhp,'#e04a5a');
  if(hero===0){                                  // vạch hồi xung kích dưới thanh máu
    const k=p.dash>0?0:1-p.dashCd/DASH_CD;
    ctx.fillStyle='#2a1a10'; ctx.fillRect(BX,R1+BH,BW,2);
    ctx.fillStyle=k>=1?(p.airDash&&!p.onGround?'#6a4a30':'#ffb050'):'#8a5a30';
    ctx.fillRect(BX,R1+BH,Math.round(BW*k),2);
  }
  if(bossOn) bar(R2-1,bossHP,bossMax,'#8a3ad0');

  // ---- right: measured so nothing ever clips ----
  ctx.textAlign='right';
  const EDGE=VW-8;

  const lt='MẠNG ×'+Math.max(0,lives);
  ctx.fillStyle='#8d7aa8'; ctx.fillText(lt,EDGE,R1);
  const lw=ctx.measureText(lt).width;

  const ht=String(Math.min(99,p.hearts)).padStart(2,'0');
  const hEnd=EDGE-lw-18;
  ctx.fillStyle='#e8e0f4'; ctx.fillText(ht,hEnd,R1);
  const hx=hEnd-ctx.measureText(ht).width-15;
  ctx.fillStyle='#e8506a';
  ctx.fillRect(hx,R1+1,4,3); ctx.fillRect(hx+6,R1+1,4,3);
  ctx.fillRect(hx,R1+3,10,4); ctx.fillRect(hx+2,R1+7,6,2); ctx.fillRect(hx+4,R1+9,2,2);

  const tb=(prof.wlv&&prof.wlv[p.whip])?(' +'+prof.wlv[p.whip]):'';
  const wn=(ownCount()>1?'◂ ':'')+SWORDNAME[p.whip]+tb+(ownCount()>1?' ▸':'');
  ctx.fillStyle=p.whip===BLOOD?(Math.floor(frame/16)%2?'#ff6a80':'#e0304c'):(p.whip===3?'#d8c8f0':'#c8b8dc');
  ctx.fillText(wn,EDGE,R2);
  if(p.whip===BLOOD){                       // vạch đếm tới lần rút máu kế tiếp
    const w=Math.round(28*(1-(p.drainT||0)/DRAIN));
    ctx.fillStyle='#3a1018'; ctx.fillRect(EDGE-28,R2+14,28,2);
    ctx.fillStyle='#c8203c'; ctx.fillRect(EDGE-28,R2+14,w,2);
  }
  if(p.sub){
    const ix=EDGE-ctx.measureText(wn).width-22, iy=R2+7;
    if(p.sub==='dagger'){px(ix-6,iy-1,12,3,'#d8d2e4');px(ix-7,iy-3,3,7,'#8a6a3a');}
    if(p.sub==='axe'){px(ix-1,iy-6,3,12,'#8a5a2a');px(ix-6,iy-7,6,5,'#c8cede');px(ix+2,iy-7,5,5,'#c8cede');}
    if(p.sub==='holy'){px(ix-4,iy-6,8,11,'#7ec8e8');px(ix-2,iy-8,4,3,'#c8e8f8');}
  }
  ctx.textAlign='left';
}

let gearRow=0;                                   // 0..2 đồ · 3 tạo hình · 4 kho vũ khí
function updateGear(){
  if(K.downP){gearRow=(gearRow+1)%5;SFX.candle();}
  if(K.upP){gearRow=(gearRow+4)%5;SFX.candle();}
  const step=(d)=>{
    if(gearRow<3){
      const slot=GSLOT[gearRow], list=GEAR[slot];
      for(let k=0;k<list.length;k++){
        const n=(prof.gear[gearRow]+d*(k+1)+list.length*4)%list.length;
        if(list[n].lv<=prof.lv){ prof.gear[gearRow]=n; SFX.item(); saveProf(); break; }
      }
    } else if(gearRow===4){                     // chọn vũ khí mang theo đầu lượt
      for(let k=1;k<=NSW;k++){
        const n=(prof.startW+d*k+NSW*4)%NSW;
        if(prof.owned[n]){ prof.startW=n; prof.startSet=true; SFX.item(); saveProf(); break; }
      }
    } else {
      const list=SKINS[hero];
      for(let k=0;k<list.length;k++){
        const n=(prof.skin[hero]+d*(k+1)+list.length*4)%list.length;
        if(list[n].lv<=prof.lv){ prof.skin[hero]=n; applySkin(); SFX.item(); saveProf(); break; }
      }
    }
  };
  if(K.leftP)step(-1);
  if(K.rightP)step(1);
  if((K.jumpP||K.atkP)&&gearRow===4&&gearFrom!=='menu'){ startTraining(); return; }
  if(K.jumpP||K.atkP){ state=(gearFrom==='menu')?'menu':'title'; }
  if(tap){
    if(tap.y>=238&&tap.y<256&&gearFrom!=='menu'){ tap=null; startTraining(); return; }
    if(tap.y>=256){ state=(gearFrom==='menu')?'menu':'title'; }
    else { const r=Math.floor((tap.y-88)/30); if(r>=0&&r<5){ gearRow=r; step(tap.x<VW/2?-1:1); } }
    tap=null;
  }
}
function drawArmoryRow(y,sel){

  ctx.fillStyle=sel?'rgba(120,70,160,0.30)':'rgba(26,18,40,0.55)'; ctx.fillRect(30,y,VW-60,27);
  ctx.strokeStyle=sel?(Math.floor(frame/10)%2?'#e8d8a0':'#b09050'):'#3a3050'; ctx.lineWidth=1;
  ctx.strokeRect(30.5,y+0.5,VW-61,26);

  ctx.font='bold 11px ui-monospace,monospace'; ctx.fillStyle=rc;

  ctx.font='bold 7px ui-monospace,monospace'; ctx.fillStyle='#8d7aa8';

    ctx.fillText('◂',34,y+9); ctx.textAlign='right'; ctx.fillText('▸',VW-34,y+9); ctx.textAlign='left'; }

function draw(){

  }
  ctx.globalAlpha=1;
  drawStairHints();
  for(const m of movers){

    const gcx=gb.x+gb.w/2, gcy=gb.y+11;
    ctx.fillStyle='#c8b070';
    for(let i=0;i<8;i++){ const a=i*0.785+frame*0.008;
      ctx.fillRect(Math.round(gcx+Math.cos(a)*6-1.5),Math.round(gcy+Math.sin(a)*6-1.5),3,3); }
    ctx.fillStyle='#8d7aa8'; ctx.beginPath(); ctx.arc(gcx,gcy,3,0,6.3); ctx.fill();
    ctx.font='bold 7px ui-monospace,monospace'; ctx.textAlign='center'; ctx.fillStyle='#c8b070';
    ctx.fillText('Lv'+prof.lv,gcx,gb.y+gb.h-8); ctx.textAlign='left';
  }

  if(state==='story'){ drawScene(); return; }
  if(state==='gear'){ drawGear(); return; }
  if(state==='title'){
    ctx.textAlign='center';
    if(!isLand){
      ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#6d5f85';
      ctx.fillText('↻ Xoay ngang · ⛶ Toàn màn hình (F) để khung lớn nhất',VW/2,6);
    }
    ctx.font='bold 27px ui-monospace,monospace';
    ctx.fillStyle='#3a0f1a'; ctx.fillText('LÂU ĐÀI',VW/2+3,43); ctx.fillText('NGUYỆT HUYẾT',VW/2+3,71);
    ctx.fillStyle='#d8c078'; ctx.fillText('LÂU ĐÀI',VW/2,40);   ctx.fillText('NGUYỆT HUYẾT',VW/2,68);
    ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#9b88b8';
    ctx.fillText('Trăm năm một lần, trăng hoá màu máu — và lâu đài trở về',VW/2,100);
    // nút Trang bị: khung rõ ràng + thanh kinh nghiệm
    const gw=214, gx=VW/2-gw/2, gy=108;
    ctx.fillStyle='rgba(40,28,60,0.80)'; ctx.fillRect(gx,gy,gw,28);
    ctx.strokeStyle=Math.floor(frame/16)%2?'#e8d8a0':'#b09050';
    ctx.lineWidth=2; ctx.strokeRect(gx+1,gy+1,gw-2,26);
    ctx.font='bold 11px ui-monospace,monospace'; ctx.textAlign='left';
    ctx.fillStyle='#e8d8a0'; ctx.fillText('⚙ TRANG BỊ',gx+10,gy+5);
    ctx.textAlign='right'; ctx.fillStyle='#c8b070';
    ctx.fillText('CẤP '+prof.lv,gx+gw-10,gy+5);
    const need=xpNeed(prof.lv), pct=prof.lv>=LVMAX?1:prof.xp/need;
    ctx.fillStyle='#241b33'; ctx.fillRect(gx+10,gy+19,gw-20,5);
    ctx.fillStyle='#c8a24a'; ctx.fillRect(gx+10,gy+19,Math.round((gw-20)*pct),5);
    ctx.textAlign='center';

    // ---- chọn nhân vật ----
    for(let i=0;i<2;i++){
      const sel=hero===i, cx=HSLOT[i];
      ctx.fillStyle=sel?'rgba(120,70,160,0.30)':'rgba(30,22,48,0.55)';
      ctx.fillRect(cx-46,HBOXT,92,HBOXH);
      ctx.strokeStyle=sel?(Math.floor(frame/8)%2?'#e8d8a0':'#b09050'):'#3a3050';
      ctx.lineWidth=1; ctx.strokeRect(cx-45.5,HBOXT+0.5,91,HBOXH-1);
      // chân dung: cắt phần đầu + vai (116x116 px thật = 58x58 logic), nhân vật chưa chọn thì mờ đi
      drawPortrait(i,22,10,116,116,cx-24,HBOXT+2,sel?1:0.45,48,48);   // 140..188
      ctx.textBaseline='top';                                          // canh mép trên: xếp chữ chính xác
      ctx.font='bold 11px ui-monospace,monospace';
      ctx.fillStyle=sel?'#f0e4c0':'#7d6d99';
      ctx.fillText(HEROES[i].name,cx,190);
      ctx.font='bold 8px ui-monospace,monospace';
      ctx.fillStyle=sel?'#b8a8d0':'#5d5078';
      ctx.fillText(HEROES[i].tag,cx,203);
      ctx.font='bold 7px ui-monospace,monospace';
      ctx.fillStyle=sel?'#9b88b8':'#4e4266';
      ctx.fillText(HEROLORE[i],cx,213);
      if(saves[i]){                                  // nhãn bản lưu riêng của từng tướng
        ctx.fillStyle='rgba(20,60,34,0.85)'; ctx.fillRect(cx-30,HBOXT+3,60,11);
        ctx.strokeStyle='#4a8a5c'; ctx.lineWidth=1; ctx.strokeRect(cx-29.5,HBOXT+3.5,59,10);
        ctx.font='bold 7px ui-monospace,monospace'; ctx.fillStyle='#8ce8a0';
        ctx.fillText('▣ LƯU · MÀN '+saves[i].stage,cx,HBOXT+5);
      }
    }
    ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#c8b070';
    ctx.fillText('HP '+HEROES[hero].hp+'  ·  '+(hero?'chạy nhanh, nhảy cao, vung kiếm lẹ':'▼+KIẾM: lao xuyên địch, lao được cả trên không'),VW/2,230);

    // ---- chọn màn ----
    const canL=selStage>(curSave()?0:1), canR=selStage<maxStage;
    ctx.fillStyle='rgba(30,22,48,0.62)'; ctx.fillRect(VW/2-118,240,236,17);
    ctx.strokeStyle='#4a3a63'; ctx.lineWidth=1; ctx.strokeRect(VW/2-117.5,240.5,235,16);
    ctx.font='bold 11px ui-monospace,monospace';
    ctx.fillStyle=canL?'#e8d8a0':'#3a3050'; ctx.fillText('◂',VW/2-104,243);
    ctx.fillStyle=canR?(Math.floor(frame/14)%2?'#e8d8a0':'#b09050'):'#3a3050'; ctx.fillText('▸',VW/2+104,243);
    const sv=curSave();
    if(selStage===0&&sv){
      ctx.fillStyle='#8ce8a0';
      ctx.fillText('▸ TIẾP TỤC  ·  MÀN '+sv.stage+'  ·  '+String(sv.score).padStart(6,'0'),VW/2,243);
    } else {
      ctx.fillStyle='#c8b8dc';
      ctx.fillText('MÀN '+selStage+' · '+STAGENAMES[selStage],VW/2,243);
    }
    if(sv){ ctx.fillStyle=selStage===0?'#8ce8a0':'#3f6a4a';
      ctx.fillRect(VW/2-62,259,10,3); }
    for(let i=1;i<=7;i++){
      const on=i<=maxStage, cur=i===selStage;
      ctx.fillStyle=cur?'#e8d8a0':(on?'#6a5c80':'#2e2640');
      ctx.fillRect(VW/2-48+(i-1)*14,259,10,3);
    }
    if(maxStage<7){
      ctx.font='bold 8px ui-monospace,monospace'; ctx.fillStyle='#5d5078';
      ctx.fillText('màn sau mở khi bạn tới được',VW/2,265);
    } else if(hiScores.length){
      const b=hiScores[0];
      ctx.font='bold 8px ui-monospace,monospace'; ctx.fillStyle='#8a7a4a';
      ctx.fillText('KỶ LỤC '+String(b.s).padStart(6,'0')+' · '+b.h,VW/2,265);
    }
    ctx.fillStyle=Math.floor(frame/24)%2?'#e8e0f4':'#6d5f85';
    ctx.font='bold 11px ui-monospace,monospace';
    ctx.fillText('NHẢY ĐỂ VÀO  ·  ◀▶ nhân vật  ·  ▲▼ màn',VW/2,275);
    ctx.textAlign='left';
  }
  if(state==='story'){ updateScene(); return; }
  if(state==='gear'){ updateGear(); return; }
  if(state==='menu'){
    ctx.fillStyle='rgba(6,4,12,0.82)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';
    ctx.textBaseline='top';
    ctx.fillStyle='rgba(6,4,12,0.9)'; ctx.fillRect(0,0,VW,46);   // che hẳn HUD sau tiêu đề
    ctx.font='bold 14px ui-monospace,monospace';
    ctx.fillStyle='#1a0e20'; ctx.fillText('TẠM DỪNG',VW/2+2,26);
    ctx.fillStyle='#e8d8a0'; ctx.fillText('TẠM DỪNG',VW/2,24);
    ctx.fillStyle='#3a2e52';                                   // đường kẻ chia nhóm
    ctx.fillRect(VW/2-90,menuY(5)-7,180,1); ctx.fillRect(VW/2-90,menuY(10)-7,180,1);
    for(let i=0;i<MENU.length;i++){
      const yy=menuY(i), sel=menuSel===i;
      if(sel){
        ctx.fillStyle='rgba(120,70,160,0.35)'; ctx.fillRect(VW/2-116,yy-3,232,16);
        ctx.strokeStyle='#b09050'; ctx.lineWidth=1; ctx.strokeRect(VW/2-115.5,yy-2.5,231,15);
      }
      ctx.font='bold 11px ui-monospace,monospace';
      ctx.fillStyle=i===10?(sel?'#ff9a9a':'#a05a6a'):(sel?'#f4ead0':'#7d6d99');
      const label=(i===1)?('Lưu game  ·  ô '+HEROES[hero].name+' · màn '+stage)
                 :(i===2)?('Trang bị & tạo hình  ·  Cấp '+prof.lv)
                 :(i===3&&training)?'⟵ Rời bãi tập'
                 :(i===5)?('Độ sáng:  ◂ '+LIGHTS[lightLv].n+' ▸')
                 :(i===6)?('Cỡ nút:  ◂ '+PADS[padSize].n+' ▸')
                 :(i===7)?('Số sát thương:  ◂ '+(dmgNums?'Bật':'Tắt')+' ▸')
                 :(i===8)?('Nhạc:  ◂ '+(musicOn?'Bật':'Tắt')+' ▸')
                 :(i===9)?('Toàn màn hình:  ◂ '+(fsEl()?'Bật':'Tắt')+' ▸')
                 :(i===10&&frame<resetArm)?'Chạm lần nữa để xoá bản lưu':MENU[i];
      ctx.fillText((sel?'▸ ':'')+label,VW/2,yy+1);
    }
    ctx.font='bold 9px ui-monospace,monospace'; ctx.fillStyle='#6d5f85';
    ctx.fillText('chạm để chọn · ▲▼ + NHẢY · Esc/P đóng',VW/2,262);
    ctx.fillText('Điểm '+score+' · '+HEROES[hero].name+' · Cấp '+prof.lv+' · '+SWORDNAME[p.whip]+' · MÀN '+stage,VW/2,274);
    ctx.textAlign='left';
  }
  if(state==='dead')drawOverlay('NGÃ XUỐNG','Còn '+lives+' mạng','Nhấn NHẢY để tiếp tục');
  if((state==='over'||state==='clear')&&hiScores.length) drawScoreBoard();
  if(state==='over')drawOverlay('HẾT MẠNG','Điểm: '+score,'NHẢY chơi lại  ·  ▲ đổi nhân vật');
  if(state==='clear')drawOverlay('PHÁ ĐẢO LÂU ĐÀI','Điểm: '+score,'NHẢY chơi lại  ·  ▲ đổi nhân vật');
}

/* ================= LOOP ================= */
function update(){
  frame++;
  if(state==='title'){
    if(K.leftP&&hero!==0){hero=0;applySkin();fixSel();SFX.candle();}
    if(K.rightP&&hero!==1){hero=1;applySkin();fixSel();SFX.candle();}
    const loSel=curSave()?0:1;
    if(K.upP&&selStage<maxStage){selStage++;SFX.item();}
    if(K.downP&&selStage>loSel){selStage--;SFX.item();}
    if(tap){                                  // tapping a portrait picks, it does not start
      for(let i=0;i<2;i++){
        if(Math.abs(tap.x-HSLOT[i])<52&&tap.y>HBOXT-8&&tap.y<HBOXT+HBOXH+8){
          if(hero!==i){hero=i;applySkin();fixSel();SFX.candle();}
          K.anyP=0; break;
        }
      }
    }
    if(tap&&tap.y>100&&tap.y<142&&Math.abs(tap.x-VW/2)<115){
      state='gear'; gearFrom='title'; gearRow=0; tap=null; K.anyP=0;
    }
    if(tap&&tap.y>238&&tap.y<256){                 // chạm hàng chọn màn
      if(tap.x<VW/2&&selStage>(curSave()?0:1)){selStage--;SFX.item();}
      else if(tap.x>VW/2&&selStage<maxStage){selStage++;SFX.item();}
      K.anyP=0; tap=null;
    }
    if(K.jumpP||K.atkP||K.anyP){
      const n=selStage;
      if(n===0) resumeSave();
      else if(n===1) playScene(STORY.open[hero],'open',()=>{ gotoStage(1,true); });
      else gotoStage(n,true);
    }
    return;
  }
  if(state==='story'){ updateScene(); return; }
  if(state==='gear'){ updateGear(); return; }
  if(state==='menu'){
    if(K.upP){menuSel=(menuSel+MENU.length-1)%MENU.length;SFX.candle();}
    if(K.downP){menuSel=(menuSel+1)%MENU.length;SFX.candle();}
    // chạm thẳng vào một mục = chọn + kích hoạt; chạm nút ☰ lần nữa = đóng menu
    let act=K.jumpP||K.atkP;
    if(tap){
      const b=PAUSEBTN;
      if(tap.x>b.x-8&&tap.x<b.x+b.w+8&&tap.y>b.y-8&&tap.y<b.y+b.h+8){ tap=null; state='play'; return; }
      if(Math.abs(tap.x-VW/2)<120) for(let i=0;i<MENU.length;i++){
        const yy=menuY(i); if(tap.y>=yy-4&&tap.y<yy+13){ menuSel=i; act=true; break; } }
      tap=null;
    }
    if(act){
      SFX.item();
      if(menuSel===0) state='play';
      else if(menuSel===1){ writeSave(); state='play'; }
      else if(menuSel===2){ state='gear'; gearFrom='menu'; gearRow=0; }
      else if(menuSel===3){ if(training){ exitTraining(); } else {state='play';p.cp=0;buildStage(stage);resetStage(true);} }
      else if(menuSel===4){state='title';buildStage(1);p.cp=0;resetStage(true);}
      else if(menuSel===5){ lightLv=(lightLv+1)%LIGHTS.length; saveOpt(); }
      else if(menuSel===6){ padSize=(padSize+1)%PADS.length; applyPad(); saveOpt(); }
      else if(menuSel===7){ dmgNums=!dmgNums; saveOpt(); }
      else if(menuSel===8){ musicOn=!musicOn; document.getElementById('mute').textContent=(musicOn?'🔊':'🔇')+' Nhạc'; audioUnlock(); }
      else if(menuSel===9){ toggleFS(); }
      else if(frame<resetArm){ resetArm=0; fullReset(); }
      else resetArm=frame+180;                         // lần đầu: chỉ hỏi xác nhận
    }
    return;
  }
  if(state==='dead'){ if(K.jumpP||K.anyP){ if(lives>0){state='play';resetStage(false);} else endRun('over'); } return; }
  if(state==='over'||state==='clear'){
    if(K.upP){state='title';buildStage(1);p.cp=0;resetStage(true);return;}
    if(K.jumpP||K.anyP){state='play';p.cp=0;buildStage(stage);resetStage(true);}
    return;
  }

  if(tap&&state==='play'){
    const b=PAUSEBTN, w=SWBTN;
    if(tap.x>b.x-8&&tap.x<b.x+b.w+8&&tap.y>b.y-8&&tap.y<b.y+b.h+8){ tap=null; openMenu(); return; }
    if(ownCount()>1&&tap.x>w.x-8&&tap.x<w.x+w.w+8&&tap.y>w.y-8&&tap.y<w.y+w.h+8){ tap=null; cycleSword(1); }
    const gb=GEARBTN;
    if(tap&&tap.x>gb.x-8&&tap.x<gb.x+gb.w+8&&tap.y>gb.y-8&&tap.y<gb.y+gb.h+8){
      tap=null; gearFrom='menu'; gearRow=0; state='gear'; return;
    }
  }
  if(bossCard>0)bossCard--;
  if(lvUpT>0)lvUpT--;
  if(savedT>0)savedT--;
  if(lootT>0)lootT--;
  if(intro>0)intro--;
  if(training&&trainRespawn.length){
    trainRespawn=trainRespawn.filter(r=>{ if(frame<r.at) return true;
      const e=makeEnemy(r.def); enemies.push(e); for(let i=0;i<6;i++)burst(e.x,e.y-12,'#d8b870',1,2); return false; });
  }
  tick++;
  if(!training&&tick%40===0&&stageTimer>0&&!p.dead&&endT===0){stageTimer--; if(stageTimer<=0)killPlayer(false);}

  updateCracks();
  tickMyth();
  updateMovers();
  updatePlayer();
  updateFlow();
  updateEnemies();
  updateBoss();
  updateShots();

  // checkpoints
  if(!p.dead){
    // mốc lấy từ chính CHECK của màn đang chơi, không dùng số cứng
    for(let i=CHECK.length-2;i>=1;i--){
      if(p.cp>=i) break;
      const c=CHECK[i];
      if(p.x>c.x-24&&Math.abs(p.y-c.y)<40&&p.onGround){ p.cp=i; writeSave(true); break; }
    }
  }
  if(p.dead){ p.deadT++; if(p.deadT>70){ lives--; if(lives<0) endRun('over'); else state='dead'; } }

  if(endT>0){
    endT++;
    if(endT===2) score+=[0,10000,20000,40000,80000,160000,320000,640000][stage];
    if(endT>150){
      if(stage<7){ nextStage(); }
      else { submitted||submitScore(); submitted=true;
             playScene(STORY.end[hero],'end',()=>{ state='clear'; }); }
    }
  }

  // camera
  let target=p.x-VW/2;
  if(cam.lock>=0) cam.x=cam.lock;
  else cam.x+=((Math.max(0,Math.min(LW-VW,target)))-cam.x)*0.14;
  if(cam.x<0)cam.x=0; if(cam.x>LW-VW)cam.x=LW-VW;
  if(cam.lock>=0&&p.x<cam.lock+14)p.x=cam.lock+14;
}
let last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  acc+=Math.min(100,t-last); last=t;
  while(acc>=16.667){ update(); clearEdges(); acc-=16.667; }
  draw();
}
const LANDQ='(orientation:landscape) and (max-height:620px) and (pointer:coarse),'
             +'(orientation:landscape) and (max-height:620px) and (max-width:960px)';
let isLand=false;
function fit(){
  const wrap=document.getElementById('wrap');
  isLand=window.matchMedia?window.matchMedia(LANDQ).matches:false;
  let availW,availH;
  if(isLand){
    // controls float over the canvas, so the canvas gets the full viewport
    availW=Math.max(160,wrap.clientWidth-8);
    availH=Math.max(100,wrap.clientHeight-8);
  } else {
    const padH=document.getElementById('pad').offsetHeight+document.getElementById('bar').offsetHeight+34;
    availW=Math.max(160,wrap.clientWidth-10);
    availH=Math.max(100,wrap.clientHeight-padH);
  }
  let s=Math.min(availW/VW,availH/VH);   // may be <1 on a portrait phone
  if(s>=2)s=Math.floor(s);               // crisp integer steps when there is room
  s=Math.max(0.4,s);
  cv.style.width=Math.round(VW*s)+'px';
  cv.style.height=Math.round(VH*s)+'px';
  // nearest-neighbour only helps when enlarging; shrinking with it eats thin glyph strokes
  cv.style.imageRendering=(s<1?'auto':'pixelated');
}

/* ================= TOÀN MÀN HÌNH ================= */
const noteEl=document.getElementById('note');
let noteT=0;
function note(msg,ms){
  noteEl.textContent=msg; noteEl.style.display='block';
  clearTimeout(noteT); noteT=setTimeout(()=>{noteEl.style.display='none'},ms||4200);
}
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function fsAllowed(){
  return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
}
async function enterFS(){
  const el=document.documentElement, w=document.getElementById('wrap');
  const req=t=>(t.requestFullscreen||t.webkitRequestFullscreen||t.webkitRequestFullScreen||t.msRequestFullscreen);
  for(const t of [el,w]){
    const fn=req(t);
    if(!fn) continue;
    try{ await fn.call(t,{navigationUI:'hide'}); }
    catch(e){ try{ await fn.call(t); }catch(e2){ continue; } }
    if(fsEl()){
      try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
      return true;
    }
  }
  return false;
}
function exitFS(){
  const fn=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  if(fn) try{ fn.call(document); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
async function toggleFS(){
  if(fsEl()){ exitFS(); return; }
  if(!fsAllowed()){
    note('Khung nhúng của app không cho phép toàn màn hình. Dùng nút mở rộng ⤢ của khung artifact, hoặc mở game trong tab riêng.',7000);
    return;
  }
  const ok=await enterFS();
  if(!ok) note('Trình duyệt từ chối toàn màn hình. Thử nút mở rộng ⤢ của khung artifact.',6000);
}
function syncFSBtn(){
  const b=document.getElementById('fs');
  b.textContent=fsEl()?'⛶ Thoát toàn màn':'⛶ Toàn màn hình';
}
document.getElementById('fs').onclick=()=>{toggleFS();audioUnlock();};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{syncFSBtn();fit();setTimeout(fit,140);setTimeout(fit,450);}));
addEventListener('keydown',e=>{ if(e.code==='KeyF'){e.preventDefault();toggleFS();} },{passive:false});
syncFSBtn();

addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
setTimeout(fit,50); setTimeout(fit,400); fit();
requestAnimationFrame(loop);
})();
</script>
